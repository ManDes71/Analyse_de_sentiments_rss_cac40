version: "3.8"

services:
  evaluator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: evaluate-article-service
    restart: unless-stopped
    
    # Permet au conteneur de contacter le PostgreSQL du serveur via host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
      
    environment:
      - PYTHONUNBUFFERED=1  # 🔥 Force l'affichage immédiat des print()
      # Variables PostgreSQL
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      
      # Variables Gemini
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}

    volumes:
      - ./output:/app/output

    networks:
      - docker_postgresql_webproxy

networks:
  docker_postgresql_webproxy:
    external: true