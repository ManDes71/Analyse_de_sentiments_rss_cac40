[project]
name = "market-rss-sentiment"
version = "0.1.0"
description = "Pipeline MLOps d'analyse de sentiment financier ciblé sur flux RSS (Gemini, TF-IDF, CamemBERT, PostgreSQL)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=4.8.5",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
    "google-genai>=1.0.0",
    "nltk>=3.9.4",
    "numpy>=2.4.4",
    "psycopg2-binary>=2.9.12",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "requests>=2.31.0",
    "scikit-learn>=1.8.0",
    "spacy>=3.0.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
