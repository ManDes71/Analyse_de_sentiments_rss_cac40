quérir le groupe américain Republic Wire. Nexans est l'une des valeurs phares pour jouer la transition énergétique au sein de l'univers des câbles. En l'espace de sept années, le fabricant de câbles a totalement changé de visage. Le groupe a remis d'équerre ses activités les moins performantes et s'est recentré sur ses segments liés à l'électrification, c'est-à-dire les câbles pour la production, l'usage et la transmission d'électricité. En ce début d'année 2026,Nexansa encore une fois profité d'une demande dynamique pour ses solutions d'électrification. Entre janvier et mars 2026, l'entreprise a dégagé des revenus de 1,5 milliard d'euros (et de 2,1 milliards d'euros en intégrant les variations des prix du cuivre et de l'aluminiumdepuis 2020), en croissance de 0,1% en données organiques, c'est-à-dire hors effets de changes et de périmètre. Le chiffre d'affaires deNexansressort en ligne avec les attentes des intermédiaires financiers logées à 1,495 milliard d'euros quand la croissance organique est bien meilleure que la prévision moyenne des analystes (-0,1%), selon un consensus cité par Jefferies. Nexans a notamment bénéficié des performances de ses activités d'électrification, dont la croissance organique s'est établie à 4,9%. Cette division a été portée par le dynamisme du segment \"power-transmission\", c'est-à-dire les câbles liés à la génération d'électricité. Ce segment a enregistré une croissance organique de 8,8% sur les trois premiers mois de l'année, revenant ainsi, décritNexans\"à des niveaux de croissance organique normalisés, à l’issue de deux années de performance exceptionnellement élevée, comme anticipé\". Nexans a poursuivi l’expansion commerciale de projets de plus petite taille, tout en mettant en oeuvre des mesures de réduction des coûts, maintenant ainsi une grande agilité dans une activité exigeante et hautement technique. Pour Jefferies, l'année \"a bien démarré\" pourNexans. À l'occasion de ce point d'activité, le fabricant de câbles industriels a confirmé ses objectifs pour l'année 2026.Nexanstable toujours sur un résultat d'exploitation (Ebitda) ajusté compris entre 730 et 810 millions d'euros en 2026 et un flux de trésorerie disponible compris entre 210 et 310 millions d'euros. Le groupe précise attendre une performance plus modérée attendue au premier semestre qu’au deuxième semestre 2026. Il ajoute aussi que ces perspectives excluent la contribution des acquisitions non finalisées, et n’intègrent pas l'exécution de Great Sea Interconnector en 2026, un grand chantier électrique à 1,4 milliard d'euros entre la Grèce et Chypre,pour lequel il a annoncé début janvier un réaménagement du calendrier ", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'entreprise a annoncé l'acquisition du groupe américain Republic Wire, a dévoilé un début d'année 2026 conforme aux attentes avec une croissance organique meilleure que prévu, et a confirmé ses objectifs pour l'année 2026. La transaction est également immédiatement relutive pour le bénéfice par action.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à NEXANS : (1) chiffre d'affaires T1 2026 de 1,5 milliard d'euros conforme aux attentes avec croissance organique de 0,1% meilleure que les prévisions (-0,1%), (2) croissance organique de 4,9% dans les activités d'électrification et 8,8% dans le segment power-transmission, (3) confirmation des objectifs 2026 (Ebitda 730-810M€, flux de trésorerie 210-310M€), (4) acquisition stratégique de Republic Wire (520M€ de CA) immédiatement relutive pour le BPA avec synergies de 23M€ sur 3 ans, (5) l'action grimpe de 8,2% et atteint un plus haut historique. Ces éléments constituent des bonnes nouvelles concrètes et spécifiques."}, {"article_id": 9735, "company_id": 31, "entreprise": "EXOSENS", "source": "www.easybourse.com", "published_at": "2025-12-04", "genre": "article dédié", "titre": "Stifel reste à l'achat sur Exosens après l'accord avec Theon International", "texte": "Stifel reste à l'achat sur Exosens après l'accord avec Theon International Publié le 04 Décembre 2025 (Zonebourse.com) - Stifel confirme son conseil à l'achat sur le titre avec un objectif de cours inchangé de 47 E après l'annonce de la signature d'un contrat avec Theon International. Exosens et Theon International ont annoncé la prolongation de leur contrat d'approvisionnement à long terme pour trois années supplémentaires, jusqu'en 2030. Au cours des prochaines semaines, Theon prévoit de convertir ses options 2027-2028 en commandes fermes, ce qui absorberait une part importante de l'augmentation prévue de la capacité de production récemment annoncée précise stifel. L'analyste estime que cet accord offre une meilleure visibilité et s'inscrit dans la logique de sa stratégie d'investissement. Copyright (c) 2025 Zonebourse.com - All rights reserved.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Exosens a annoncé la prolongation de son contrat d'approvisionnement à long terme avec Theon International pour trois années supplémentaires, jusqu'en 2030, ce qui est un fait concret positif.", "note_haiku": 2, "justification_haiku": "Fait concret positif spécifique à EXOSENS : signature d'un contrat de prolongation d'approvisionnement à long terme avec Theon International jusqu'en 2030, avec conversion prévue d'options en commandes fermes. Cet accord offre une meilleure visibilité selon l'analyste Stifel. La recommandation 'achat' est confirmée avec objectif de cours maintenu à 47€. C'est une bonne nouvelle pour l'activité et la visibilité future de l'entreprise."}, {"article_id": 60042, "company_id": 2, "entreprise": "AIRBUS", "source": "www.abcbourse.com", "published_at": "2026-09-07", "genre": "article dédié", "titre": "Airbus a livré 57 appareils en août et reçu 67 commandes brutes", "texte": "Actualité publiée le 07/09/26 17:58 Airbus a livré 57 appareils en août et reçu 67 commandes brutes rge opérationnelle annuelles seront attendues aux alentours de la moitié inférieure de la fourchette de prévisions. Avec l'explosion des applications d'intelligence artificielle (IA) et des service d'informatique dématérialisée (cloud) , les grands groupes de techs ont dû développer à la vitesse grand V leurs capacités de data centers. Ce qui s'est traduit par une demande accrue pour les produits et services deSchneider Electricpermettant de réduire la consommation d'électricité de ces data centers, des infrastructures par essence énergivores. Fin juillet, le numéro un mondial des équipements électriques basse et moyenne tension avait fait part de niveaux \"records\"de chiffre d'affaires et de résultat opérationnel sur les six premiers mois de l'année. Pour cet été,Schneider Electricse devait donc de livrer une croissance robuste pour ne pas décevoir un marché devenu exigeant. Au final, l'activité du pensionnaire duCAC 40s'est encore révélée à la hauteur. Au troisième trimestre,Schneider Electrica dégagé des revenus de 9,72 milliards d'euros, en croissance de 4,4% en données publiées et de 9% en données comparables (organiques), dépassant largement les attentes, logées à 8,5% pour la croissance organique, selon un consensus cité Oddo BHF. La société a une nouvelle fois profité de cet élan favorable de la demande pour ses solutions dédiées aux centres de données. Une fois n'est pas coutume, l'activité estivale deSchneiderElectrics a clairement été portée par l'Amérique du Nord, où sa croissance en données comparables s'est établie à 14,5% sur le trimestre, avec une progression de 16,6% dans le segment \"gestion de l'énergie\". La société a indiqué avoir encore bénéficié du dynamisme des data centers dans cette région. Citée par Reuters, la directrice financière Hilary Maxson a indiqué que le secteur des centres de données connaissait une croissance rapide, cette activité devant représenter plus de 24% du chiffre d'affaires du groupe l'an prochain. Oddo BHF note que la bonne surprise de la publication est venue de la division Automatismes industriels, qui a enregistré une croissance de 6 % en données comparables.Schneider Electricse réjouit d'un retour à la croissance de cette activité, soutenue par reprise des marchés des industries manufacturières et la performance de sa filiale de logiciels Aveva. Schneider Electric dit aussi avoir confirmé ses objectifs pour 2025. La société table toujours sur une croissance de 7% à 10% en données comparables et une amélioration de sa marge opérationnelle retraitée de 0,5 point à 0,8 point de pourcentage. Mais ell", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Schneider Electric a prévenu que sa croissance et sa marge opérationnelle annuelles seront attendues aux alentours de la moitié inférieure de la fourchette de prévisions, ce qui a entraîné une baisse de près de 4% de son action. Barclays a également noté une révision à la baisse des prévisions.", "note_haiku": 0, "justification_haiku": "Fait concret négatif spécifique à SCHNEIDER ELECTRIC : malgré une croissance des ventes de 9% supérieure aux attentes au T3, la direction a abaissé ses perspectives annuelles en prévenant que la croissance et la marge opérationnelle seront attendues 'vers la moitié inférieure' de la fourchette de prévisions. Cette révision à la baisse des prévisions constitue une mauvaise nouvelle concrète, confirmée par la réaction négative du marché (-4%) et l'analyse de Barclays mentionnant 'la révision à la baisse des prévisions'."}, {"article_id": 53029, "company_id": 6, "entreprise": "BUREAU VERITAS", "source": "www.tradingsat.com", "published_at": "2026-07-29", "genre": "article dédié", "titre": "BUREAU VERITAS : Avec une activité qui accélère, une cible de croissance remise à l&#039;endroit, et des annonces rassurantes sur une sortie cruciale d&#039;activités, Bureau Veritas prend sa revanche en Bourse (+9%)", "texte": "Bureau veritas: Avec une activité qui accélère, une cible de croissance remise à l'endroit, et des annonces rassurantes sur une sortie cruciale d'activités, Bureau Veritas prend sa revanche en Bourse (+9%) mercredi 29 juillet 2026 à 14h59 (BFM Bourse) - Le groupe de tests, inspections et certifications grimpe à la Bourse de Paris après avoir dégagé une croissance de 5,5% au deuxième trimestre et relevé des objectifs qui avaient été abaissés en avril.Bureau Veritasa également indiqué avoir passé une provision limitée à 32 millions d'euros sur la sortie de son activité \"services aux gouvernements\". Bureau Veritas restait sur une bien mauvaise note auprès du marché. Le spécialiste des \"TIC\" (tests, inspections, certifications) avait chuté de 10,6% sur une seule séance le 22 avril dernier, après avoir publié son activité du premier trimestre. Le pensionnaire duCAC 40avait déçu sur sa croissance et avait été contraint d'abaisser sa prévision de croissance pour 2026.Bureau Veritasinvoquait alors les incertitudes politiques et économiques, mais aussi sa décision d'arrêter ses activités dites de \"services aux gouvernements\". Le groupe avait alors découvert, dans la zone \"Afrique Moyen-Orient\" des irrégularités d'ordre éthique et de conformité (\"compliance\") sur cette activité, qui représente 185 millions d'euros de revenus, et les avaient signalés aux autorités. Jefferies estimait l'impact de cette décision à environ 1 à 2 points de pourcentage sur la croissance en données comparables. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading \"Cette révision à la baisse des perspectives de croissance constitue un frein pour le potentiel de valorisation de l'action, qui reposait en partie sur une surperformance relative en termes de croissance. De plus, ces problèmes (sur les 'services aux gouvernements') et leurs éventuelles répercussions financières supplémentaires ajoutent un risque à ce potentiel de valorisation\", soulignait alors la banque. L'annonce de la sortie de ces article_id": 33830, "company_id": 13, "entreprise": "SOITEC", "source": "www.tradingsat.com", "published_at": "2026-04-15", "genre": "article dédié", "titre": "Portée par l&#039;essor de l&#039;IA, la première capitalisation européenne ASML relève ses perspectives 2026, ce qui profite (encore) à Soitec qui gagne près de 230% depuis le début de l&#039;année", "texte": "Portée par l'essor de l'IA, la première capitalisation européenne ASML relève ses perspectives 2026, ce qui profite (encore) à Soitec qui gagne près de 230% depuis le début de l'année mercredi 15 avril 2026 à 11h05 (BFM Bourse) - Le groupe batave spécialiste des technologies clef pour la production de semi-conducteurs a dévoilé des résultats supérieurs aux attentes au titre du premier trimestre. En parallèle, ASML a relevé ses prévisions d'activité pour l'ensemble de l'année 2026. Avec la hausse de l'activité (et des budgets) de ses grands donneurs d'ordres et la course à l'intelligence artificielle, ASML surfe sur une vague porteuse. La société figure d'ailleurs dans la sélection \"25 for 2026\" de Bank of America,une liste de 25 actions européennes à privilégier pour 2026. La première capitalisation européenne a, pour grands clients, les fondeurs de puces, c'est-à-dire le taïwanais TSMC, l'américain Intel ou encore le coréen Samsung. Or, ces derniers voient leur activité exploser en raison de l'essor de l'intelligence artificielle, ce qui les pousse à produire davantage. TSMC a, par exemple, récemment annoncé un bond de plus de 35% de ses ventes au premier trimestre, dont une hausse de 30% rien que sur le mois de mars.Bloombergindiquait alors que cette publication contribuait \"à apaiser les craintes selon lesquelles une crise prolongée au Moyen-Orient risquerait de freiner la demande en centres de données d'IA, très gourmands en énergie, et en appareils tels que l'iPhone. Dans ce contexte favorable, la société néerlandaise a annoncé des performances qui ont dépassé les attentes. ASML a publié des revenus de 8,77 milliards d'euros, en hausse de 12,4% sur un an, s'approchant du haut de la fourchette prévisionnelle pour les trois premiers mois de 2026. La société tablait sur un chiffre d'affaires net compris entre 8,2 milliards et 8,9 milliards d'euros pour cette période. La marge brute s'est contractée sur un an passant de 54% à 53% au premier semestre 2026. Citi note cependant que cette marge a dépassé les prévisions du marché et se situe dans la fourchette haute des prévisions, grâce notamment aux marges plus élevées générées par la gestion du parc installé. Concernant ce même parc installé, il a généré environ 2,5 milliards d'euros de chiffre d'affaires. \"Il s'agit surtout d'une activité à plus forte marge, plus récurrente et moins sensible aux fluctuations conjoncturelles que la vente d'équipements\",remarque XTB. \"Dans le contexte actuel, son importance (celle d'ASML, NDLR) ne cesse de croître. Les clients, confrontés à une disponibilité limitée des nouveaux outils et à de longs délais de livraison, s'attachent à optimiser la productivité de leurs équipements existants. Les mises à niveau et la maintenance constituent ainsi le moyen le plus rapide d'augmenter la capacité de production effective\", ajoute Louise Girard, Analyste de marché chez XTB. Le bénéfice a par ailleurs a progressé de 15% à 2,76 milliards d'euros. Par action, il ressort à 7,", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article met en avant la performance boursière de Soitec et son positionnement prometteur dans le photonique de silicium pour l'IA, mais il ne rapporte aucun fait concret nouveau et spécifique à l'activité de Soitec (ex: résultats, contrat, révision d'objectifs). Le sentiment positif est principalement lié aux bénéfices indirects des résultats d'ASML et à la reconnaissance par le marché de la technologie existante de Soitec.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à SOITEC : (1) le titre gagne 5,6% à la Bourse de Paris suite à la publication d'ASML, signant la plus forte hausse du SBF 120 ; (2) l'action a grimpé de 228% depuis le début de l'année ; (3) SOITEC bénéficie d'une 'lecture croisée' favorable dans son secteur suite aux résultats positifs d'ASML et TSMC ; (4) la société est positionnée sur le créneau prometteur de la photonique sur silicium (substrats 'Photonics-SOI') lié à l'essor de l'IA et des data centers. Ces éléments constituent des bonnes nouvelles concrètes pour SOITEC."}, {"article_id": 20926, "company_id": 11, "entreprise": "SARTORIUS STED BIO", "source": "www.tradingsat.com", "published_at": "2026-02-03", "genre": "article dédié", "titre": "SARTORIUS STED BIO : Comment la direction du fournisseur de technologies clef pour les vaccins et médicaments Sartorius Stedim a renversé la vapeur en Bourse ce mardi", "texte": "Sartorius sted bio: Comment la direction du fournisseur de technologies clef pour les vaccins et médicaments Sartorius Stedim a renversé la vapeur en Bourse ce mardi mardi 3 février 2026 à 17h15 (BFM Bourse) - Le spécialiste des technologies clef pour la fabrication de vaccins et de médicaments a atteint ses objectifs financiers 2025. Mais le marché qui avait sanctionné dans un premier temps, la prudence de Sartorius Stedim Biotech pour l'année en cours, a mis de l'eau dans son vin après la conférence téléphonique. Les publications d'entreprises vont peu à peu se densifier à partir de cette semaine. Ce mardi 3 février, Sartorius Stedim Biotech a dévoilé avant l'ouverture du marché, ses performances financières pour l'ensemble de l'année 2025. Le spécialiste des technologies clés pour la fabrication de vaccins et de médicaments boucle l'année écoulée en ayant \"pleinement\" atteint ses objectifs financiers pour l’année. En 2025, les revenus de Sartorius Stedim Biotech ont progressé de 6,7% en données publiées, et 9,6% à taux de changes constants pour atteindre à 2,967 milliards d'euros. La société met en avant les excellentes performances de son activité consommables pour la production de produits biopharmaceutiques, qui représente la grande majorité de son chiffre d’affaires et qui sont plus margés. A côté, l'activité liée aux équipements est restée faible, mais la société explique avoir observé des \"signes encourageants de stabilisation au cours de l’année\". Sartorius Stedim Biotech ajoute que toutes les régions dans lesquelles le groupe est présent ont contribué à cette progression de son activité annuelle. Cette forte demande pour les consommables a eu un effet positif sur la rentabilité du groupe. Le résultat brut d'exploitation (Ebitda) courant, a en effet progressé plus vite que le chiffre d'affaires, de 17,3% sur un an, pour atteindre 914 millions d'euros. Sartorius Stedim Biotech attribue cette amélioration de sa rentabilité à la hausse des volumes et à des économies d’échelle, venant plus que compenser les effets de change négatifs et l’effet modérateur des droits de douane américains. La marge correspondante courante a augmenté de 2,8 points de pourcentage pour atteindre 30,8%, après 28% en 2024. Le résultat net a suivi la même tendance, progressant de 26,7% à 428 millions d’euros, contre 338 millions d’euros sur la même période l’année précédente. Sartorius Stedim Biotecha ainsi atteint ses objectifs relevés en octobre 2025.La société comptait boucler l'année 2025 sur une croissance du chiffre d’affaires d’environ 9%, et sur une marge d'Ebitda courant proche de 31%. \"Le groupe communique des résultats 2025 globalement en ligne avec les attentes\", résume Allinvest Securities. \"Sartorius a terminé l'année en beauté, avec des résultats conformes ou légèrement supérieurs aux prévisions du consensus\", apprécie pour sa part Royal Bank of Canada. En marge de ces annonces, la société a livré ses perspectives pour 2026. Sartorius Stedim Biotech p", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "The company fully achieved its 2025 financial objectives, reporting significant revenue growth (6.7% / 9.6%), EBITDA growth (17.3%), and net profit growth (26.7%), alongside an improved margin (30.8%). These strong past performances and a positive future growth forecast outweigh the slightly below-consensus 2026 margin outlook.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à SARTORIUS STED BIO : (1) atteinte pleine des objectifs financiers 2025, (2) progression des revenus de 6,7% en données publiées et 9,6% à taux de change constants pour atteindre 2,967 milliards d'euros, (3) progression de l'Ebitda courant de 17,3% à 914 millions d'euros, (4) augmentation de la marge d'Ebitda courant de 2,8 points pour atteindre 30,8%, (5) progression du résultat net de 26,7% à 428 millions d'euros, (6) perspectives 2026 avec croissance organique prévue entre 6% et 10%, (7) marge d'Ebitda courant supérieure à 31% attendue. Le titre clôture en progression de 2,5% après un rebond lors de la conférence téléphonique. Les analystes (Allinvest Securities, Royal Bank of Canada) expriment une appréciation positive."}, {"article_id": 31232, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.tradingsat.com", "published_at": "2026-03-31", "genre": "article dédié", "titre": "TOTALENERGIES : Société Générale, Rheinmetall, Air France-KLM, Totalenergies... Quels groupes ont le plus chuté (et grimpé) depuis le début du conflit au Moyen-Orient?", "texte": "Totalenergies: Société Générale, Rheinmetall, Air France-KLM, Totalenergies... Quels groupes ont le plus chuté (et grimpé) depuis le début du conflit au Moyen-Orient? mardi 31 mars 2026 à 12h41 (BFM Bourse) - Après un mois de guerre en Iran, les valeurs pétrolières ont progressé en Bourse quand le secteur aérien ou plus paradoxalement, celui de la défense ont beaucoup plus souffert sur les marchés financiers. Les frappes américano-israéliennes contre l'Iran ont déclenché une guerre régionale au Moyen-Orient qui a eu de fortes répercussions sur les marchés financiers mondiaux. Le conflit déclenché il y a plus d'un mois a perturbé le commerce et les marchés de l'énergie, les actions du monde entier subissant des effets divers en fonction de leur exposition au chaos, ou du bénéfice qu'elle peuvent en tirer. Après un mois de guerre, certains titres ont progressé en Bourse quand d'autres ont plus souffert. Le quasi-blocus imposé par l'Iran sur le détroit d'Ormuz, par où transitent en temps de paix environ 20% du pétrole brut et du gaz naturel liquéfié mondiaux, a causé une envolée des prix de l'énergie,ce qui a bénéficié aux titres des principales compagnies pétrolières. Les marges de ces groupes ont augmenté car parallèlement à la hausse des prix du pétrole, les coûts d'extraction sont restés relativement stables, souligne Jose Torres, économiste chez Interactive Brokers. Les investisseurs se sont en conséquence tournés vers les compagnies qui semblent devoir bénéficier d'un maintien des prix à un niveau élevé. \"Ils anticipent que le conflit va continuer encore un moment\", selon Jose Torres. \"Ce qui signifie que les prix du pétrole resteraient structurellement élevés pendant un ou deux ans.\" Sur les marchés européens, BP a mené la hausse avec un gain de 22,3% entre le 27 février, dernier jour avant le début des frappes, et le 27 mars. Totaenergies a augmenté de 16,7% et Shell de 13,3% pendant la même période. Les conflits mondiaux sont généralement une aubaine pour les groupes du secteur de la défense, et globalement, les fabricants d'armes ont enregistré des gains importants depuis le début de 2026. A plus court terme, plusieurs grandes entreprises ont cependant vu leur cours de Bourse baisser depuis le début de la guerre, reflétant les craintes d'éventuelles ruptures d'approvisionnement. Il y a un décalage pour répondre à toute augmentation de la demande, en raison des longs délais d'approvisionnement et de production. Les investisseurs \"ne constatent pas de production importante de nouvelle technologie\", selonSamStovall, responsable des investissements chez CFRA. Le groupe allemand Rheinmetall a vu ses actions chuter de 17% en un mois, tandis queThalesa baissé de 6,7% and RTX -- anciennement Raytheon Technologies -- de 6,4%. Les compagnies aériennes ont été l'un des secteurs les plus touchés,la guerre ayant entraîné des annulations massives de vols et des détournements d'itinéraires pour éviter les zones sensibles. La flambée des prix du kérosène ", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Totalenergies a augmenté de 16,7% entre le 27 février et le 27 mars, bénéficiant de l'envolée des prix de l'énergie.", "note_haiku": 2, "justification_haiku": "L'article mentionne un fait concret positif spécifique à TOTALENERGIES : 'Totalenergies a augmenté de 16,7%' entre le 27 février et le 27 mars, dans un contexte où les compagnies pétrolières ont bénéficié de la hausse des prix du pétrole due au conflit au Moyen-Orient. Cette progression est explicitement liée à une amélioration de la situation économique de l'entreprise (marges accrues)."}, {"article_id": 25928, "company_id": 24, "entreprise": "THALES", "source": "www.abcbourse.com", "published_at": "2026-03-02", "genre": "article dédié", "titre": "Thales réalise une première mondiale dans la sécurisation post-quantique des réseaux 5G", "texte": "(Zonebourse.com) - Le leader français de la défense et des technologies numériques vient de franchir une étape stratégique en démontrant la capacité de ses solutions de connectivité à intégrer une protection post-quantique à distance. Thales a validé avec succès une innovation permettant de mettre à jour la sécurité des cartes SIM et eSIM (module d'identité d'abonné intégré) déjà déployées sur les réseaux 5G, sans aucune interruption de service. Cette avancée repose sur l'agilité cryptographique, une capacité cruciale permettant d'injecter de nouveaux algorithmes de protection par téléchargement pour contrer la puissance de calcul des futurs ordinateurs quantiques, capables de briser les chiffrements actuels. Pour les investisseurs, cette technologie garantit la pérennité des infrastructures critiques et des revenus des opérateurs télécoms en évitant le remplacement physique coûteux de millions d'équipements. Comme le souligne Eva Rudin, vice-présidente des solutions de connectivité mobile, \"le succès de cette démonstration prouve que la sécurité résistante au quantique n'est plus un concept futuriste\". Ce positionnement renforce le leadership de Thales dans la définition des standards internationaux, notamment auprès du National Institute of Standards and Technology (NIST - Institut national des normes et de la technologie), tout en sécurisant les investissements à long terme dans les réseaux mobiles, les véhicules connectés et l'industrie. Le titre gagne 0,5% à Paris, une progression qui s'approche des 12% depuis le début de l'année. Copyright © 2026 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Thales a validé avec succès une innovation stratégique en matière de sécurité post-quantique pour les cartes SIM/eSIM, renforçant son leadership et la pérennité des infrastructures critiques.", "note_haiku": 2, "justification_haiku": "L'article contient un fait concret et spécifique positif pour THALES : la validation avec succès d'une innovation technologique majeure permettant de mettre à jour la sécurité des cartes SIM et eSIM déployées sur les réseaux 5G sans interruption de service. Cette démonstration de capacité en protection post-quantique renforce le leadership de THALES dans les standards internationaux et sécurise les investissements à long terme. C'est une bonne nouvelle concrète pour l'entreprise."}, {"article_id": 34916, "company_id": 24, "entreprise": "THALES", "source": "www.tradingsat.com", "published_at": "2026-04-21", "genre": "article dédié", "titre": "THALES : Le Moyen-Orient pèsera sur les activités aéronautiques de Thales et la cybersécurité continue de décevoir, l&#039;action plonge de 4,7%", "texte": "Thales: Le Moyen-Orient pèsera sur les activités aéronautiques de Thales et la cybersécurité continue de décevoir, l'action plonge de 4,7% mardi 21 avril 2026 à 11h43 (BFM Bourse) - Le groupe de technologies et de défense a publié ses revenus et ses prises de commandes au premier trimestre, marquées par une nouvelle contre-performance des activités de cybersécurité. Le directeur financier a par ailleurs indiqué que la guerre contre l'Iran aurait un impact négatif dans les activités d'après-vente dans l'aéronautique civil. Thales reste une histoire boursière contrariée. Le groupe d'électronique et de défense évolue sur un secteur – les fournisseurs d'équipements militaires – qui a le vent en poupe, tant sur le plan boursier qu'en termes d'activités. Le réarmement des pays européens, qui se sont engagés à atteindre une part de 5% de leur produit intérieur brut (dont 3,5% de dépenses militaires \"pures\" et 1,5% de dépenses connexes) dans les dépenses de défense, et la multiplication des fronts géopolitiques ont créé un environnement porteur pour le compartiment. Pourtant, la société présidée et dirigée par Patrice Caine a sous-performé les autres groupes du secteur de la défense en Bourse. Son action a, certes, pris 65,7% en 2025, mais la société est restée à la traine de l'allemand Rheinmetall (+154%) ou de l'italien Leonardo (+97%). >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Thales a à la fois pâti des incertitudes sur le budget de la défense en France, elles-mêmes causées par l'instabilité politique chronique dans l'Hexagone. Selon Deutsche Bank, environ 20% des revenus de la société sont exposés aux dépenses françaises de défense. L'autre grande source de contre-performance du groupe reste sa division \"Cyber & Digital\" (cybersécurité, cartes à puces pour les services bancaires, solutions de connectivité pour l'internet des objets, solutions biométriques), et plus exactement le segment cybersécurité. Ce segment a affiché un repli de 4% de ses revenus en données comparables en 2025 et de 1,1% sur le seul quatrième trimestre. L'entreprise a justifié cette baisse du chiffre d'affaires en évoquant la faiblesse du marché en Australie ainsi que des \"perturbations\" liées à l'intégration d'Imperva, une société rachetée en décembre 2023 pour 3,6 milliards de dollars. Pour cette année, \"le marché pourrait ne pas se montrer indulgent si l'activité 'cyber' ne parvient pas à afficher une croissance organique solide\",prévenait début mars JPMorgan. En raison des difficultés de cette activité, plusieurs intermédiaires financiers suggèrent à la société de vendre. \"Est-il temps de céder la division 'cyber & digital' (en totalité ou en partie) ?\", questionnait ainsi JP Morgan en mars. \"Bien que nous doutions que cela soit exploré cette année, nous pensons queThalespourrait libérer une valeur significative s'il décidait de se débarrasser de son activité digital (paiement, documents d'identité et biométrie, car", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'action Thales a chuté de 4,7% suite à la publication de résultats trimestriels marqués par une nouvelle contre-performance des activités de cybersécurité (baisse organique de -0,3% au T1 2026, 4ème trimestre consécutif de croissance négative) et des prises de commandes inférieures au consensus. Le directeur financier a également annoncé un impact négatif du conflit au Moyen-Orient sur les activités d'après-vente dans l'aéronautique civil.", "note_haiku": 0, "justification_haiku": "L'article contient plusieurs faits concrets négatifs spécifiques à THALES : (1) la cybersécurité affiche une croissance de seulement 2% au T1 2026, déçoit le consensus (897M€ attendus vs 857M€ réalisés), et enregistre une baisse organique de -0,3% au T1, marquant le quatrième trimestre consécutif de croissance négative ; (2) le directeur financier avertit que le conflit au Moyen-Orient aura un impact négatif sur les activités d'après-vente dans l'aéronautique civile à partir du T2 2026, en raison de la baisse du trafic aérien et de l'augmentation des prix du kérosène ; (3) l'action plonge de 4,7%, la plus forte baisse du CAC 40. Ces éléments constituent des mauvaises nouvelles concrètes et spécifiques à THALES."}, {"article_id": 24973, "company_id": 34, "entreprise": "ENGIE", "source": "www.abcbourse.com", "published_at": "2026-02-25", "genre": "article dédié", "titre": "Engie va racheter le distributeur d'électricité UK Power Networks et relève ses prévi...", "texte": "(Agefi-Dow Jones)--Le groupe énergétique Engie a annoncé mercredi la conclusion d'un accord pour racheter le distributeur d'électricité britannique UK Power Networks (UKPN) pour quelque 15,8 milliards de livres en incluant la dette et le relèvement de ses prévisions pour cette année à la faveur de cette acquisition. Le groupe a indiqué qu'il allait acquérir UKPN, \"le distributeur d'électricité de référence au Royaume-Uni\", pour une valeur de fonds propres de 10,5 milliards de livres. \"Cette opération constitue une étape majeure dans l'ambition d'Engie de devenir la meilleure 'Utility' de la transition énergétique en se renforçant dans les réseaux d'électricité régulés. Elle ancrera par ailleurs la présence du groupe au Royaume-Uni, qui deviendra son deuxième pays en termes d'activité\", a indiqué Engie dans un communiqué. Avec cette acquisition, le groupe prévoit désormais d'atteindre un résultat net récurrent part du groupe compris entre 4,6 et 5,2 milliards d'euros en 2026, contre une fourchette de 4,2 à 4,8 milliards d'euros envisagée précédemment, \"en raison de l'intégration de UKPN à partir du 1er juillet et de l'ajustement du portefeuille d'actifs\". Le résultat d'exploitation (Ebit) hors nucléaire est quant à lui attendu dans une fourchette indicative de 8,7 à 9,7 milliards d'euros, contre 8,2 à 9,2 milliards d'euros précédemment. Au titre de l'exercice 2025, Engie a fait part mercredi d'une baisse de 6,8% de son bénéfice net, à 3,8 milliards d'euros. Le chiffre d'affaires a reculé de 2,5%, à 71,9 milliards d'euros, la progression des revenus dans les infrastructures (+4,3%) n'ayant pas compensé le recul de ceux des renouvelables (-5,2%) et du Supply & Energy Management (-4,1%). Le résultat net récurrent est ressorti en baisse de 11,5%, à 4,9 milliards d'euros, conformément à des prévisions dévoilées en novembre. Engie doit présenter jeudi ses perspectives 2026-2028 et le détail de l'acquisition d'UKPN. Le groupe a d'ores et déjà indiqué qu'il visait en 2028, un résultat net récurrent part du groupe compris entre 5,2 et 5,8 milliards d'euros. L'EBIT hors nucléaire est attendu dans une fourchette indicative de 10,3 à 11,3 milliards d'euros. Engie prévoit des dépenses d'investissement comprises entre 34 et 38 milliards d'euros sur la période de trois ans, \"90 % des investissements étant dédiés aux renouvelables, aux batteries et aux infrastructures\". Le groupe prévoit également de céder environ 6 milliards d'euros d'actifs sur la période, \"dont environ 4 milliards d'euros dans le cadre de l'acquisition de UKPN\". Engie a par ailleurs indiqué que son conseil d'administration allait proposer à la prochaine assemblée générale du groupe de renouveler le mandat de Jean-Pierre Clamadieu comme administrateur et de lui demander de poursuivre son mandat de président du conseil jusqu'en 2027. COMMUNIQUES FINANCIERS DE Engie: http://www.engie.com/journalistes/communiques-de-presse/ Agefi-Dow Jones The financial newswire Vous avez aimé cet article ? Partag", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article annonce l'acquisition de UK Power Networks et, en conséquence directe, le relèvement des prévisions de résultats nets récurrents et d'EBIT hors nucléaire pour 2026, ainsi que de nouveaux objectifs ambitieux pour 2028. Ces éléments sont des faits concrets positifs pour l'avenir de l'entreprise, malgré la baisse des résultats de l'exercice 2025.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à ENGIE : (1) conclusion d'un accord pour racheter UK Power Networks pour 15,8 milliards de livres, acquisition majeure stratégique ; (2) relèvement des prévisions de résultat net récurrent 2026 de 4,2-4,8 à 4,6-5,2 milliards d'euros grâce à cette acquisition ; (3) relèvement de l'EBIT hors nucléaire 2026 de 8,2-9,2 à 8,7-9,7 milliards d'euros ; (4) perspectives 2028 ambitieuses avec résultat net récurrent 5,2-5,8 milliards d'euros et EBIT 10,3-11,3 milliards d'euros. Ces éléments constituent des bonnes nouvelles concrètes et spécifiques à ENGIE."}, {"article_id": 59186, "company_id": 3, "entreprise": "ALSTOM", "source": "www.bfmtv.com", "published_at": "2026-08-31", "genre": "article dédié", "titre": "Un contrat qui peut atteindre 850 millions d'euros: le Portugal hésite entre Alstom et l'espagnol Talgo pour ses nouveaux TGV", "texte": "Les deux industriels ont été retenus après l'étape de présélection. Ils ont trois mois pour finaliser leurs offres, le contrat sera attribué à la fin de l'année. Qui pour fabriquer les premiers trains à grande vitesse qui circuleront au Portugal ? Pour cet important appel d'offres lancé il y a un an par l'État et la compagnie nationale Comboios de Portugal (CP), deux industriels restent désormais en lice après la première étape de présélection selon plusieurs médias espagnols et portugais : le français Alstom et l'espagnol Talgo. Le montant du contrat fait saliver : 504 millions d'euros pour 12 rames neuves (et leur maintenance) avec une option pour huit trains supplémentaires, portant l'investissement à 850 millions d'euros. Alstom serait en bonne position avec son modèle Avelia Horizon (qui sert de base au TGV M de la SNCF ) car il répond à pas mal des exigences imposées : expérience préalable dans l'exploitation de trains à 300 km/h sur le réseau européen (donc un train homologué et interopérable), capacité d'au moins 500 sièges, profil technique du train, aménagements intérieur, économie d'énergie... autant de points qui représenteront 75% des critères d'évaluation. Spécificités locales Néanmoins, l'industriel français devra se plier à quelques spécificités locales. Le train devra être adapté à l'écartement ibérique de la ligne à grande vitesse (1.668 mm). Le Portugal a en effet obtenu une dérogation de la Commission européenne qui impose normalement l’écartement UIC (Union Internationale des Chemins de fer) tel que l'on connaît en France par exemple (1.435 mm) et qui est obligatoire pour toute nouvelle infrastructure ferroviaire dans l’UE. Si l'écartement ibérique n'est pas un problème pour le dernier modèle de Talgo, le S106 Avril connaît de nombreux problèmes techniques en Espagne. Son aménagement intérieur devra également être modifié pour correspondre aux demandes de Comboios de Portugal qui ne veut pas de rangées de trois sièges. La capacité de production et de tenir les délais des deux industriels sera également déterminante puisque le service doit être a priori lancé en 2030, ce qui est très court au regard de la situation industrielle des acteurs, d'où le choix d'un modèle très standardisé. Reste qu'il est difficile de croire que ces délais seront tenus tant les carnets de commandes sont pleins dans le secteur. Le projet de ligne à grande vitesse au Portugal © République portugaise Le pays a relancé en 2022 son projet de ligne à grande vitesse afin de relier en 2030 Lisbonne à Porto (nord), les deux principales villes du pays, en 1h15 contre près de 3 heures actuellement. C'est un projet \"stratégique pour l'avenir du pays\" qui favorisera \"l'autonomie\" et \"la compétitivité\", expliquait le Premier ministre de l'époque Antonio Costa. Cet axe ferroviaire doit également permettre à terme de relier Porto et Vigo, dans le nord-ouest de l'Espagne. Cette liaison avec l'Espagne sera \"le premier pas en vue d'une intégration avec le réseau ibéri", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Alstom est en bonne position pour remporter un contrat majeur de 504 millions d'euros (potentiellement 850 millions) pour la fabrication de trains à grande vitesse au Portugal, son modèle répondant à de nombreuses exigences.", "note_haiku": 2, "justification_haiku": "L'article mentionne qu'Alstom a été retenu après la présélection pour un important appel d'offres au Portugal (504 millions d'euros, option 850 millions). C'est un fait concret positif spécifique à Alstom : l'entreprise est en bonne position avec son modèle Avelia Horizon et figure parmi les deux finalistes pour un contrat majeur. Cela constitue une bonne nouvelle commerciale concrète."}, {"article_id": 61571, "company_id": 2, "entreprise": "AIRBUS", "source": "www.bfmtv.com", "published_at": "2026-09-11", "genre": "article dédié", "titre": "Après la visite d'Emmanuel Macron, Vietnam Airlines commande cinq Airbus A350", "texte": "Le président vietnamien a également signé jeudi une lettre d'intention pour l'acquisition de 20 Airbus A220 et 30 Airbus A321neo par une autre compagnie du pays, Vietravel Airlines. Airbus engrange les commandes suite à la visite d'Emmanuel Macron au Vietnam . Ce jeudi, le président vietnamien a signé une lettre d'intention pour l'acquisition de 20 Airbus A220 et 30 Airbus A321neo par Vietravel Airlines. Ce vendredi, c'est Vietnam Airlines qui annonce son intention de s'offrir cinq gros porteurs A350. Les livraisons sont prévues sur la période 2033-2034. \"Cet accord marque une étape importante dans la coopération aéronautique entre le Vietnam et la France et soutient la stratégie à long terme de Vietnam Airlines visant à renforcer ses capacités d’exploitation long-courrier au-delà de l’année 2030. Dans le cadre de ce protocole d’accord, les deux parties mèneront des études et des évaluations complémentaires et travailleront à la finalisation des modalités nécessaires, ouvrant ainsi la voie aux procédures d’investissement et d’acquisition conformément à la réglementation applicable\", peut-on lire dans un communiqué. Croissance de la demande de voyages internationaux \"Cet investissement vise à accompagner la croissance rapide de la demande de voyages internationaux, à accroître les capacités de la compagnie sur les liaisons moyen et long-courriers et à renforcer encore la compétitivité de la compagnie aérienne nationale du Vietnam\", poursuit la compagnie. \" Vietnam Airlines est un partenaire historique majeur d’Airbus au Vietnam. Nous sommes honorés et reconnaissants que Vietnam Airlines ait décidé d’ajouter de nouveaux appareils à sa flotte actuelle d’A350. Nous sommes convaincus que l’A350-900, grâce à ses capacités long-courriers et à son efficacité opérationnelle, peut accompagner les projets de Vietnam Airlines visant à développer son réseau international dans les années à venir. Airbus se réjouit de continuer à soutenir Vietnam Airlines dans le développement et la modernisation de sa flotte\", se félicite Benoît de Saint-Exupéry, Vice-Président exécutif des Ventes Avions commerciaux d’Airbus. Vietnam Airlines a aujourd'hui une flotte majoritairement Airbus, avec des appareils de la famille A320 et des A350, complétée par des Boeing 787. Sujets liés : Aéronautique International Industries", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Airbus a signé des lettres d'intention pour l'acquisition de 20 A220 et 30 A321neo par Vietravel Airlines, ainsi que 5 A350 par Vietnam Airlines.", "note_haiku": 2, "justification_haiku": "L'article contient deux faits concrets et spécifiques positifs pour Airbus : (1) signature d'une lettre d'intention par Vietravel Airlines pour l'acquisition de 20 A220 et 30 A321neo, (2) annonce de Vietnam Airlines de son intention d'acquérir 5 A350 avec livraisons prévues 2033-2034. Ces commandes/intentions de commande représentent une bonne nouvelle concrète pour Airbus, confirmée par la déclaration positive du Vice-Président exécutif des Ventes."}, {"article_id": 26101, "company_id": 8, "entreprise": "Gaztransport & Technigaz SA", "source": "www.abcbourse.com", "published_at": "2026-03-03", "genre": "article dédié", "titre": "GTT en tête du palmarès INPI 2025 des ETI déposantes de brevets", "texte": "(Zonebourse.com) - Le groupe GTT a déposé 68 demandes de brevet auprès de l'INPI en 2025, se classant ainsi à la première place des ETI déposantes. L'expert technologique des systèmes de confinement à membranes dédiés au transport et au stockage des gaz liquéfiés se maintient également à la 23ème place du classement général de l'INPI, confirmant la constance de sa stratégie d'innovation. En consacrant près de 10% de son chiffre d'affaires à la recherche et au développement, GTT met en oeuvre une feuille de route technologique ambitieuse, visant à consolider son leadership sur le marché historique du transport du GNL, tout en accélérant son expansion vers des segments adjacents tels que le GNL carburant et les solutions bas-carbone. Fort d'un investissement soutenu en R&D et d'un portefeuille de brevets en constante progression, le groupe entend accompagner durablement la transformation des chaînes de valeur des secteurs énergétique et maritime. Copyright © 2026 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "GTT a déposé 68 demandes de brevet en 2025, se classant premier des ETI déposantes, et maintient sa 23ème place au classement général de l'INPI. Le groupe consacre près de 10% de son chiffre d'affaires à la R&D et son portefeuille de brevets est en constante progression.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Gaztransport & Technigaz SA (GTT) : (1) dépôt de 68 demandes de brevet auprès de l'INPI en 2025, classant GTT à la première place des ETI déposantes ; (2) maintien à la 23ème place du classement général de l'INPI ; (3) consacration de près de 10% du chiffre d'affaires à la R&D ; (4) portefeuille de brevets en constante progression. Ces éléments démontrent une stratégie d'innovation robuste et un leadership technologique confirmé, constituant des signaux positifs concrets pour l'entreprise."}, {"article_id": 27470, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-03-05", "genre": "article dédié", "titre": "AIRBUS GROUP : Malgré ses impairs dans la montée en cadence de la production, Citi voit l&#039;action Airbus prendre plus de 20% grâce à la défense, au dollar et (paradoxalement) au conflit au Moyen-Orient", "texte": "Airbus group: Malgré ses impairs dans la montée en cadence de la production, Citi voit l'action Airbus prendre plus de 20% grâce à la défense, au dollar et (paradoxalement) au conflit au Moyen-Orient jeudi 5 mars 2026 à 121201 (BFM Bourse) - La banque américaine a relevé son conseil à l'achat sur le groupe d'aéronautique et de défense, citant plusieurs raisons dont une accélération des livraisons, la hausse de la rentabilité de la défense et, de façon un peu contre-intuitive, les répercussions de la guerre au Moyen-Orient. Le début d'année 2026 d'Airbusa de quoi provoquer quelques grincements de dents. Le groupe d'aéronautique et de défense accuse une baisse de 9,1% depuis le début de l'année, sous-performant largement leCAC 40(+0,6% sur la même période). Le rival de Boeing connaît un début d'année poussif sur les livraisons d'avions, avec seulement 53 avions expédiés à ses clients sur les deux premiers mois de l'année, selon les estimations de Barclays. Les chiffres officiels du groupe sont attendus dans les prochains jours. \"Alors que les livraisons au premier trimestre ont toujours été faibles par le passé, le nombre de livraisons enregistrées à ce jour au premier trimestre 2026 est inférieur aux tendances historiques\", remarque Barclays. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Surtout, le groupe aéronautique a manqué son rendez-vous avec les investisseurs, lors de la publication de ses résultats annuels le 19 février dernier. En raison de problèmes d'approvisionnement de moteurs auprès de Pratt & Whitney, Airbusa annoncé des perspectives 2026 décevantes,que ce soit au niveau des livraisons (870 avions), du résultat opérationnel ou de la génération de cash. Pratt & Whitney fournit un peu plus de 40% des moteurs équipant la famille 320neo, les monocouloirs phares d'Airbus, véritable cash-machine de la société. Pour ces mêmes raisons, la société a une nouvelle fois du revoir son plan de vol de moyen terme sur la production.Airbuscompte parvenir à un objectif de 75 avions A320 neo produits chaque mois. Annoncé une première fois en 2020 pour 2025, cette cible a été repoussée à 2026 puis 2027. Airbus a, il y a deux semaines, de nouveau décalé (pour la quatrième fois) cette cible. Le groupe évoque une cadence \"de 70 à 75\" avions par mois d'ici à la fin de l'année 2027 qui serait ensuite stabilisée à un rythme de 75 \"par la suite\". \"Une nouvelle année apporte son lot de perturbations liées aux moteurs, mais celle-ci se distingue particulièrement car elle soulève des questions quant à l'équilibre des incitations entre les équipementiers de moteurs et de cellules (la structure principale de l'avion, NDLR)\", pointe Bank of America dans une récente note. \"L'incapacité de Pratt à s'engager sur le nombre de moteurs commandés parAirbuslimite la production à court terme, renforçant ainsi un problème majeur qui persiste depuis quatre ans, à savoir qu'Airbuscontinue de supporter l'essentiel des risqu", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Citi a relevé son conseil à l'achat sur Airbus et a rehaussé son objectif de cours, ce qui constitue une amélioration de note d'analyste et un relèvement d'objectif.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Airbus : (1) Citi a relevé son conseil de neutre à l'achat, (2) l'objectif de cours a été rehaussé de 208€ à 217€ (potentiel de +22%), (3) amélioration attendue des divisions défense et hélicoptères avec accélération de la production de l'Eurofighter Typhoon, (4) soutien du dollar aux résultats du groupe. Ces éléments constituent des bonnes nouvelles concrètes et spécifiques à Airbus, malgré les problèmes de cadence mentionnés."}, {"article_id": 3938, "company_id": 25, "entreprise": "Teleperformance SE", "source": "www.abcbourse.com", "published_at": "2025-11-05", "genre": "résultats d'entreprise", "titre": "Teleperformance : Teleperformance revoit ses prévisions 2025 à la baisse face à un marché ins...", "texte": "(ABC Bourse) - TP (ex-Teleperformance) a abaissé mercredi ses perspectives annuelles, citant un contexte commercial de plus en plus volatil affectant ses dernières prévisions d’activité. Sur le plan commercial, TP vise désormais une croissance à données comparables de seulement 1% à 2 %, contre 2 % à 4 % précédemment. Un recul clair dans ses ambitions. Côté rentabilité, la marge d’Ebita courant est attendue entre 14,7 % et 15 %, alors que la fourchette initiale allait de 15 % à 15,1 %. Des ajustements mesurés, mais qui traduisent un coup de frein net. Plus marquant encore, les prévisions de génération de trésorerie ont été largement revues. Le groupe, sorti du CAC 40 en septembre, anticipe dorénavant une génération de cash-flow net disponible d'environ 900 millions d'euros hors décaissements non-récurrents. Un recul de 100 millions d’euros par rapport aux ambitions précédentes. Une activité qui marque le pas malgré des revenus solides Sur le troisième trimestre clos au 30 septembre, TP affiche un chiffre d’affaires de 2,507 milliards d’euros. Si cette performance reste solide, elle révèle une baisse de 0,5 % en données publiées, et une modeste hausse de 1,5 % à données comparables. Des résultats en demi-teinte qui confirment un ralentissement de l’activité, et soulignent la difficulté de projection dans un environnement globalement instable. © AbcBourse.com. Tous droits réservés Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Teleperformance a abaissé ses perspectives annuelles de croissance, de marge d'Ebita et de génération de trésorerie. Le chiffre d'affaires du T3 est en baisse de 0,5% en données publiées.", "note_haiku": 0, "justification_haiku": "L'article contient plusieurs faits concrets négatifs spécifiques à Teleperformance SE : abaissement des perspectives annuelles, réduction de la croissance attendue (de 2-4% à 1-2%), baisse de la marge d'Ebita courant (de 15-15,1% à 14,7-15%), réduction majeure des prévisions de cash-flow net disponible (de 1 milliard à 900 millions d'euros, soit -100M€), et ralentissement de l'activité confirmé au T3. Ces éléments constituent des mauvaises nouvelles concrètes justifiant une note négative."}, {"article_id": 59142, "company_id": 2, "entreprise": "AIRBUS", "source": "www.bfmtv.com", "published_at": "2026-09-03", "genre": "article dédié", "titre": "Airbus n'a livré aucun appareil de ce modèle après fin mai: un outil oublié dans un avion en production a perturbé pendant plusieurs mois les livraisons d'Airbus A330", "texte": "L'incident a contraint Airbus à inspecter les autres A330 en passe d'être livrés et les procédures prévues pour éviter ce genre d'oubli. Un outil oublié dans un avion livré par Airbus a perturbé pendant plusieurs mois les livraisons d' A330 , qui ont désormais repris, a-t-on appris jeudi auprès de l'avionneur européen. \"Nous avons récemment identifié un problème de qualité isolé sur le plan horizontal au niveau de la queue d'un A330\", a indiqué un porte-parole d'Airbus dans un communiqué. \"Cela nous a amenés à inspecter les A330 dans le processus de production, ralentissant les livraisons mensuelles lors de l'été\", a ajouté ce porte-parole. Une source a indiqué, sous couvert de l'anonymat, que ce \"problème de qualité\" venait d'un outil retrouvé dans l'appareil après sa livraison, ce qui n'avait pas mis en péril la sûreté. L'incident a contraint Airbus à inspecter les autres A330 en passe d'être livrés et les procédures prévues pour éviter ce genre d'oubli. L'usine où il s'est produit n'a pas été précisée. \"C'est un simple problème qualité, pas un problème critique. L'incidence sur les flux, les cadences, est limitée. Et les livraisons ont repris\", a ajouté cette source. 418 livraisons depuis le début de l'année Les chiffres d'Airbus, disponibles jusqu'au 31 juillet, montrent qu'aucun A330 n'a été livré après la fin mai. Ce modèle gros porteur avait représenté moins de 5% des livraisons du groupe en 2025, qui sont concentrées pour plus de trois quarts dans la famille de monocouloirs A320. En juillet, l'avionneur européen a livré au total 67 appareils , autant que le même mois de l'année précédente. Sur les sept premiers mois de l'année, Airbus en est à 418 livraisons. L'objectif est de porter cette année à 870 le record de livraisons annuelles, mieux qu'en 2019, où il avait été établi à 863 appareils. Pour y parvenir, Airbus va être contraint d'augmenter sa cadence au second semestre, ce qui doit être permis, entre autres, par l'inauguration en juin, dans l'usine de Blagnac à côté de Toulouse, d'une seconde chaîne d'assemblage pour l'A320. Le constructeur assemble des avions sur dix chaînes dans le monde, en France, en Allemagne, en Chine et aux États-Unis. Sujets liés : Aéronautique Industries", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne un problème de qualité ayant ralenti les livraisons d'A330 pendant l'été (fait négatif), mais précise que le problème est isolé, non critique et que les livraisons ont repris. Il évoque également l'inauguration d'une seconde chaîne d'assemblage pour l'A320 et un objectif de livraisons record pour l'année (faits positifs). Les signaux positifs et négatifs s'équilibrent.", "note_haiku": 1, "justification_haiku": "L'article mentionne un problème de qualité isolé chez Airbus (outil oublié dans un A330) qui a ralenti les livraisons estivales, mais précise que les livraisons ont repris et que l'incidence est limitée. Aucun fait concret négatif majeur (pas d'amende, pas de procès, pas d'avertissement sur résultats) ni positif spécifique (pas de contrat gagné, pas de hausse de résultats) n'est identifiable. Les informations factuelles sur les livraisons (418 depuis le début de l'année, objectif de 870) sont neutres et contextuelles. Pas de variation de cours mentionnée."}, {"article_id": 14525, "company_id": 2, "entreprise": "AIRBUS", "source": "www.abcbourse.com", "published_at": "2025-12-30", "genre": "article dédié", "titre": "Airbus  : Teste la résistance des 200E", "texte": "(Zonebourse.com) - Airbus teste la résistance des 200E (du 3 au 9 décembre) et pourrait s'en aller combler le \"gap\" des 203,5E du 28 novembre. Mais le principal objectif demeure le retracement de la zone des 210E avant de rééditer les 214,6E du 31 octobre. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne des niveaux de résistance et des objectifs de cours pour Airbus basés sur l'analyse technique, mais ne contient aucun fait concret positif ou négatif concernant l'activité de l'entreprise (résultats, contrats, etc.).", "note_haiku": 1, "justification_haiku": "L'article ne contient aucun fait concret spécifique à l'activité d'Airbus (résultats, contrats, amende, etc.). Il s'agit uniquement d'une analyse technique des niveaux de prix et de résistance du cours de l'action, sans information sur l'entreprise elle-même. Pas de variation de cours précise mentionnée non plus."}, {"article_id": 17329, "company_id": 13, "entreprise": "SOITEC", "source": "www.tradingsat.com", "published_at": "2026-01-15", "genre": "article dédié", "titre": "Le mastodonte taïwanais des semi-conducteurs TSMC fait grimper Soitec, STMicro et surtout ASML, qui pèse plus de 500 milliards de dollars en Bourse", "texte": "Le mastodonte taïwanais des semi-conducteurs TSMC fait grimper Soitec, STMicro et surtout ASML, qui pèse plus de 500 milliards de dollars en Bourse jeudi 15 janvier 2026 à 11h30 (BFM Bourse) - Le fondeur taïwanais a dévoilé un bénéfice record au titre de la fin d'année et des perspectives engageantes, grâce notamment à l'intelligence artificielle, suggérant une importante demande pour l'industrie des semi-conducteurs. Ce qui propulse les actions du secteur, dont le néerlandais ASML qui a franchi la barre des 500 milliards de dollars de capitalisation. À l'image des américains Oracle ou Nvidia, TSMC est aussi un bon baromètre pour mesurer la santé de la demande en matière de technologies d'intelligence artificielle. Le géant taïwanais des semi-conducteurs possède une importance critique au niveau mondial, pour ne pas dire systémique. Le groupe taïwanais est le premier fondeur au monde (plus de 50% de parts de marché) de composants semi-conducteurs. TSMC occupe ainsi une place vitale dans la chaîne d'approvisionnement de nombreux industriels et sociétés technologiques, comme Apple et Nvidia. La société taïwanaise a fait état ce jeudi 15 janvier de solides chiffres pour la fin d'année 2025 et surtout de perspectives engageantes pour 2026. Au titre de son quatrième trimestre, TSMC a affiché une progression de 20,5% sur un an de ses revenus, à 1.046 milliards de nouveaux dollars de Taïwan (28,55 milliards d'euros) et tandis que son bénéfice net a bondi de 35% pour atteindre le niveau record 505,7 milliards de nouveaux dollars de Taïwan (soit 13,75 milliards d'euros). Le bénéfice trimestriel de TSMC s'avère aussi supérieur aux attentes. Selon un consensus LSEG SmartEstimate cité par Reuters, les 20 analystes du panel tablaient en effet sur des profits de 478,4 milliards de dollars de Taïwan (27,23 milliards d'euros). \"Au quatrième trimestre, notre activité a été soutenue par une forte demande pour nos technologies de pointe\", a déclaréWendell Huang, vice-président senior et directeur financier de TSMC dans un communiqué. \"TSMC a publié des résultats très solides pour le quatrième trimestre et des perspectives pour 2026 supérieures au consensus pour tous les indicateurs\", apprécient les analystes de Citi. Pour la suite, la société a en effet envoyé des signes de confiance sur l'année en cours. Sur la base des perspectives commerciales actuelles de la société, la direction s'attend à ce que le chiffre d'affaires du premier trimestre se situe entre 34,6 et 35,8 milliards de dollars, soit une hausse comprise de 35,5% et 40,2%. La société compte investir entre 52 milliards de dollars et 56 milliards cette année, bien supérieur au consensus de 48 à 50 milliards de dollars, remarque Citi. Pour le bureau d'études ces indications sont \"un élément clé pour les fabricants européens de semi-conducteurs\" tout comme la déclaration selon laquelle les investissements seront \"nettement plus élevés\" au cours des trois prochaines années. \"TSMC a également évoqué l'accélé", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "Soitec est mentionné comme bénéficiant du sentiment positif général sur le secteur des semi-conducteurs suite aux excellents résultats et perspectives de TSMC, mais aucun fait concret positif ou négatif spécifique à Soitec n'est mentionné dans l'article. La hausse du cours est une réaction de marché générale.", "note_haiku": 1, "justification_haiku": "Fait concret positif spécifique à SOITEC : l'article mentionne que Soitec prend 4,8% ce jeudi 15 janvier vers 11h30, en réaction directe aux excellentes annonces de TSMC. Cette hausse du cours est la conséquence d'une bonne nouvelle pour le secteur des semi-conducteurs dont SOITEC fait partie. L'article établit un lien causal clair entre les résultats positifs de TSMC et la progression de SOITEC."}, {"article_id": 50703, "company_id": 22, "entreprise": "Publicis Groupe", "source": "www.tradingsat.com", "published_at": "2026-07-16", "genre": "article dédié", "titre": "Malgré le Moyen-Orient et les difficultés de sa filiale Sapient, Publicis écrase la concurrence et compte accélérer la cadence au second semestre, l&#039;action grimpe de 3%", "texte": "Malgré le Moyen-Orient et les difficultés de sa filiale Sapient, Publicis écrase la concurrence et compte accélérer la cadence au second semestre, l'action grimpe de 3% jeudi 16 juillet 2026 à 12h44 (BFM Bourse) - Le groupe publicitaire a livré une croissance légèrement supérieure aux attentes au deuxième trimestre et resserré vers le haut sa fourchette d'objectif de croissance. Arthur Sadoun, son PDG, a assuré que la société hausserait le rythme au second semestre sans tabler sur un redressement de sa filiale Sapient. Publicis reste une histoire boursière contrariée. Le groupe ne cesse de gagner des parts de marché face à ses grands concurrents, comme le britannique WPP, l'américain Omnicom ou le japonais Dentsu. En cumulé sur les 18 mois allant de janvier 2025 à juin 2026, le groupe a remporté des contrats représentant 9,3 milliards de dollars de facturation, quand son plus proche de concurrent n'arrive qu'à 300 millions de dollars. La société bat à chaque reprise les attentes du marché, avec une croissance robuste, trimestre après trimestre. Pour autant, son cours de Bourse reste à la traîne avec une hausse d'à peine 3% cette année, et de 2,4% sur un an. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Le groupepâtit d'un statut de victime désignée de l'intelligence artificielle (IA), le marché étant convaincu que l'activité des groupes publicitaires sera plombée par ces nouvelles technologies. \"Les investisseurs restent pessimistes quant à l'impact de l'IA sur les agences\", écrit encore ce jeudi la banque Barclays. Pour cette raison, les dernières publications de la société, aussi étincelantes qu'elles aient pu être, n'avaient guère emballé le marché. La donne est toutefois un peu différente, ce jeudi 16 juillet.Publicisa inauguré le bal des résultats semestriels duCAC 40, livrant des comptes légèrement supérieurs aux attentes. Sur le seul deuxième trimestre, le groupe a vu ses revenus accélérer avec une croissance en données comparables de 4,8% après 4,5% au premier trimestre, surpassant légèrement le consensus (la prévision moyenne des analystes), calé à 4,7% selon Citi. \"L’accélération de 0,3 point de pourcentage par rapport au premier trimestre confirme la montée en puissance des gains de budgets, qui devraient contribuer à hauteur de près de 2 points de pourcentage à la croissance annuelle\", relève Oddo BHF. Par région, la croissance a été tirée par l'Amérique du Nord avec une progression de 5,4% en données comparables, et par l'Europe, en hausse de 5%. La zone \"Moyen-Orient et Afrique\" (2,6% des revenus) a accusé un repli de 8,3% en données comparables, évidemment lesté par le conflit entre les États-Unis et l'Iran. Le directeur financier, Loris Nold, a précisé aux analystes que ce conflit avait également pesé sur l'activité au Royaume-Uni, où les équipes du groupe travaillent beaucoup pour des clients du Golfe. Par métier, les services marketing, qui représentent 87% du revenu net de ", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Publicis a livré une croissance supérieure aux attentes au T2 (4,8% vs 4,7% consensus), a resserré vers le haut sa fourchette d'objectif de croissance pour 2026 (4,5-5% vs 4-5%), a gagné des parts de marché significatives (9,3 milliards de dollars de contrats), a augmenté sa marge opérationnelle (17,5% vs 17,4%) et son flux de trésorerie (950M€ vs 828M€).", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Publicis Groupe : (1) croissance de 4,8% au T2 surpassant le consensus à 4,7% ; (2) accélération par rapport au T1 (4,5%) ; (3) relèvement de la fourchette d'objectif de croissance 2026 vers le haut (4,5%-5% vs 4%-5% précédemment) ; (4) marge opérationnelle en hausse à 17,5% vs 17,4% un an plus tôt ; (5) flux de trésorerie renforcé à 950M€ vs 828M€ ; (6) remport de contrats représentant 9,3 milliards de dollars de facturation en 18 mois, surpassant largement la concurrence. Ces éléments constituent une publication solide avec dépassement des attentes et relèvement d'objectifs."}, {"article_id": 52025, "company_id": 5, "entreprise": "BNP PARIBAS ACT.A", "source": "www.tradingsat.com", "published_at": "2026-07-23", "genre": "article dédié", "titre": "BNP PARIBAS ACT.A : Malgré des résultats tirés par un bond de 43% des revenus des métiers actions et un objectif de capital atteint avec un an d&#039;avance, BNP Paribas n&#039;impressionne pas (pour l&#039;heure) la Bourse", "texte": "Bnp paribas act.a: Malgré des résultats tirés par un bond de 43% des revenus des métiers actions et un objectif de capital atteint avec un an d'avance, BNP Paribas n'impressionne pas (pour l'heure) la Bourse jeudi 23 juillet 2026 à 19h27 (BFM Bourse) - La banque de la rue d'Antin a publié ce jeudi ses résultats du deuxième trimestre, marqués avant tout par le dynamisme des métiers actions. Le contexte de marché n'aide toutefois pas à apprécier cette copie plutôt saluée par les analystes. BNP Paribas a débuté sur une note tiède voire terne la saison des résultats des banques françaises. L'action de la banque de la rue d'Antin a terminé sur une baisse de 2,8% dans un contexte de marché qui n'a guère aidé les valeurs considérées comme cycliques, telles que les banques ou les constructeurs automobiles. D'ailleurs, outreBNP Paribas,Société Généralea accusé une baisse de 2,95% etCrédit AgricoleSA a abandonné 1,1%.LeCAC 40a lui perdu 1,64%, lesté par la hausse du pétrole et des rendements obligataires. Pas le meilleur jour donc pour publier des résultats, 35 des 40 valeurs de l'indice ayant terminé dans le rouge. Les résultats deBNP Paribasont pourtant été appréciés par les analystes. Au deuxième trimestre, le groupe a publié un bénéfice net de 4,34 milliards d'euros en hausse de 33,4% et supérieur de 4% aux prévisions des bureaux d'études. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Le produit net bancaire, équivalent du chiffre d'affaires chez les banques, a progressé de 12% à 14,091 milliards d'euros, tandis que les frais de gestion, c'est-à-dire les coûts, ont progressé de 10%. \"L'effet ciseau\" (la différence de variation entre revenus et coûts) s'avère positif à hauteur de 1,6 point de pourcentage. Selon un consensus cité par Jefferies, le produit net bancaire a dépassé les attentes de 4% tandis que les coûts ont été plus élevés à hauteur de 2%. Par division, plusieurs métiers se sont particulièrement mis en avant. C'est le cas avant tout de la Banque de financement et d'investissement (CIB) de l'établissement de la rue d'Antin. Ses revenus ont dépassé le consensus à hauteur de 6%. Cette surperformance est avant tout tirée par les activités de marché, et plus exactement les métiers \"Equity and Prime Services\", c'est-à-dire actions et dérivés actions. Ces métiers ont bondi de 43% sur un an pour générer des revenus de 1,41 milliard d'euros, dépassant les 1,12 milliard attendus par les analystes. Citi note que cette performance sur les métiers actions a permis presque à elle seule au groupe de dépasser les attentes sur son produit net bancaire. Du côté de la banque de détail, la division a dépassé les attentes de 3%, grâce notamment à une bonne performance de la France. Le produit net bancaire a battu le consensus de 5% dans l'Hexagone à 1,81 milliard d'euros tandis que le bénéfice avant impôts l'a battu de 10%. KBW note une \"solide croissance des revenus nets d'intérêts en France\", c'est-à-dire", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "BNP Paribas a publié un bénéfice net en hausse de 33,4% et supérieur aux prévisions, un produit net bancaire en progression de 12%, et les revenus des métiers actions ont bondi de 43%. L'objectif de ratio CET1 de 13% a été atteint avec un an d'avance, ce qui pourrait mener à un programme de rachats d'actions.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à BNP Paribas : bénéfice net en hausse de 33,4% (dépassant les attentes de 4%), produit net bancaire en progression de 12% (dépassant le consensus de 4%), revenus des métiers actions en hausse de 43%, atteinte de l'objectif de ratio CET1 de 13% avec un an d'avance. Ces résultats sont explicitement salués par les analystes (Citi, Jefferies, KBW). Bien que le cours ait baissé de 2,8% en raison du contexte de marché général défavorable, les faits concrets relatifs à l'activité et aux résultats de BNP Paribas sont clairement positifs."}, {"article_id": 6704, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.abcbourse.com", "published_at": "2025-11-19", "genre": "article dédié", "titre": "Nigeria  : TotalEnergies augmente sa participation dans OPL257", "texte": "(AOF) - TotalEnergies annonce la signature d’accords avec Conoil Producing Limited, prévoyant l’acquisition par TotalEnergies d’une participation opérée de 50% dans le bloc OPL257. Il est prévu aussi que Conoil acquiert une participation de 40% détenue par TotalEnergies dans le bloc OML136. Ces deux blocs sont situés au large du Nigeria. Une fois cette transaction finalisée, la participation de TotalEnergies dans OPL257 augmentera de 40% à 90%, tandis que Conoil conservera une participation de 10% dans ce bloc. La finalisation de la transaction est soumise aux conditions habituelles, notamment l'approbation du régulateur. Couvrant une superficie d'environ 370 kilomètres carrés, le bloc OPL257 est situé à 150 kilomètres au large des côtes nigérianes. Il est adjacent au bloc PPL261, où TotalEnergies (24%) et ses partenaires ont découvert en 2005 le gisement d'Egina South, qui s'étend également sur le bloc OPL257. Il est prévu de forer en 2026 un puits d'appréciation d'Egina South sur OPL257, en vue d'un développement de ce gisement par raccordement au FPSO Egina, situé à environ 30 km. © 2025 Agence Option Finance (AOF) - Tous droits de reproduction réservés par AOF. AOF collecte ses données auprès des sources qu'elle considère les plus sûres. Toutefois, le lecteur reste seul responsable de leur interprétation et de l'utilisation des informations mises à sa disposition. Ainsi le lecteur devra tenir AOF et ses contributeurs indemnes de toute réclamation résultant de cette utilisation. Agence Option Finance (AOF) est une marque du groupe Option Finance Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "TotalEnergies annonce la signature d'accords pour acquérir une participation opérée de 50% dans le bloc OPL257, augmentant sa participation de 40% à 90%, et prévoit le forage d'un puits d'appréciation en 2026 pour le développement du gisement d'Egina South.", "note_haiku": 2, "justification_haiku": "L'article annonce un fait concret et spécifique positif pour TotalEnergies : la signature d'accords d'acquisition d'une participation opérée de 50% dans le bloc OPL257 au Nigeria, ce qui augmentera sa participation de 40% à 90% dans ce bloc. Il s'agit d'une expansion d'actifs pétroliers offshore avec perspective de développement du gisement d'Egina South en 2026. C'est une bonne nouvelle stratégique et opérationnelle pour l'entreprise."}, {"article_id": 25170, "company_id": 25, "entreprise": "Teleperformance SE", "source": "www.abcbourse.com", "published_at": "2026-02-26", "genre": "article dédié", "titre": "L'ex-Teleperformance nomme un nouveau directeur général pour faire face au défi de l'IA", "texte": "(Agefi-Dow Jones)--Le gestionnaire de centres d'appels TP a annoncé jeudi la nomination de Jorge Amar en tant que directeur général à compter du 16 mars prochain, après avoir publié des résultats en baisse au titre de 2025. \"Nous devons désormais accélérer le déploiement de nos offres existantes, enrichir notre portefeuille de solutions et permettre à nos clients de réaliser les gains d'efficacité et de productivité que la technologie rend aujourd'hui possibles\", a déclaré le futur directeur général de TP dans un communiqué. Jorge Amar est un spécialiste de l'intégration de l'intelligence artificielle (IA) dans les opérations clients, a souligné TP, qui fait l'objet de vives inquiétudes depuis plusieurs années quant à l'impact disruptif de l'IA générative sur son activité. Signe de ces craintes, l'action TP accusait jeudi à la clôture une chute de 78% en trois ans. Dans le cadre de cette succession, Daniel Julien, fondateur et directeur général de TP, mais également Thomas Mackenbrock, le directeur général délégué, quitteront leurs fonctions exécutives le 15 mars. De son côté, Olivier Rigaudy, le directeur financier, a décidé de prendre sa retraite. S'il quittera aussi ses fonctions le 15 mars, il accompagnera le nouveau directeur général en tant que conseiller jusqu'à la fin de l'année. Benoît Gabelle, l'actuel directeur financier adjoint, assurera l'intérim, a indiqué jeudi TP. Au cours de l'exercice écoulé, l'ex- Teleperformance a dégagé un résultat net part du groupe de 497 millions d'euros, contre 523 millions d'euros en 2024. Pour sa part, le résultat d'exploitation ajusté (Ebita) a atteint 1,49 milliard d'euros en 2025, contre 1,54 milliard d'euros lors de l'exercice précédent. La marge correspondante s'inscrit à 14,6%, contre 15% en 2024. De son côté, le chiffre d'affaires de TP s'est établi à 10,21 milliards d'euros l'an dernier, soit une baisse de 0,7% en données publiées par rapport à 2024. En données comparables, l'activité a crû de 1,3% en 2025. En novembre dernier, le groupe avait dit tabler sur une croissance de son chiffre d'affaires de 1% à 2% en données comparables. Pour 2025, les analystes sondés par FactSet escomptaient en moyenne un chiffre d'affaires de 10,24 milliards d'euros et un Ebita de 1,47 milliard d'euros. Compte tenu de l'ensemble de ces éléments, TP compte verser un dividende de 4,50 euros par action au titre de l'exercice 2025, contre 4,20 euros par action pour l'exercice précédent. Concernant ses perspectives, TP anticipe pour 2026 un chiffre d'affaires stable ou en croissance de 2% au maximum en données comparables. En parallèle, TP prévoit cette année une marge d'Ebita récurrente d'environ 14,6%. COMMUNIQUES FINANCIERS DE TELEPERFORMANCE : https://www.tp.com/fr-fr/investisseurs/publications-et-evenements/communiques-de-presse/?page=1 Agefi-Dow Jones The financial newswire Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'entreprise a publié des résultats en baisse pour 2025, avec un résultat net, un Ebita, une marge et un chiffre d'affaires (en données publiées) en diminution. Le chiffre d'affaires a également manqué les attentes des analystes.", "note_haiku": 0, "justification_haiku": "L'article contient plusieurs faits concrets négatifs spécifiques à Teleperformance SE : baisse du résultat net (497M€ vs 523M€ en 2024), baisse de l'Ebita ajusté (1,49Md€ vs 1,54Md€), dégradation de la marge (14,6% vs 15%), baisse du tié le nombre de \"planeurs\". Bien que la cible de production de l'A220 ait été abaissée, l'ensemble des faits concrets est très positif.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Airbus : (1) revenus de 17,83 milliards d'euros en hausse de 14% sur un an, dépassant le consensus de 17,37 milliards ; (2) chiffre d'affaires de la division civile de 13,05 milliards en progression de 12% ; (3) 201 avions livrés vs 174 l'année précédente ; (4) résultat opérationnel ajusté en hausse de 38% à 1,94 milliard d'euros, dépassant les attentes de 1,76 milliard ; (5) marge de 11,9% en hausse de 2,7 points ; (6) génération de 696 millions d'euros de flux de trésorerie au T3, dépassant les attentes de 531 millions ; (7) réduction des planeurs de 60 à 32 unités. Tous ces éléments constituent des bonnes nouvelles concrètes pour Airbus."}, {"article_id": 58025, "company_id": 13, "entreprise": "SOITEC", "source": "www.abcbourse.com", "published_at": "2026-08-31", "genre": "article dédié", "titre": "Soitec Silicon: la cassure de 117 euros relance la dynamique vers 135", "texte": "Actualité publiée le 31/08/26 15:00 Soitec Silicon: la cassure de 117 euros relance la dynamique vers 135 (ABC Bourse) - Soitec Silicon bondit de 9,81% à 118,60 euros et franchit la résistance de 117, validant une accélération technique. Ce débordement ouvre la voie vers la prochaine zone de blocage identifiée autour de 135, tandis que le RSI à 44,92 reste neutre, laissant un potentiel d’extension sans signal de surachat excessif. Le mouvement intervient dans un marché parisien quasi stable (CAC 40: +0,04%) et un secteur Matériel et équipement technologiques inchangé (-0,02%), ce qui confère à la hausse un caractère spécifique au titre. En toile de fond, la société a récemment renforcé la visibilité de sa ligne Photonics-SOI, avec des contrats sécurisés et une montée en puissance industrielle, éléments susceptibles d’alimenter le flux acheteur
