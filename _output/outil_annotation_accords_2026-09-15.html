e de ventes d'actifs, à savoir sa participation de 67% dans sa filiale marocaine ainsi que les 25% détenus au capital de l'assureur belgeAgeas. Selon Barclays, le groupe a également réduit sa participation au capital de sa filiale polonaise à 75% en vendant 9,2 millions de titres. La banque britannique et Jefferies chiffraient l'impact global de ces transactions sur le ratio CET 1 (les fonds propres rapportés à l'encours pondéré des risques) à 26 points de base, soit 0,26 point de pourcentage. Ce jeudi,BNP Paribasa cette fois annoncé une acquisition. La banque est entrée en négociations exclusives avec Mercedes-Benz pour reprendre à 100% sa filiale de leasing automobile (financement de longue durée des locations automobiles), Athlon. Créée en 1916 et à l'origine une société de réparation de voitures, l'entreprise allemande compte une flotte de 400.000 véhicules en location. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading BNP Paribas s'attend à ce que cette opération retranche 13 points de base à son ratio CET 1. Le groupe précise néanmoins que cet impact est déjà intégré dans son objectif de moyen terme, c'est-à-dire un ratio de 13% en 2027. Le montant de l'opération n'a pas été dévoilé mais Jefferies calcule que l'impact de 13 points de base sur le ratio CET 1 représente environ 1 milliard d'euros. La banque table sur une clôture de la transaction au cours de 2026 et estime qu'elle ajoutera environ 200 millions d'euros au bénéfice net au terme de la troisième année suivant la finalisation de l'opération. Surtout, l'acquisition d'Athlon permettrait à Arval, la filiale de leasing automobile deBNP Paribas, de gagner en taille pour atteindre un parc en location de près de 2,3 millions de véhicules \"à comparer avec l'actuel leader (européen, NDLR) disposant de 2,6 millions de véhicules en LLD (location longue durée, NDLR)\". BNP Paribas ne précise pas le nom de ce \"leader\". Mais il s'agit d'Ayvens, filiale de leasing deSociété Générale. Cette entreprise a été créée en 2023 à la suite du rachat du néerlandais Leaseplan par ALD, propriété de la banque rouge et noir. Ayvens revendique une flotte de 3,2 millions de véhicules dont 2,6 million", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'acquisition d'Athlon est estimée ajouter 200 millions d'euros au bénéfice net de BNP Paribas et est jugée stratégiquement pertinente par Barclays, malgré un impact négatif sur le ratio CET1 qui est déjà intégré dans les objectifs.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à BNP PARIBAS ACT.A : (1) annonce de l'acquisition d'Athlon, filiale de Mercedes, permettant à Arval d'atteindre 2,3 millions de véhicules en location et de rivaliser avec Ayvens (leader européen) ; (2) impact positif estimé à environ 200 millions d'euros au bénéfice net à terme ; (3) Barclays souligne l'impact positif sur le bénéfice net et le rationnel stratégique 'fait sens' ; (4) positionnement de BNP PARIBAS comme numéro 2 clair dans la gestion de flottes automobiles avec davantage de synergies. Ces éléments constituent des bonnes nouvelles stratégiques et financières concrètes pour l'entreprise."}, {"article_id": 6705, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.abcbourse.com", "published_at": "2025-11-19", "genre": "article dédié", "titre": "TotalEnergies renforce sa position dans l'offshore nigérian", "texte": "(Zonebourse.com) - TotalEnergies annonce la signature d'accords avec Conoil Producing Limited prévoyant l'acquisition d'une participation opérée de 50% dans le bloc OPL257 et, en parallèle, la cession à Conoil de sa participation de 40% dans le bloc OML136. Une fois l'opération finalisée, la major détiendra 90% d'OPL257, Conoil conservant 10%. Ce bloc offshore de 370 km², situé à 150 km des côtes, est adjacent au bloc PPL261 où le gisement Egina South a été découvert en 2005 et s'étend sur OPL257. Un puits d'appréciation y sera foré en 2026, en vue d'un raccordement potentiel au FPSO Egina situé à 30 km. Mike Sangster, directeur Afrique de l'Exploration-Production, souligne que cette transaction s'inscrit dans la stratégie visant à valoriser les infrastructures existantes et à concentrer les activités nigérianes sur les actifs opérés offshore. La finalisation reste soumise aux conditions habituelles, dont l'approbation du régulateur. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "TotalEnergies annonce l'acquisition d'une participation opérée de 50% dans le bloc OPL257, portant sa détention à 90%, et la cession de sa participation dans le bloc OML136, s'inscrivant dans une stratégie de valorisation des infrastructures existantes et de concentration sur les actifs opérés offshore.", "note_haiku": 2, "justification_haiku": "L'article annonce un fait concret et spécifique positif pour TotalEnergies : l'acquisition d'une participation opérée de 50% dans le bloc OPL257 (portant sa participation totale à 90%), associée à une cession stratégique. Cette transaction s'inscrit dans la stratégie de valorisation des infrastructures existantes et de concentration sur les actifs opérés offshore, ce qui constitue une bonne nouvelle pour le développement du portefeuille d'exploration-production du groupe."}, {"article_id": 2834, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2025-10-30", "genre": "article dédié", "titre": "AIRBUS GROUP  : Dans d'excellentes dispositions graphiques et techniques", "texte": "AIRBUS GROUP: Dans d'excellentes dispositions graphiques et techniques jeudi 30 octobre 2025 à 09h00 (BFM Bourse) - Une dynamique haussière clairement affirmée sur l'actionAIRBUS GROUPinvitera les investisseurs actifs à se positionner à l'achat, dans le cadre d'une opération de swing trading. NB: les opérateurs qui auront suivi notre recommandation sur ce même dossier pourront conserver la position, en prenant soin d'ajuster le stop et l'objectif. L'analyse graphique en données quotidiennes de l'actionAIRBUS GROUPpermet d'identifier une tendance haussière à court terme comme à moyen terme. Le biais haussier est ferme, régulier, fruit du rassemblement chronique du camp acheteur. Sur le plan des indicateurs de tendance, la moyenne mobile à 50 jours (en orange) fait office de support pour les cours. L'ascension des cours se fait en pleine convergence avec les volumes d'une part, et l'indice de force relative d'autre part. A court terme, la moyenne mobile à 20 jours (en bleu foncé) fait office de support. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionAIRBUS GROUPà court terme. Les investisseurs actifs prendront position à l'achat sur le titreAIRBUS GROUPau cours de 211,35 € avec un objectif à 240.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 199 €.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente une analyse technique haussière et une recommandation d'achat pour AIRBUS GROUP, mais ne contient aucun fait concret positif ou négatif concernant l'activité ou les résultats de l'entreprise (chiffre d'affaires, contrats, bénéfices, etc.).", "note_haiku": 1, "justification_haiku": "L'article contient uniquement une analyse technique graphique et des recommandations de trading (avis haussier, objectif de cours, stop). Aucun fait concret spécifique à l'activité d'AIRBUS n'est mentionné : pas de résultats, pas de contrat, pas de chiffre d'affaires, pas de variation d'activité. La variation de cours n'est pas fournie dans l'article. Le sentiment est positif mais repose exclusivement sur l'analyse graphique, pas sur des fondamentaux. Cela correspond à NEUTRAL selon les règles strictes."}, {"article_id": 23913, "company_id": 10, "entreprise": "NEXANS", "source": "www.tradingsat.com", "published_at": "2026-02-19", "genre": "article dédié", "titre": "NEXANS : Avec des perspectives jugées décevantes pour 2026, Nexans crispe la Bourse et chute de 7%", "texte": "Nexans: Avec des perspectives jugées décevantes pour 2026, Nexans crispe la Bourse et chute de 7% jeudi 19 février 2026 à 14h57 (BFM Bourse) - Le fabricant de câbles industriels recule nettement à la Bourse de Paris après avoir dévoilé des résultats annuels 2025 jugés inférieurs aux attentes, et des perspectives un peu courtes pour l'année en cours. Nexans est l'une des valeurs phares pour jouer la transition énergétique au sein de l'univers des câbles. L'expositionà cette thématique d'avenir lui permis au fabricant de câbles d'enchaîner ces derniers trimestres des publications époustouflantes. En l'espace de sept années,Nexansa totalement changé de visage. Le groupe a remis d'équerre ses activités les moins performantes et s'est recentré sur ses segments liés à l'électrification, c'est-à-dire les câbles pour la production, l'usage et la transmission d'électricité. L'entreprise fait d'ailleurs partiede la trentaine de valeurs européennes favorites d'Oddo BHF pour 2026. Cette transformation se poursuit et a encore porté ses fruits en 2025.Nexansa profité d'une forte demande pour ses solutions d'électrification. Sur l'ensemble de 2025, l'entreprise a dégagé des revenus de 6,1 milliards d'euros (et de 7,81 milliards d'euros en intégrant les variations des prix du cuivre et de l'aluminiumdepuis 2020), en croissance de 8,3% en données organiques, c'est-à-dire hors effets de changes et de périmètre. Sur le seul quatrième trimestre, la croissance organique a atteint 11,8%, ce qui marque une accélération séquentielle (d'un trimestre sur l'autre)après une hausse organique de 5,8% au troisième trimestre 2025. Sur l'ensemble de 2025, le résultat brut d'exploitation (Ebitda) ajusté s'est établi à 728 millions d'euros, en hausse de 27,3% sur un an. La marge correspondante s'inscrit à 11,9%. Nexans a notamment bénéficié des performances de ses activités d'électrification. Cette division a été portée par le dynamisme du segment \"power-transmission\", c'est-à-dire les câbles liés à la génération d'électricité. Ce segment a enregistré une croissance organique \"exceptionnellement élevée\" de 29,8% en 2025 dont une croissance organique de 40% sur les trois derniers mois de l'année, portée, expliqueNexans, par une concentration accrue de campagnes d’installation. Un peu plus bas dans les comptes, le groupe a également dégagé un bénéfice net part du groupe de 358 millions d'euros à fin décembre contre 283 millions d'euros un an plus tôt. Le flux de trésorerie libre normalisé a lui aussi fortement progressé sur un an pour atteindre 344 millions d'euros, contre 177 millions d'euros à fin 2024. Pour autant, les annonces deNexansreçoivent un accueil glacial, l'action chutant de plus de 7% vers 14h50, ce jeudi 19 février. Dans un commentaire de marché, les analystes d'Allinvest Securities pointent des résultats 2025 inférieurs aux attentes. Selon un consensus cité par le bureau d'études, les analystes tablaient sur un Ebitda ajusté de 795 millions d'euros, un bénéfice de 47", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'action Nexans chute de 7% après la publication de résultats annuels 2025 jugés inférieurs aux attentes des analystes et des perspectives pour 2026 qualifiées de décevantes par les analystes d'Allinvest Securities.", "note_haiku": 0, "justification_haiku": "Nexans a publié des résultats 2025 jugés inférieurs aux attentes des analystes (Ebitda ajusté de 728M€ contre 795M€ attendus, bénéfice de 358M€ contre 478M€ attendus) et des perspectives 2026 qualifiées de 'décevantes' par Allinvest Securities, avec un Ebitda guidé de 730-810M€ inférieur au consensus de 793M€. L'action chute de 7%. Il s'agit de faits concrets négatifs spécifiques à Nexans."}, {"article_id": 51840, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-07-22", "genre": "article dédié", "titre": "AIRBUS GROUP : Une rentabilité qui bondira de 70% à 85% d&#039;ici à 2029, des rachats d&#039;actions de 5 milliards d&#039;euros… Airbus se pare de ses plus beaux atours pour séduire la Bourse (et ça marche)", "texte": "Airbus group: Une rentabilité qui bondira de 70% à 85% d'ici à 2029, des rachats d'actions de 5 milliards d'euros… Airbus se pare de ses plus beaux atours pour séduire la Bourse (et ça marche) mercredi 22 juillet 2026 à 11h10 (BFM Bourse) - Mardi soir après la clôture du marché,Airbusa livré ses perspectives de moyen terme, tablant sur un résultat opérationnel ajusté de 12 à 13 milliards d'euros en 2029, contre 7,1 milliards l'an passé, le tout assorti d'un programme de rachats d'actions de 5 milliards d'euros. Si les analystes jugent ces objectifs prudents, la visibilité offerte par la société enthousiasme la Bourse. Ces dernières années,Airbusa franchi de nombreux obstacles qui obstruaient son horizon. L'avionneur a dû composer avec les affaires de corruptions qui ont frappé la précédente direction, les déboires à répétition de l'A400M, puis le Covid, les difficultés à relancer ensuite une chaîne logistique mise en hibernation pendant la pandémie et les droits de de douane américains. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Airbus a encore des échanges tendus avec ses fournisseurs de moteurs (surtout Pratt&Whitney) pour obtenir les approvisionnements nécessaires à la bonne montée en cadence de sa famille A320 neo, son monocouloir \"best-seller\". L'ex-EADS compte produire d'ici fin 2027 entre 70 et 75 appareils par mois sur cette famille, véritable cash-machine de la société européenne, avant de stabiliser une cadence de 75 sur le début de 2028. S'il reste évidemment des défis à relever pour le groupe,Airbusest sortie des zones de turbulences les plus violentes.Les livraisons du mois de juin,en hausse de plus de 40% sur un an à 89 unités, ont d'alleurs montré que le groupe tenait son cap. L'entreprise a jugé qu'il était temps de permettre au marché de se projeter, en livrant des ambitions de moyen terme. \"Nous sommes aujourd'hui dans une situation, un marché où la demande est très forte, nous avons atteint un niveau de visibilité que nous n'avons jamais eu auparavant, nous avons mis derrière nous beaucoup de défis, nous avons dégagé l'horizon pour aller de l'avant et nous pensons que nous sommes en bonne posture pour donner des objectifs de moyen terme, ce que nous n'avons jamais fait par le passé\", a déclaré aux investisseurs le président exécutif d'Airbus, Guillaume Faury, mardi soir. \"Nous avons aussi coché beaucoup de cases importantes quant à notre capacité à fournir\" les avions, a-t-il ajouté. Ainsi,Airbusa, mardi soir après la clôture du marché, livré ses perspectives à l'horizon 2029 dans le cadre d'un \"business update\" tenu en marge du salon aéronautique de Farnborough. Pour 2029, le groupe vise un résultat opérationnel ajusté, le principal indicateur de rentabilité de la société, allant de 12 à 13 milliards d'euros, à comparer avec un chiffre de 7,1 milliards d'euros en 2025. Ce qui implique donc une hausse de 69 à 83%. Par division, la société a indiqué viser un chiffre de 10", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Airbus a annoncé des perspectives de moyen terme très positives, tablant sur un résultat opérationnel ajusté en forte hausse d'ici 2029 (de 7,1 milliards à 12-13 milliards d'euros), un programme de rachats d'actions de 5 milliards d'euros, et des livraisons en hausse de plus de 40% en juin.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets très positifs spécifiques à Airbus : (1) annonce de perspectives 2029 avec résultat opérationnel ajusté de 12-13 milliards d'euros contre 7,1 milliards en 2025 (hausse de 69-83%), (2) programme de rachats d'actions de 5 milliards d'euros, (3) livraisons de juin en hausse de plus de 40% sur un an à 89 unités, (4) confirmation des objectifs 2026 (870 avions, 7,5 milliards de résultat opérationnel ajusté), (5) objectifs de cadence ambitieux pour les familles A320 neo, A220, A330, A350. Les analystes (Citi, Barclays, Deutsche Bank, Jefferies, Oddo BHF) jugent ces annonces positivement. Le cours gagne 6,7% le jour même."}, {"article_id": 59154, "company_id": 2, "entreprise": "AIRBUS", "source": "www.bfmtv.com", "published_at": "2026-08-06", "genre": "article dédié", "titre": "Un vol européen sur quatre parcourt moins de 500 kilomètres: les avions électriques pourraient assurer ces liaisons commerciales dès 2030 (mais ils ne sortiront pas d'usines Airbus ou Boeing)", "texte": "Selon l'association Transport & Environment, de nombreuses liaisons pourraient être assurées par des avions propres et silencieux actuellement développés par des start-up européennes. Mais les freins sont encore nombreux. Si l'avion électrique n'est pas encore une réalité commerciale, pour l'association Transport & Environment, il a pleinement son rôle à jouer en Europe. La raison en est simple : selon une analyse menée par l’Agence de l’Union européenne pour la sécurité aérienne (AESA), 25% des vols européens parcourent moins de 500 kilomètres, \"une distance à la portée des avions électriques en développement pour cette décennie. Les avions hybrides pourront quant à eux couvrir jusqu’à 1.000 km\", peut-on lire dans un communiqué. \"Imaginez un court vol entre Nice et la Corse, à bord d’un avion qui ne consomme aucun carburant, fait une fraction du bruit habituel, et ne serait pas cloué au sol par une crise pétrolière ou une flambée des prix du carburant. Contrairement aux idées reçues, il ne s’agit pas de science-fiction\", souligne l'association qui évoque bien des liaisons impossibles ou difficiles à réaliser en train. En France, ces technologies pourraient relier le continent aux destinations insulaires, ou des villes voisines aujourd’hui difficiles d’accès sans avion à l'image de Marseille-Bastia, Nice-Bastia, Marseille-Figari, Bordeaux-Lyon, Nice-Clermont-Ferrand, Montpellier-Ajaccio. Ou encore Londres-Dublin, qui est la ligne la plus fréquentée d'Europe. Innovations technologiques \"Beaucoup de gens pensent encore que les avions à batterie relèvent d’un rêve lointain. Mais les vols électriques et hybrides constituent un élément central de la solution pour rendre les courts-courriers plus durables et moins dépendants du kérosène importé. Et les bénéfices ne s’arrêtent pas là : les vols électriques permettront de desservir des territoires souvent délaissés par les grandes lignes aériennes\", commente Carlos López de la Osa, responsable technique aviation chez Transport & Environment. Il faut dire que les choses s'accélèrent avec les innovations technologiques. \"Des avancées majeures dans la densité de puissance des moteurs ont permis de produire des moteurs électriques légers et très performants , associés à des innovations de conception comme la propulsion distribuée et les batteries intégrées aux ailes , ce qui a fondamentalement changé la donne et devrait permettre de concevoir des appareils plus grands qu’on ne le pensait. Les liaisons électriques court-courrier devraient ainsi arriver sur le marché bien plus tôt que prévu\", estime l'association qui table sur des lancements commerciaux en 2030. Pour autant, les premiers appareils ne viendront certainement pas des géants de l'aéronautique comme Boeing et Airbus, ce dernier ayant même reporté son avion \"zéro émission\" et qui semble miser sur l'hydrogène, une technologie loin d'être au point pour l'aérien. Il faut plutôt regarder du côté de start-up innovantes comme l'allemand Vaeridion qui déve", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'article mentionne qu'Airbus a reporté son avion \"zéro émission\", ce qui est un fait concret négatif concernant son activité dans le développement d'avions propres.", "note_haiku": 0, "justification_haiku": "L'article mentionne Airbus une seule fois, dans un contexte négatif concret : 'Airbus, ce dernier ayant même reporté son avion zéro émission et qui semble miser sur l'hydrogène, une technologie loin d'être au point pour l'aérien.' Le report de son avion zéro émission est un fait concret négatif spécifique à Airbus, indiquant un retard dans ses projets de développement d'aéronefs écologiques."}, {"article_id": 52218, "company_id": 16, "entreprise": "VEOLIA ENVIRON.", "source": "www.tradingsat.com", "published_at": "2026-07-25", "genre": "article dédié", "titre": "Veolia Environnement : Quels groupes en Bourse (comme Veolia) peuvent tier parti d&#039;un «Super El Niño», ce phénomène climatique qui s&#039;annonce intense cette année ?", "texte": "Veolia environ.: Quels groupes en Bourse (comme Veolia) peuvent tier parti d'un «Super El Niño», ce phénomène climatique qui s'annonce intense cette année ? samedi 25 juillet 2026 à 07h00 (BFM Bourse) - Ce phénomène qui se traduit par une hausse de la température à la surface de l'eau provoque des épisodes de chaleur et de sécheresse qui créent un important risque inflationniste pour les marchés. Mais des groupes, commeVeoliaà Paris, peuvent également bénéficier de l'intensification de ce phénomène. La Bourse a parfois tendance à négliger cette menace : le climat et les conditions météorologiques. Depuis plusieurs semaines les alertes se multiplient sur El Niño. Ce phénomène climatique se traduit par une hausse de la température à la surface de l'eau et provoque des épisodes de chaleur et de sécheresse. \"Lors d’un épisode El Niño, les alizés s’affaiblissent, les eaux chaudes se déplacent vers l’est du Pacifique et l’équilibre atmosphérique mondial est profondément perturbé. Cela modifie les courants-jets, les régimes de précipitations, les températures et les trajectoires des tempêtes à l’échelle planétaire\", développe John Plassard de Cité Gestion. L'expert de marché souligne que ce phénomène provoque généralement davantage de sécheresses en Asie du Sud-Est, en Australie, en Inde ou en Afrique australe, tout en augmentant les risques d’inondations dans certaines régions des Amériques. El Niño influence également fortement les productions agricoles, les ressources hydriques, les barrages hydroélectriques et même certaines maladies comme le choléra ou la dengue. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Selon Météo France, El Niño se produit tous les deux à sept ans, le dernier phénomène étant survenu de l'été 2023 au printemps 2024. Un nouvel épisode se produit depuis juin dernier, avec une intensité maximale qui pourrait s'étendre entre juillet et septembre. Le réchauffement climatique intensifie ce phénomène au point qu'il pourrait atteindre des proportions inédites cette année. \"El Niño n’est pas causé par le changement climatique, mais dans un monde plus chaud, les deux phénomènes peuvent se renforcer mutuellement\", explique Michael Lewis, de DWS. D'après les modèles de l'Agence américaine d'observation océanique (NOAA), du Centre européen pour les prévisions météorologiques à moyen terme (ECMWF) et de la Nasa, \"ce phénomène pourrait atteindre son apogée avec un indice El Niño d'environ 3,5° celsius, ce qui dépasserait le phénomène le plus intense jamais enregistré dans l'histoire moderne (2015-2016), lorsque l'indice avait atteint un pic proche de 2,8° celsius\", note Barclays. D'aucuns parlent d'un \"Super El Niño\", qui inquiètent les économistesen raison des conséquences sur l'inflation qu'il pourrait causer via des tensions sur l'offre. \"Les prévisions actuelles laissent entrevoir l'un des phénomènes El Niño les plus intenses jamais enregistrés au quatrième trimestre. Cela revêt une", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Barclays anticipe que Veolia bénéficiera d'une augmentation de la demande en eau potable due à la hausse des températures et au stress hydrique, ce qui devrait créer un \"effet favorable tangible à court terme\" sur ses résultats.", "note_haiku": 2, "justification_haiku": "L'article contient un fait concret positif spécifique à Veolia : Barclays identifie explicitement Veolia comme bénéficiaire du phénomène El Niño, avec une augmentation attendue de la demande en eau potable en France et en Espagne créant 'un effet favorable tangible à court terme jusqu'à la fin du troisième trimestre 2026'. Le positionnement de Veolia dans la gestion de l'eau et l'adaptation au changement climatique est présenté comme renforçant son argumentaire d'investissement. Ceci constitue une bonne nouvelle concrète et spécifique à l'entreprise."}, {"article_id": 16, "company_id": 1, "entreprise": "AIR LIQUIDE", "source": "www.abcbourse.com", "published_at": "2025-07-29", "genre": "article dédié", "titre": "Air Liquide : Vers de nouveaux sommets historiques avec des ambitions confirmées ?", "texte": "Air Liquide dévoile une nouvelle fois une performance très solide au premier semestre 2025. Dans le détail, le chiffre d’affaires s’est accru de 2,6 %, atteignant 13,722 milliards d’euros. Le résultat opérationnel courant a progressé de 5,2 % pour s’établir à 2,737 milliards d’euros. La marge opérationnelle du groupe s’est améliorée de 50 points de base, pour atteindre 19,9 %. Enfin, le résultat net récurrent part du groupe a enregistré une hausse de 9,6 %, à 1,842 milliard d’euros. Des chiffres de qualité qui ont conduit la direction à confirmer ses objectifs annuels, toujours ambitieux. Il est vrai que le groupe déçoit rarement et c'est ce qui justifie une valorisation historiquement élevée. Le groupe se paie 25 fois ses profits attendus en 2025 ce qui est important pour une société industrielle mais qui n'est pas choquant dans le cas précis d'Air Liquide, toujours au rendez-vous et ce de const COLONNES = ["article_id", "company_id", "entreprise", "source", "published_at", "genre", "titre", "texte", "note_humaine", "commentaire", "note_gemini", "justification_gemini", "note_haiku", "justification_haiku"];
const CLE_STOCKAGE = "annotation_accords_2026-09-15";
const NOMS_NOTE = {0: "Négatif", 1: "Neutre", 2: "Positif"};

let position = 0;
let reponses = DONNEES.map(() => ({note: "", commentaire: ""}));
let stockageDispo = true;

/* ---------- Persistance ---------- */
function charger() {
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (brut) {
      const sauve = JSON.parse(brut);
      if (Array.isArray(sauve) && sauve.length === DONNEES.length) reponses = sauve;
    }
  } catch (e) {
    stockageDispo = false;
    alerter("Ce navigateur ne conserve pas les annotations entre deux ouvertures. Exportez le CSV avant de fermer l'onglet.");
  }
}
function sauver() {
  if (!stockageDispo) return;
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(reponses)); }
  catch (e) {
    stockageDispo = false;
    alerter("Sauvegarde automatique interrompue. Exportez le CSV pour ne rien perdre.");
  }
}
function alerter(message) {
  const el = document.getElementById("alerte");
  el.textContent = message;
  el.hidden = false;
}

/* ---------- Rendu ---------- */
function ecart(cas) {
  return Math.abs(Number(cas.note_gemini) - Number(cas.note_haiku));
}

function construireIndex() {
  const index = document.getElementById("index");
  index.textContent = "";
  DONNEES.forEach((cas, i) => {
    const b = document.createElement("button");
    b.className = "pastille";
    b.dataset.ecart = ecart(cas);
    b.title = `${i + 1}. ${cas.entreprise}`;
    b.setAttribute("aria-label", `Cas ${i + 1}, ${cas.entreprise}`);
    b.addEventListener("click", () => { position = i; afficher(); });
    index.appendChild(b);
  });
}

function majIndex() {
  const pastilles = document.getElementById("index").children;
  for (let i = 0; i < pastilles.length; i++) {
    const note = reponses[i].note;
    if (note === "") pastilles[i].removeAttribute("data-note");
    else pastilles[i].dataset.note = note;
    pastilles[i].setAttribute("aria-current", i === position ? "true" : "false");
  }
}

function afficher() {
  const cas = DONNEES[position];
  const rep = reponses[position];

  document.getElementById("compteur").innerHTML =
    `Cas ${position + 1} <em>sur ${DONNEES.length}</em>`;
  const faits = reponses.filter(r => r.note !== "").length;
  document.getElementById("avancement").innerHTML =
    `<em>${faits} annotés, ${DONNEES.length - faits} restants</em>`;

  const meta = document.getElementById("meta");
  meta.textContent = "";
  const ajout = (texte, classe) => {
    const s = document.createElement("span");
    s.textContent = texte;
    if (classe) s.className = classe;
    meta.appendChild(s);
  };
  ajout(cas.entreprise, "entreprise");
  ajout(cas.source);
  ajout(cas.published_at);
  ajout(cas.genre, "genre");
  if (ecart(cas) === 2) ajout("Les deux modèles s'opposent franchement", "drapeau");

  document.getElementById("titre").textContent = cas.titre;
  document.getElementById("texte").textContent = cas.texte;
  document.getElementById("tronque").hidden = (cas.texte || "").length < 2990;

  document.getElementById("commentaire").value = rep.commentaire || "";

  document.querySelectorAll(".choix-bouton").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.valeur === rep.note && rep.note !== ""));
  });

  // Les notes des modèles restent cachées tant qu'on n'a pas tranché :
  // les lire d'abord fausserait l'annotation.
  const dejaRepondu = rep.note !== "";
  document.getElementById("verdicts").hidden = !dejaRepondu;
  document.getElementById("btn-reveler").hidden = dejaRepondu;
  if (dejaRepondu) remplirVerdicts(cas);

  majIndex();
  window.scrollTo({top: 0});
}

function remplirVerdicts(cas) {
  const g = document.getElementById("note-gemini");
  g.textContent = NOMS_NOTE[cas.note_gemini];
  g.dataset.note = cas.note_gemini;
  document.getElementById("justif-gemini").textContent = cas.justification_gemini || "—";

  const h = document.getElementById("note-haiku");
  h.textContent = NOMS_NOTE[cas.note_haiku];
  h.dataset.note = cas.note_haiku;
  document.getElementById("justif-haiku").textContent = cas.justification_haiku || "—";
}

/* ---------- Actions ---------- */
function repondre(valeur) {
  reponses[position].note = valeur;
  reponses[position].commentaire = document.getElementById("commentaire").value;
  sauver();

  // Marquer le choix tout de suite : sans ça, le bouton ne s'allume qu'au
  // rendu suivant, soit après la demi-seconde de lecture des verdicts.
  document.querySelectorAll(".choix-bouton").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.valeur === valeur && valeur !== ""));
  });

  if (valeur !== "") {
    const cas = DONNEES[position];
    remplirVerdicts(cas);
    document.getElementById("verdicts").hidden = false;
    document.getElementById("btn-reveler").hidden = true;
    majIndex();
    const faits = reponses.filter(r => r.note !== "").length;
    document.getElementById("avancement").innerHTML =
      `<em>${faits} annotés, ${DONNEES.length - faits} restants</em>`;
    setTimeout(() => deplacer(1), 550);
  } else {
    deplacer(1);
  }
}

function deplacer(pas) {
  const cible = position + pas;
  if (cible < 0 || cible >= DONNEES.length) return;
  memoriserCommentaire();
  position = cible;
  afficher();
}

function memoriserCommentaire() {
  reponses[position].commentaire = document.getElementById("commentaire").value;
  sauver();
}

function prochainVide() {
  memoriserCommentaire();
  const depart = position;
  for (let i = 1; i <= DONNEES.length; i++) {
    const j = (depart + i) % DONNEES.length;
    if (reponses[j].note === "") { position = j; afficher(); return; }
  }
  alerter("Tous les cas sont annotés. Pensez à exporter le CSV.");
}

/* ---------- Export ---------- */
function champCsv(valeur) {
  const t = (valeur === null || valeur === undefined) ? "" : String(valeur);
  return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

function exporter() {
  memoriserCommentaire();
  const lignes = [COLONNES.join(";")];
  DONNEES.forEach((cas, i) => {
    const ligne = {...cas, note_humaine: reponses[i].note, commentaire: reponses[i].commentaire};
    lignes.push(COLONNES.map(c => champCsv(ligne[c])).join(";"));
  });
  // BOM UTF-8 : sans lui, Excel affiche les accents de travers.
  const blob = new Blob(["\ufeff" + lignes.join("\r\n")], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "annotation_desaccords_annote.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Câblage ---------- */
document.querySelectorAll(".choix-bouton").forEach(b => {
  b.addEventListener("click", () => repondre(b.dataset.valeur));
});
document.getElementById("btn-prec").addEventListener("click", () => deplacer(-1));
document.getElementById("btn-suiv").addEventListener("click", () => deplacer(1));
document.getElementById("btn-suivant-vide").addEventListener("click", prochainVide);
document.getElementById("btn-export").addEventListener("click", exporter);
document.getElementById("commentaire").addEventListener("change", memoriserCommentaire);
document.getElementById("btn-reveler").addEventListener("click", () => {
  remplirVerdicts(DONNEES[position]);
  document.getElementById("verdicts").hidden = false;
  document.getElementById("btn-reveler").hidden = true;
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "0") { e.preventDefault(); repondre("0"); }
  else if (e.key === "1") { e.preventDefault(); repondre("1"); }
  else if (e.key === "2") { e.preventDefault(); repondre("2"); }
  else if (e.key.toLowerCase() === "v") { e.preventDefault(); repondre(""); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); deplacer(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); deplacer(1); }
  else if (e.key.toLowerCase() === "c") { e.preventDefault(); document.getElementById("commentaire").focus(); }
});

window.addEventListener("beforeunload", e => {
  const faits = reponses.filter(r => r.note !== "").length;
  if (faits > 0) { e.preventDefault(); e.returnValue = ""; }
});

charger();
construireIndex();
afficher();
</script>
