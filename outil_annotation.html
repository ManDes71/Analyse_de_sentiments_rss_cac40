 international dans les semi-conducteurs, notamment dans les radiofréquences, les capteurs et les applications automobiles, répond aux besoins d’un groupe confronté à un environnement concurrentiel plus tendu et à des arbitrages industriels complexes. Pour autant, cette nomination ne modifie pas à court terme les fondamentaux opérationnels. Les perspectives restent prudentes. Les analystes anticipent une poursuite de la baisse des ventes sur l’exercice 2026, avec une contraction marquée des marges liée à la faiblesse du fab loading. La direction a engagé une stratégie de recentrage sur la génération de trésorerie, réduisant ses investissements industriels et acceptant une production plus faible afin d’accompagner le déstockage des clients. À moyen terme, Soitec conserve néanmoins des relais de croissance, notamment dans l’Edge & Cloud AI, qui pourrait progressivement compenser le ralentissement des segments traditionnels. Le marché attend désormais des éléments concrets lors de la publication des résultats annuels et des premières prises de parole du nouveau dirigeant. Techniquement cette annonce a permis un rebond du titre sur la zone de support des 22,62€. Pour un temps le mouvement de reflux est stoppé et on a peut être enfin touché le fond après de nombreuses séquences d'échec de stabilisation. Les principales moyennes mobiles s'aplatissent et nous ne sommes pas loin de rebasculer en tendance haussière court terme. La situation de la société demeure spéculative mais dans cet esprit d'investissement on peut rentrer aujourd'hui pour aller viser les 30€ dans une première étape de revalorisation. Principaux défis de Soitec : La normalisation des stocks dans les communications mobiles et l’automobile Le redressement durable du taux d’utilisation des usines La préservation des marges dans un contexte de volumes contraints La montée en puissance de", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'action Soitec a progressé de plus de 8% suite à l'annonce de la nomination d'un nouveau directeur général, perçue comme un renforcement managérial. Cependant, cette hausse intervient après une année 2025 marquée par des avertissements sur résultats et une chute de 73% de la capitalisation boursière, et les analystes anticipent une poursuite de la baisse des ventes et une contraction des marges pour 2026. Les signaux positifs et négatifs s'annulent.", "note_haiku": 2, "justification_haiku": "L'article contient un fait concret positif spécifique à SOITEC : la nomination de Laurent Rémont au poste de directeur général à compter du 1er avril 2026, explicitement saluée par les investisseurs comme un signal de renforcement managérial. Cette annonce a provoqué une progression du titre de plus de 8% en séance. Bien que l'article mentionne des défis opérationnels et des perspectives prudentes à court terme, le fait concret positif (nomination stratégique bien accueillie) domine le sentiment global de l'article concernant SOITEC."}, {"article_id": 5599, "company_id": 7, "entreprise": "CARREFOUR", "source": "www.tradingsat.com", "published_at": "2025-11-13", "genre": "article dédié", "titre": "CARREFOUR : Pourquoi l'action Carrefour grimpe après l'annonce de la recomposition de son capital", "texte": "Carrefour: Pourquoi l'action Carrefour grimpe après l'annonce de la recomposition de son capital jeudi 13 novembre 2025 à 15h16 (BFM Bourse) - Le groupe de distribution a annoncé mercredi soir l'arrivée à son capital de la famille Saadé concomitamment à la sortie de la famille Diniz, alliée de longue date du groupe. Le départ ordonné des Diniz semble satisfaire le marché, alors qu'en parallèle les rumeurs de cessions de plusieurs pays vont bon train. Carrefour en tête de gondole duCAC 40(ou presque). Le groupe de distribution signe l'une des plus fortes hausses de l'indice parisien ce jeudi 13 novembre, prenant 1,81% vers 15h40. La progression de l'action survient après que la société présidée et dirigée par Alexandre Bomparda annoncé concomitamment deux importants mouvements à son capital. La famille Saadé, propriétaire de l'armateur CMA GM (et lui-même propriétaire de BFM Business), a pris une participation de 4% dans le groupe de distribution. Plus précisément, le nouvel actionnaire est Carrix, une entité détenue conjointement par la famille Saadé et le groupe marseillais. Dans le même temps donc, Carrefour a annoncé la sortie de son capital de Peninsula, la holding de la famille du milliardaire brésilien Abilio Diniz, décédé mi-février 2024. La société brésilienne était arrivée au capital de Carrefour il y a une dizaine d'années, après avoir été le partenaire du rivalCasino. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Sortie ordonnée Peninsula était le deuxième plus grand actionnaire de Carrefour avec une participation de 9,23% du capital à fin décembre et de 8,5% depuis une cession survenue en juin dernier, selon Oddo BHF. \"Cette opération a été réalisée et Peninsula n’anticipe pas d’impact complémentaire sur le marché\", a déclaré Carrefour. Autrement dit, il n'y aura pas d'afflux de titres détenus par Peninsula sur le marché. Le premier actionnaire de référence du groupe de distribution demeure Galfa, filiale de Motier, la holding de la famille Moulin (qui possède le groupe Galeries Lafayette et La Redoute), avec 11,01% du capital à fin décembre 2024. Un analyste estime que la sortie \"ordonnée\" de la famille Peninsula constitue un des éléments pouvant justifier la progression de l'action Carrefour, ce jeudi. \"Le marché s'attendait depuis plus d'un an à ce que la famille Diniz sorte du capital. Cela est désormais fait et donc sans ABB\", explique-t-il. Les \"ABB\" (\"accelerated bookbuilding\") sont des opérations réalisées par la construction accélérée d'un livre d'ordres, et permettent de vendre de gros blocs d'actions qui seraient autrement indigestes pour le marché en ayant recours aux banques. Ce mode opératoire est souvent privilégié par les actionnaires minoritaires pour vendre rapidement d'importants volumes d'actions. Des questions en suspens Ces cessions se font toutefois aux prix d'importantes décotes par rapport à la valeur du titre sur le marché. Par exemple, la semaine dernièr", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article rapporte une réaction positive du marché à la recomposition du capital de Carrefour (arrivée de la famille Saadé, sortie ordonnée de la famille Diniz), ce qui constitue un fait concret positif. Cependant, il inclut également une évaluation concrète négative d'Oddo BHF concernant la situation \"challenging\" en France et les tendances \"pas encourageantes\" au Brésil, qui représentent 80% du résultat opérationnel du groupe. Ces faits concrets positifs et négatifs significatifs s'annulent.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Carrefour : (1) annonce de l'arrivée de la famille Saadé au capital avec une participation de 4% via Carrix ; (2) sortie ordonnée de la famille Diniz du capital sans recours à un ABB (accelerated bookbuilding), ce qui évite une décote importante et satisfait le marché ; (3) l'action grimpe de 1,81% suite à ces annonces. Ces mouvements de capital sont présentés comme des bonnes nouvelles justifiant la hausse du cours."}, {"article_id": 14991, "company_id": 1, "entreprise": "AIR LIQUIDE", "source": "www.abcbourse.com", "published_at": "2026-01-02", "genre": "article dédié", "titre": "Air Liquide confirme viser une autre progression de sa marge opérationnelle sur l'exe...", "texte": "(AOF) - Air Liquide a compilé des éléments afin de faciliter la modélisation financière de ses résultats pour l’exercice 2025. Le spécialiste des gaz industriels, médicaux et technologiques a rappelé qu’au troisième trimestre l’impact des effets de change avait été de -4,2% sur son chiffre d’affaires et que pour le quatrième trimestre il devrait être proche de -6%, soit environ -3,5% sur l’ensemble de l’année. Le géant français a rappelé que ses ventes avaient progressé de 2,7% au troisième trimestre dans le segment Industriel marchand et de 4,9% dans l'activité Santé. En revanche, toujours sur la même période, elles ont reculé de 0,2% dans la division Grande industrie et de 0,9% dans celle de l'Electronique. Le groupe a notamment rappelé qu'il était \"confiant dans sa capacité à augmenter encore sa marge opérationnelle et à réaliser une croissance de son bénéfice net récurrent, à taux de change constants sur l'exercice 2025\". Les résultats annuels seront publiés le 20 février prochain. © 2026 Agence Option Finance (AOF) - Tous droits de reproduction réservés par AOF. AOF collecte ses données auprès des sources qu'elle considère les plus sûres. Toutefois, le lecteur reste seul responsable de leur interprétation et de l'utilisation des informations mises à sa disposition. Ainsi le lecteur devra tenir AOF et ses contributeurs indemnes de toute réclamation résultant de cette utilisation. Agence Option Finance (AOF) est une marque du groupe Option Finance Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente des faits concrets mitigés concernant les performances des ventes au T3 dans différentes divisions (certaines en hausse, d'autres en baisse) et un impact négatif des effets de change sur le chiffre d'affaires, ce qui annule les signaux positifs et négatifs. La confiance du groupe pour 2025 est une projection et non un fait concret actuel.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Air Liquide : (1) progression des ventes de 2,7% en Industriel marchand et 4,9% en Santé au T3 ; (2) déclaration de confiance du groupe dans sa capacité à augmenter sa marge opérationnelle et réaliser une croissance de son bénéfice net récurrent en 2025. Ces éléments constituent des signaux positifs concrets sur l'activité et les perspectives de l'entreprise."}, {"article_id": 2701, "company_id": 10, "entreprise": "NEXANS", "source": "www.abcbourse.com", "published_at": "2025-10-31", "genre": "article dédié", "titre": "Nexans : En toile de fond le mouvement est baissier à court terme", "texte": "Au troisième trimestre 2025, Nexans a publié un chiffre d’affaires en hauss e, confirmant la solidité de sa feuille de route. Le groupe a réaffirmé ses objectifs pour 2025, notamment une marge d’EBITA ajustée comprise entre 6 et 8 % et un cash-flow libre supérieur à 600 millions d’euros. Les segments câbles haute tension et électrification continuent de tirer la croissance, portés par les investissements massifs dans les réseaux électriques terrestres et sous-marins, ainsi que par la montée en puissance des énergies renouvelables. Le positionnement de Nexans sur des projets structurants comme le câblage offshore, l’interconnexion des parcs éoliens ou les réseaux intelligents s’avère stratégique à long terme. En parallèle, la société poursuit une discipline financière rigoureuse : désendettement, maîtrise des coûts, amélioration du mix produit. Ce recentrage, initié sous la direction de Christopher Guérin, a permis de nettement améliorer les marges et de réduire la cyclicité du groupe. Si les résultats ont été assez bien accueillis par le marché, la valorisation devient plus exigeante, intégrant déjà une bonne partie du redressement opérationnel. Les multiples de résultats se rapprochent de la moyenne du secteur, laissant entrevoir un potentiel plus mesuré à court terme, même si le profil de croissance reste attractif à horizon pluriannuel. D'ailleurs du côté de l'analyse technique nous sommes dans une configuration plutôt dégradée. A l'inverse du marché, Nexans corrige depuis plusieurs semaines à l'intérieur d'un canal baissier. On trouve une grosse zone de support sur les 112 euros, niveau que nous visons pour nous réintéresser au dossier. Les principaux défis de Nexans Le groupe devra maintenir sa compétitivité face à une concurrence internationale accrue, notamment asiatique, tout en gérant les tensions sur les coûts des matières premières comme le cuivre et l’aluminium. La réussite de sa transition vers une entreprise plus technologique dépendra également de sa capacité à innover et à exécuter efficacement les grands projets d’électrification mondiale. Enfin, le contexte macroéconomique (taux d’intérêt, croissance européenne) pourrait influencer les investissements dans les infrastructures, un paramètre clé pour ses perspectives à moyen terme. © www.abcbourse.com Vous voulez plus d'analyses et des signaux de trading quotidiens ? Dynamisez votre portefeuille avec ABC Bourse Premium ! Vous avez aimé cet article ? Partagez-le avec vos amis en cliquant sur les boutons ci-dessous : Les informations et analyses diffusées par ABC Bourse ne constituent qu'une aide à la décision pour les investisseurs. La responsabilité d'ABC Bourse ne peut être retenue directement ou indirectement suite à l'utilisation des informations et analyses par les lecteurs. Il est recommandé à toute personne non avertie de consulter un conseiller professionnel avant tout investissement. Ces informations indicatives ne constituent en aucune manière une incitation à vendre ou u", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article rapporte un chiffre d'affaires en hausse et une amélioration des marges, mais note également une valorisation exigeante et une configuration technique dégradée avec une correction du cours, ce qui conduit à des signaux positifs et négatifs qui s'annulent.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Nexans : (1) chiffre d'affaires en hausse au T3 2025, (2) réaffirmation des objectifs 2025 (marge d'EBITA ajustée 6-8%, cash-flow libre >600M€), (3) croissance portée par les segments câbles haute tension et électrification, (4) amélioration des marges et réduction de la cyclicité sous la direction de Christopher Guérin. Ces éléments constituent des bonnes nouvelles concrètes et spécifiques à l'entreprise, justifiant une note positive malgré les préoccupations techniques et de valorisation mentionnées en fin d'article."}, {"article_id": 56340, "company_id": 21, "entreprise": "CAPGEMINI", "source": "www.abcbourse.com", "published_at": "2026-08-21", "genre": "note d'analyste", "titre": "Capgemini : Jefferies relève sa cible de 95 à 110 euros mais pointe deux risques", "texte": "Actualité publiée le 21/08/26 09:47 Capgemini : Jefferies relève sa cible de 95 à 110 euros mais pointe deux risques Ajouter ABC Bourse à vos sources préférées (ABC Bourse) - La nouvelle cible de Jefferies se rapproche nettement des 110 euros pour l'action Capgemini. La banque salue l'accélération de l'activité, sans effacer ses réserves sur plusieurs indicateurs financiers attendus au second semestre. Après les résultats semestriels du groupe français de services informatiques, la banque d'investissement américaine relève son objectif de cours de 95 à 110 euros tout en maintenant sa recommandation à conserver. Derrière cette hausse de 15 euros, l'étude publiée ce 21 août 2026 livre un diagnostic contrasté. Le chiffre d'affaires a réservé une bonne surprise et la croissance organique a accéléré au deuxième trimestre. Jefferies garde pourtant un œil sur le besoin en fonds de roulement, les marges et le free cash-flow, trois éléments qui rendent la seconde partie de l'année bien plus exigeante. Capgemini atteint une croissance organique de 5,1 % au deuxième trimestre Le chiffre qui retient l'attention se trouve du côté de la croissance organique. Elle a accéléré à 5,1 % au deuxième trimestre, donnant davantage de visibilité à Capgemini sur son activité à l'approche de la seconde moitié de l'exercice. Les rythmes observés à la sortie du premier semestre conduisent Jefferies à considérer la prévision de chiffre d'affaires comme l'un des objectifs les plus accessibles à atteindre. La prévision de croissance organique des revenus pour l'exercice 2026 a d'ailleurs gagné environ un point de pourcentage, passant d'environ 2,75 % à 3,75 %. Ce rythme d'activité ne règle pas toutes les difficultés relevées dans l'étude. La marge brute a reculé et le besoin en fonds de roulement s'est détérioré. Sur ce dernier point, les analystes observent que les tendances liées à l'affacturage de créances s'améliorent souvent pendant le second semestre. Cette combinaison explique la position de Jefferies. La banque valorise davantage l'action Capgemini en portant sa cible à 110 euros, mais elle ne relève pas sa recommandation et reste à conserver. Jefferies attend un fort redressement des marges de Capgemini Le véritable test se déplace désormais vers les marges. Selon l'analyse de Jefferies, Capgemini devra réaliser au second semestre un redressement inhabituellement fort pour tenir ses objectifs. L'accélération des revenus ne suffit donc pas, à elle seule, à lever les réserves de la banque. Le free cash-flow constitue l'autre point de vigilance. Jefferies estime que les objectifs fixés dans ce domaine seront loin d'être aisés à atteindre. Après un premier semestre marqué par la détérioration du besoin en fonds de roulement, la génération de trésorerie devient un élément particulièrement surveillé pour la suite de l'exercice. Le passage d'un objectif de cours de 95 à 110 euros traduit donc une appréciation plus favorable de la valeur après les résultats semestriels, sans ", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "Jefferies relève son objectif de cours de 95 à 110 euros et salue l'accélération de l'activité et la croissance organique de 5,1% au T2, mais maintient sa recommandation à 'conserver' en raison de la marge brute qui a reculé, de la détérioration du besoin en fonds de roulement et des objectifs de marges et de free cash-flow jugés difficiles à atteindre au second semestre.", "note_haiku": 2, "justification_haiku": "Fait concret positif spécifique à Capgemini : Jefferies relève son objectif de cours de 95 à 110 euros (+15 euros), salue l'accélération de l'activité avec une croissance organique de 5,1% au T2 (dépassant les attentes), et révise à la hausse la prévision de croissance organique annuelle de 2,75% à 3,75%. Bien que la recommandation reste à 'conserver' (non relevée), l'article documente une amélioration significative de la valorisation et de la performance opérationnelle."}, {"article_id": 10477, "company_id": 18, "entreprise": "SAFRAN", "source": "www.easybourse.com", "published_at": "2025-12-08", "genre": "article dédié", "titre": "Panmure Liberum dégrade sa recommandation sur Safran", "texte": "Panmure Liberum dégrade sa recommandation sur Safran Publié le 08 Décembre 2025 (Zonebourse.com) - Panmure Liberum dégrade sa recommandation sur Safran de \"achat\" à \"conserver\" avec un objectif de cours à un an remonté de 205 à 230 euros (et celui à 3 ans de 260 à 285 euros) après une révision de ses prévisions pour le motoriste et équipementier aéronautique. \"Safran s'installe dans la période relativement calme post-reprise du milieu de cycle - il existe des courants croisés sous la surface, mais ils devraient offrir une croissance modérée, ralentissant à court terme pour un avenir prévisible\", estime le broker.Panmure Liberum prévient cependant que cette phase de navigation sans encombre ne peut durer qu'un certain temps, et qu'une récession d'une certaine gravité suivra inévitablement, mais qu'il ne peut pas prévoir quand elle se produira, ni sa gravité. En attendant, il a révisé ses prévisions pour le groupe français, avec une augmentation de l'EBIT attendu d'environ 5% jusqu'en 2028, et a prolongé sa projection jusqu'en 2032, pour comparaison avec le reste de sa couverture.Copyright (c) 2025 Zonebourse.com - All rights reserved.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'analyste dégrade sa recommandation sur Safran de \"achat\" à \"conserver\" (fait négatif), mais relève simultanément son objectif de cours et augmente ses prévisions d'EBIT (faits positifs). Ces signaux concrets contradictoires s'annulent.", "note_haiku": 0, "justification_haiku": "Panmure Liberum dégrade sa recommandation sur Safran de 'achat' à 'conserver'. C'est un fait concret négatif spécifique à Safran : une dégradation de conseil d'analyste constitue une mauvaise nouvelle. Bien que l'objectif de cours soit relevé, la dégradation du conseil (passage d'achat à conserver) est le signal négatif dominant et factuel."}, {"article_id": 423, "company_id": 3, "entreprise": "ALSTOM", "source": "www.tradingsat.com", "published_at": "2025-10-09", "genre": "article dédié", "titre": "ALSTOM : Pourquoi le futur patron d'Alstom peut être une bonne pioche et relancer une action en baisse de 50% depuis le rachat de Bombardier", "texte": "Alstom: Pourquoi le futur patron d'Alstom peut être une bonne pioche et relancer une action en baisse de 50% depuis le rachat de Bombardier jeudi 9 octobre 2025 à 15h41 (BFM Bourse) - L'équipementier ferroviaire a annoncé mercredi soir la nomination de Martin Sion, président exécutif d'Arianegroup. Un choix qui a le mérite de fluidifier le dialogue à l'état major, le dirigeant étant un ancien deSafrantout comme son directeur financier ainsi que le président du conseil d'administration. Son expérience chez le groupe spatial sera par ailleurs utile chez le groupe ferroviaire. Alstom a décidé de tourner la (longue) page Henri Poupart-Lafarge. L'équipementier ferroviaire a annoncé mercredi, après la clôture de la Bourse, la nomination au poste de directeur général de Martin Sion, actuel président exécutif d'Arianegroup, société spécialisée dans les lanceurs spatiaux. Cette nomination sera effective à compter d'avril 2026, date à laquelle Martin Sion prendra les rênes de la société. Et succèdera ainsi à Henri Poupart-Lafarge, en place depuis 2016. Ce dernier avait, en mars, décidé de ne pas solliciter son renouvellement auprès du conseil d'administration lorsqu'expirerait son mandat de directeur général, c'est-à-dire à l'été 2027. Alstom a donc décidé de ne pas attendre cette date pour mettre en place un successeur, actant la fin d'une ère contrastée, au mieux. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Un bilan de Poupart-Lafarge terni par la descente aux enfers de l'action Sur la période allant de 2016 à début 2021, Henri Poupart-Lafarge a mené avec un certain brio le pilotage d'un groupe devenu un pure-player du rail après la vente de ses activités énergétique en 2015 àGeneral Electric, même s'il a dû essuyer le veto de Bruxelles au projet de fusion avec l'allemandSiemensMobility qui aurait dû créer un champion européen du rail. La fin de son mandat restera entachée par une série de lourdes corrections boursières dues en partie au rachat de Bombardier Transport, ex-filiale ferroviaire du groupe canadien Bombardier, finalisé en janvier 2021. Cohérente sur le plan stratégique, cette opération répondait à une logique de taille nécessaire pour conquérir des marchés et peser face au mastodonte chinois CRRC. Mais le volet financier a tourné au cauchemar pourAlstom, qui est d'ailleurs en litige avec Bombardier au sujet de cette opération. Alstom avait alors hérité de plusieurs contrats litigieux avec des difficultés d'exécution. Ce qui a pesé sur sa rentabilité et l'avait notamment contraint à investir massivement pour remettre d'équerre les projets difficiles de la société québécoise. Au premier semestre de son exercice 2021-2022,Alstomavait ainsi brûlé 1,46 milliard d'euros de cash-flow libre. En octobre 2023,Alstomavait ensuite émis un avertissement sur résultats (surtout sur sa génération de trésorerie)qui avait provoqué un plongeon vertigineux de l'action de 37,6% sur une seule séance.La socié", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'annonce de la nomination du nouveau directeur général, Martin Sion, est qualifiée de \"bonne nouvelle\" par un intermédiaire financier, car l'ancien DG avait \"perdu son crédit auprès des investisseurs\". L'expert note également \"plusieurs points positifs dans son choix\" et la formation d'une \"dreamteam Safran\" au sein de la direction.", "note_haiku": 1, "justification_haiku": "L'article annonce la nomination de Martin Sion comme futur directeur général d'Alstom à partir d'avril 2026. Bien que le ton soit globalement positif (qualités du candidat, expérience pertinente, bonne articulation attendue avec le management), il n'existe AUCUN fait concret positif spécifique à l'activité d'Alstom (pas de contrat gagné, pas de hausse de résultats, pas de relèvement d'objectif, pas de note d'analyste améliorée). L'article mentionne des faits historiques négatifs (rachat de Bombardier, avertissement sur résultats en 2023, action en baisse de 50% depuis 2021) mais ceux-ci sont du contexte passé, non des nouvelles négatives du jour. La réaction de marché est neutre (0,4% de hausse). Il s'agit d'une annonce de gouvernance sans impact opérationnel ou financier concret identifiable."}, {"article_id": 20450, "company_id": 14, "entreprise": "STMICROELECTRONICS", "source": "www.abcbourse.com", "published_at": "2026-01-30", "genre": "article dédié", "titre": "Stmicroelectronics : Signaux de reprise prudents dans un marché des se...", "texte": "STMicroelectronics a rassuré les marchés en publiant des résultats trimestriels et des perspectives légèrement supérieurs aux anticipations des analystes, dans un contexte pourtant marqué par le ralentissement cyclique du secteur des semi-conducteurs. Sur les trois derniers mois de 2025, le groupe franco-italien a réalisé un chiffre d’affaires de 3,33 milliards de dollars, au-dessus du consensus fixé à 3,28 milliards. Cette performance s’explique principalement par une meilleure tenue de l’électronique personnelle et, dans une moindre mesure, des activités liées aux équipements de communication et au segment industriel. La dynamique reste toutefois contrastée. Si le chiffre d’affaires trimestriel progresse de 4,5% par rapport au trimestre précédent et se stabilise sur un an, la rentabilité continue de subir des pressions. La marge brute ressort à 35,2%, en baisse de 250 points de base sur un an, pénalisée par des capacités de production partiellement inutilisées. Le résultat net du trimestre bascule ainsi dans le rouge, avec une perte de 30 millions de dollars, intégrant des charges fiscales non récurrentes sans impact sur la trésorerie. Pour le premier trimestre 2026, STMicroelectronics anticipe un chiffre d’affaires de 3,04 milliards de dollars au point médian, un niveau supérieur au consensus et traduisant une saisonnalité moins marquée qu’à l’accoutumée. La marge brute attendue, autour de 33,7%, confirme néanmoins que la normalisation de la rentabilité sera progressive. Sur l’ensemble de l’exercice 2025, le chiffre d’affaires a reculé de 11,1% à 11,8 milliards de dollars et le résultat net s’est effondré de 88,5%, illustrant la violence de l’ajustement cyclique. En l’absence d’objectifs chiffrés pour 2026, le groupe met en avant ses priorités stratégiques : innovation, rationalisation de son outil industriel et discipline sur les coûts, tout en maintenant des investissements compris entre 2 et 2,2 milliards de dollars. L'annonce des résultats a été malgré tout fraîchement accueillie par les investisseurs avec un titre qui a lâché plus de 5% sur la journée. Techniquement on reste encore à l'intérieur du canal haussier tracé en vert sur le graphique ci-dessus avec des moyennes bien orientées mais attention tout de même c'est un premier coup de semonce dans un environnement nerveux. Pour ceux qui ne sont pas encore positionnés sur le dossier nous estimons qu'il vaut mieux attendre dans une telle situation. Par contre pour les actionnaires actuels nous recommandons de surveiller le bas du canal haussier qui sert de zone de support et qui pourrait nous alerter en cas de cassure à la baisse. Selon nous le titre intègre parfaitement son scénario d'une visibilité limitée ce qui n'appelle aujourd'hui que peu de potentiel de progression. Principaux défis de STMicroelectronics : la maîtrise durable des marges dans un environnement de demande encore incertain l’adaptation des capacités industrielles à la normalisation du cycle la relance de la croissance", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Le groupe a publié une perte nette trimestrielle de 30 millions de dollars et une chute de 88,5% de son résultat net sur l'ensemble de l'exercice 2025, malgré un chiffre d'affaires trimestriel et des perspectives légèrement supérieurs aux attentes. Le titre a également chuté de plus de 5%.", "note_haiku": 1, "justification_haiku": "L'article contient des faits concrets mixtes sur STMicroelectronics : des éléments positifs (chiffre d'affaires T4 2025 supérieur au consensus à 3,33Mds$ vs 3,28Mds attendus, guidance Q1 2026 supérieure au consensus) et des éléments négatifs (marge brute en baisse de 250 pb sur un an à 35,2%, perte nette de 30M$ au T4, chiffre d'affaires 2025 en recul de 11,1-11,8%, résultat net 2025 effondré de 88,5%, accueil négatif des investisseurs). Ces signaux positifs et négatifs s'annulent exactement : les résultats trimestriels rassurent mais la rentabilité se dégrade, les perspectives Q1 dépassent le consensus mais restent dans un contexte de normalisation progressive. Le titre a chuté de plus de 5% malgré les bonnes nouvelles, reflétant cette ambivalence. Aucun fait concret unilatéralement positif ou négatif ne domine."}, {"article_id": 50057, "company_id": 14, "entreprise": "STMICROELECTRONICS", "source": "www.abcbourse.com", "published_at": "2026-07-13", "genre": "article dédié", "titre": "Stmicroelectronics : Moins chère que les géants américains, mais prudence quand même", "texte": "Le secteur des semi-conducteurs traverse une phase paradoxale. Alors que l'intelligence artificielle continue d'alimenter un enthousiasme exceptionnel des investisseurs, les valorisations de nombreux acteurs américains atteignent désormais des niveaux exigeants. Dans ce contexte, STMicroelectronics occupe une position particulière. Le groupe franco-italien profite lui aussi de cette dynamique grâce à son exposition croissante aux centres de données et aux composants de puissance, mais il reste avant tout un acteur fortement dépendant des marchés automobile et industriel, dont la reprise demeure progressive. Les derniers résultats publiés confirment néanmoins une amélioration de la situation. Au premier trimestre 2026, STMicroelectronics a enregistré un chiffre d'affaires de 3,1 milliards de dollars, en progression de plus de 20 % sur un an, tandis que les prises de commandes se redressent et que les stocks de la distribution sont revenus à un niveau normalisé. La société a également relevé de manière spectaculaire son objectif de revenus liés aux centres de données pour 2026, désormais fixé à un milliard de dollars, soit le double de son objectif précédent. Cette activité, portée par les besoins en intelligence artificielle, constitue désormais un véritable relais de croissance. La question est désormais celle de la valorisation. Les géants américains des semi-conducteurs se négocient pour beaucoup sur des multiples historiquement élevés, intégrant des scénarios de croissance très ambitieux. STMicroelectronics apparaît plus raisonnablement valorisée grâce à une exposition plus diversifiée et à un cycle industriel encore en phase de reprise. En bémol on note que la rentabilité est inférieure aux niveaux historiques, les coûts de restructuration pèsent encore sur les marges et le groupe vient d'émettre 1,5 milliard de dollars d'obligations convertibles afin de refinancer une partie de sa dette. En termes de valorisation nous estimons que le groupe se paye sur des ratios confortables par rapport aux attentes annuelles. On voit d'ailleurs, dans le sillage du secteur d'activité, que les prises de bénéfices ont commencé et qu'après un point haut à 70,85€, le titre a lentement inversé la vapeur pour venir tester la zone de support des 58€. Les moyennes mobiles se sont d'ailleurs retournées à la baisse et on surveillera de très près ce support technique qui conditionne l'accélération du mouvement en direction des 50€, soit la prochaine zone de support significative. Pour l'heure nous restons à l'écart, estimant que le scénario d'une poursuite du mouvement de repli est le plus probable. © www.abcbourse.com", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'article mentionne une progression de 20% du chiffre d'affaires et un objectif de revenus doublé pour les centres de données, mais souligne une rentabilité inférieure aux niveaux historiques, des coûts de restructuration pesant sur les marges, et une émission d'obligations convertibles. L'analyste conclut en restant à l'écart et anticipe une poursuite du mouvement de repli du titre.", "note_haiku": 1, "justification_haiku": "L'article contient des faits concrets positifs spécifiques à STMicroelectronics (chiffre d'affaires +20% au T1 2026, relèvement spectaculaire de l'objectif data centers à 1 milliard de dollars, redressement des commandes, normalisation des stocks). Cependant, il contient également des faits concrets négatifs (rentabilité inférieure aux niveaux historiques, coûts de restructuration pesant sur les marges, émission de 1,5 milliard de dollars d'obligations convertibles pour refinancer la dette, inversion technique du titre après un point haut à 70,85€, test de la zone de support des 58€, moyennes mobiles retournées à la baisse). Ces signaux positifs et négatifs s'annulent exactement, justifiant une notation NEUTRAL."}, {"article_id": 8091, "company_id": 3, "entreprise": "ALSTOM", "source": "www.abcbourse.com", "published_at": "2025-11-26", "genre": "article dédié", "titre": "Alstom publie son premier rapport d'impact pour ses 70 ans au Brésil", "texte": "(Zonebourse.com) - Alstom annonce la parution de son premier \"Impact Report\" au Brésil, à l'occasion de ses 70 ans de présence dans le pays. Le document met en avant une contribution de 763 millions de dollars au PIB brésilien au cours de l'exercice 2024/2025, dont 600 millions issus de sa chaîne d'approvisionnement, ainsi que plus de 5800 emplois directs et indirects soutenus. Présente dans 81% du transport ferroviaire de passagers, l'entreprise indique s'appuyer sur 606 fournisseurs locaux, représentant 78% de ses achats pour un total de 144 MEUR injectés dans l'économie. \"Notre technologie transporte plus de 6 millions de passagers par jour au Brésil\", rapporte Suely Sola, directrice générale d'Alstom Brésil. Son site de Taubaté, centre d'excellence pour les voitures en acier inoxydable, a reçu 130 millions de dollars d'investissements sur quatre ans et produit des trains pour le marché brésilien et international. L'entreprise poursuit par ailleurs une feuille de route active en matière de mobilité durable, avec un suivi renforcé de ses indicateurs environnementaux et une participation aux discussions internationales sur les transports bas carbone. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article détaille le premier \"Impact Report\" d'Alstom au Brésil, mettant en avant une contribution de 763 millions de dollars au PIB brésilien, 5800 emplois soutenus, 144 millions d'euros injectés dans l'économie locale via des fournisseurs, et 130 millions de dollars d'investissements sur quatre ans pour son site de Taubaté. Ce sont des faits concrets et positifs sur l'activité et l'impact économique d'Alstom.", "note_haiku": 1, "justification_haiku": "L'article mentionne ALSTOM et rapporte des informations sur ses activités au Brésil (contribution au PIB, emplois, fournisseurs locaux, investissements, présence dans le transport ferroviaire). Cependant, ces éléments sont de nature informationnelle et contextuelle, sans constituer un fait concret positif ou négatif spécifique : pas de résultat financier, pas de contrat gagné, pas de dégradation, pas de note d'analyste. Il s'agit d'une communication corporate standard célébrant 70 ans de présence. Aucune variation de cours n'est mentionnée. Le sentiment global est neutre-positif en ton, mais sans fait concret suffisant pour justifier une note POSITIVE (2)."}, {"article_id": 2410, "company_id": 10, "entreprise": "NEXANS", "source": "www.easybourse.com", "published_at": "2025-10-14", "genre": "article dédié", "titre": "Nexans: UBS reste à l'achat après le changement de DG", "texte": "Nexans: UBS reste à l'achat après le changement de DG Publié le 14 Octobre 2025 (Zonebourse.com) - UBS reste à l'achat sur le titre avec un objectif de 155 E après l'annonce du changement de DG. 'Le changement de DG semble sans conséquence, car Nexans maintient ses objectifs pour 2028 et se concentre sur son objectif de devenir un acteur exclusivement dédié à l'électrification' souligne UBS. Nexans a décidé de nommer Julien Hueber au poste de Directeur Général et de se séparer de Christopher Guérin. Ces décisions sont à effet immédiat. Julien Hueber est le Directeur Général exécutif de PWR Grid & Connect Europe, une activité pesant 2.6 milliards d'euros et comptant 23 sites industriels.Copyright (c) 2025 Zonebourse. com - All rights reserved.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne un changement de DG et le maintien des objectifs 2028 par Nexans, ainsi qu'une recommandation d'achat maintenue par UBS. Aucun fait concret positif (hausse de résultat, contrat gagné, relèvement d'objectif, note d'analyste améliorée) ou négatif (baisse, perte, amende, dégradation) n'est identifiable selon les règles strictes.", "note_haiku": 2, "justification_haiku": "Fait concret positif spécifique à NEXANS : UBS maintient sa recommandation 'achat' avec un objectif de 155€. L'analyste souligne que le changement de DG est sans conséquence négative et que NEXANS maintient ses objectifs 2028 ambitieux (devenir acteur exclusivement dédié à l'électrification). C'est une validation positive de la stratégie et de la continuité."}, {"article_id": 28531, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-03-16", "genre": "article dédié", "titre": "AIRBUS GROUP : En baisse de près de 15% depuis le début de l&#039;année, Airbus a-t-il trop souffert en Bourse au vu de ses perspectives (prometteuses) de long terme?", "texte": "Airbus group: En baisse de près de 15% depuis le début de l'année, Airbus a-t-il trop souffert en Bourse au vu de ses perspectives (prometteuses) de long terme? lundi 16 mars 2026 à 111154 (BFM Bourse) - Plusieurs analystes ont refait leurs calculs sur le groupe aéronautique ces derniers jours. Citi estime qu'une opportunité se dessine sur le titre en raison de la valorisation peu exigeante, tandis que Barclays bat en brèche certaines craintes. De son côté, Jefferies estime qu'il est trop tôt pour se positionner sur le titre. Airbus signe un début d'année décevant. L'avionneur abandonne 15,3% depuis le 1er janvier, sous-performant largement leCAC 40, qui recule de 3,3% sur la même période. Comme l'ensemble des entreprises cycliques,Airbusa pâti en Bourse d'un climat général d'aversion au risque dû à l'éclatement du conflit en Iran. La société avait, auparavant, déjà mal débuté l'année. Sur les deux premiers mois de 2025,Airbusn'a livré que 54 avions, en baisse de 17% sur un an. \"Nous continuons de penser que le rythme des livraisons jusqu'à présent en 2026 est inférieur aux attentes
