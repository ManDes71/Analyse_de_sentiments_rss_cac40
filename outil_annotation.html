naux positifs et négatifs s'annule : pas de bonne nouvelle claire, pas de mauvaise nouvelle isolée. Sentiment global prudent mais sans rupture majeure."}, {"article_id": 48949, "company_id": 3, "entreprise": "ALSTOM", "source": "www.abcbourse.com", "published_at": "2026-07-07", "genre": "article dédié", "titre": "Alstom : Le redressement opérationnel demande encore une confirmation en Bourse", "texte": "Après une période marquée par les difficultés d'intégration de Bombardier Transport et les tensions sur sa génération de trésorerie, Alstom semble progressivement retrouver une trajectoire plus favorable. Le groupe ferroviaire bénéficie d'un marché structurellement porteur, soutenu par les investissements dans la mobilité durable et le renouvellement des réseaux, mais il doit encore convaincre sur sa capacité à transformer un carnet de commandes exceptionnel en amélioration durable de sa rentabilité. L'exercice 2025/2026 s'est traduit par une activité commerciale record, avec un carnet de commandes désormais supérieur à 100 milliards d'euros, offrant plusieurs années de visibilité. Le groupe a dégagé un chiffre d'affaires en progression et un résultat opérationnel ajusté proche de 6 %, tandis que le flux de trésorerie disponible est resté positif conformément aux objectifs annoncés. En revanche, Alstom a revu à la baisse certaines de ses ambitions à moyen terme : l'objectif d'une marge opérationnelle comprise entre 8 % et 10 % dès 2026/2027 a été abandonné, tout comme la cible de 1,5 milliard d'euros de flux de trésorerie cumulés sur trois ans. Pour le nouvel exercice, la société vise désormais une croissance organique d'environ 5 %, une marge ajustée proche de 6,5 % et un ratio de prises de commandes supérieur à 1. Au-delà des chiffres, les investisseurs restent attentifs à l'amélioration de l'exécution industrielle. Plusieurs grands contrats historiques continuent de peser sur les marges, même si la direction a présenté un plan d'action destiné à améliorer la qualité d'exécution et la génération de trésorerie. Le changement de gouvernance, avec l'arrivée récente de Martin Sion à la direction générale, marque également l'ouverture d'une nouvelle phase pour le groupe. Les prochains chiffres trimestriels, attendus le 22 juillet, seront particulièrement scrutés afin de vérifier que cette dynamique de redressement se confirme. Depuis son gros plongeon du mois d'avril le titre s'est trouvé en support technique autour de 14,70€. C'est un niveau sur lequel Il s'est appuyé pour se lancer dans une petite reprise qui est encore bien timide. Le signal acheteur n'est pas encore là puisque les principales moyennes mobiles, même si elles ont été franchies à la hausse, restent encore baissières. Il faudra attendre une confirmation supplémentaire et probablement un débordement de la zone des 18€ à la hausse pour vraiment avoir un retournement de tendance moyen terme sur lequel nous pourrions nous appuyer. En attendant le titre reste dans une zone d'indécision. © www.abcbourse.com", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'abandon des objectifs de marge opérationnelle et de flux de trésorerie à moyen terme, ainsi que le fait que des contrats historiques continuent de peser sur les marges, constituent des faits concrets négatifs pour Alstom.", "note_haiku": 1, "justification_haiku": "L'article contient des faits concrets sur ALSTOM : carnet de commandes record (>100 Md€), chiffre d'affaires en progression, résultat opérationnel ajusté proche de 6%, flux de trésorerie disponible positif. CEPENDANT, il contient aussi des faits concrets négatifs : révision à la baisse des ambitions à moyen terme (abandon de l'objectif 8-10% de marge en 2026/2027, abandon de la cible 1,5 Md€ de flux cumulés), contrats historiques qui pèsent encore sur les marges, exécution industrielle insuffisante. Les signaux positifs (activité record, visibilité) et négatifs (révisions à la baisse, problèmes d'exécution) s'annulent exactement, justifiant une notation NEUTRAL."}, {"article_id": 9058, "company_id": 7, "entreprise": "CARREFOUR", "source": "www.abcbourse.com", "published_at": "2025-12-01", "genre": "article dédié", "titre": "Carrefour finalise la cession de ses activités en Italie", "texte": "(AOF) - Carrefour a dévoilé la finalisation de la cession de l’intégralité de ses activités en Italie au groupe NewPrinces, après avoir obtenu toutes les autorisations réglementaires requises. Les activités de Carrefour Italie sont déconsolidées à partir du 30 novembre 2025. Fin juillet, le géant de la grande distribution avait annoncé être en négociations avec NewPrinces pour la cession de ses activités de l’autre côté des Alpes. Ces dernières comprennent 1 188 magasins répartis sur le territoire, et ont généré un chiffre d'affaires de 4,2 milliards d'euros en 2024. © 2025 Agence Option Finance (AOF) - Tous droits de reproduction réservés par AOF. AOF collecte ses données auprès des sources qu'elle considère les plus sûres. Toutefois, le lecteur reste seul responsable de leur interprétation et de l'utilisation des informations mises à sa disposition. Ainsi le lecteur devra tenir AOF et ses contributeurs indemnes de toute réclamation résultant de cette utilisation. Agence Option Finance (AOF) est une marque du groupe Option Finance Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article rapporte la finalisation de la cession des activités de Carrefour en Italie, un fait concret mais sans indication explicite de son impact financier positif ou négatif selon les critères définis.", "note_haiku": 2, "justification_haiku": "Carrefour a finalisé la cession de l'intégralité de ses activités en Italie au groupe NewPrinces après obtention de toutes les autorisations réglementaires. Il s'agit d'un fait concret et spécifique positif : finalisation d'une opération stratégique majeure (1 188 magasins, 4,2 Md€ de CA en 2024) qui était en négociations depuis juillet. La déconsolidation à partir du 30 novembre 2025 marque l'aboutissement d'une transaction importante."}, {"article_id": 40989, "company_id": 12, "entreprise": "SCHNEIDER ELECTRIC", "source": "www.tradingsat.com", "published_at": "2026-05-25", "genre": "analyse technique", "titre": "SCHNEIDER ELECTRIC  : Résilience et solidité", "texte": "SCHNEIDER ELECTRIC: Résilience et solidité lundi 25 mai 2026 à 09h00 (BFM Bourse) - Sur la base d’une argumentation graphique, les analystes de BFM Bourse ont sélectionnéSCHNEIDER ELECTRICpour les investisseurs actifs. L'action de ce poids lourd duCAC40, très résiliente, est en phase ascendante de fond au sein d'un canal haussier large dont la borne basse est formée par la moyenne mobile à 200 jours (en marron). Le gap haussier très ample, formé le 08 avril a marqué un emballement très vif du camp acheteur juste après une bougie en marteau inversé et un passage très proche de la ligne de survente de l'indice de force relative. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionSCHNEIDER ELECTRICà court terme. Les investisseurs actifs prendront position à l'achat sur le titreSCHNEIDER ELECTRICau cours de 278.000 € avec un objectif à 320.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 259.000 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article contient une recommandation d'achat et un objectif de cours haussier de la part des analystes de BFM Bourse pour SCHNEIDER ELECTRIC.", "note_haiku": 1, "justification_haiku": "L'article mentionne SCHNEIDER ELECTRIC et exprime un avis haussier basé sur l'analyse graphique et technique. Cependant, aucun fait concret spécifique à l'activité de l'entreprise n'est présenté (pas de résultats, contrat, chiffre d'affaires, amende, etc.). L'analyse repose uniquement sur des éléments techniques (moyennes mobiles, gaps, indices de force relative) et des recommandations de trading, sans information factuelle sur la performance ou les opérations de SCHNEIDER ELECTRIC. Absence de variation de cours mentionnée dans l'article."}, {"article_id": 14532, "company_id": 30, "entreprise": "AUBAY", "source": "www.abcbourse.com", "published_at": "2025-12-30", "genre": "franchissement de seuil", "titre": "Amiral Gestion dépasse les 5% des droits de vote d'Aubay", "texte": "(Zonebourse.com) - Amiral Gestion, agissant pour le compte de fonds dont elle assure la gestion, a déclaré à l'AMF avoir franchi en hausse, le 17 décembre, le seuil de 5% des droits de vote d'Aubay, au résultat d'une acquisition d'actions sur le marché. La société de gestion a précisé détenir, à cette date et à ce jour, pour le compte desdits fonds, 963 049 actions Aubay, soit 7,50% du capital et 5,01% des droits de vote de cette société de services informatiques. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Amiral Gestion a franchi en hausse le seuil de 5% des droits de vote d'Aubay suite à une acquisition d'actions, ce qui est un fait concret positif indiquant un intérêt accru d'un investisseur majeur.", "note_haiku": 1, "justification_haiku": "L'article mentionne uniquement une déclaration de franchissement de seuil de participation par Amiral Gestion (acquisition d'actions, passage à 5,01% des droits de vote). Il s'agit d'une information factuelle sur la structure actionnariale d'Aubay, sans aucun élément concret positif ou négatif concernant l'activité, les résultats ou la performance de l'entreprise. Aucune variation de cours n'est mentionnée. C'est une information neutre de gouvernance."}, {"article_id": 11078, "company_id": 21, "entreprise": "CAPGEMINI", "source": "www.tradingsat.com", "published_at": "2025-12-11", "genre": "article dédié", "titre": "CAPGEMINI : Alors que son action rebondit de 27% en deux mois, la reprise de Capgemini prend pied, juge Citi", "texte": "Capgemini: Alors que son action rebondit de 27% en deux mois, la reprise de Capgemini prend pied, juge Citi jeudi 11 décembre 2025 à 17h42 (BFM Bourse) - La banque américaine voit la confiance des investisseurs sur une amélioration de la croissance de la société gagner en vigueur à l'approche de 2026. Capgemini au tableau d'honneur en Bourse. L'entreprise de services numériques a pris 4%, jeudi 11 décembre, signant la deuxième plus forte hausse duCAC 40. Au-delà de cette seule séance, le titre a regagné 27% en deux mois (151,85 euros contre 119,7 euros le 10 octobre). Dans une note consacrée aux perspectives de la tech européenne et publiée jeudi, la banque Citi se montre constructive pour le compartiment. Le secteur des groupes informatiques et de logiciels \"est bien positionné pour assurer sa croissance, et sa valorisation est attrayante\", explique l'établissement. ConcernantCapgemini, Citi estime que l'entreprise n'est pas totalement sorti de l'ornière. Mais \"la reprise progressive est en cours\", et \"prend pied\", ajoute le bureau d'études. \"Une stabilité macroéconomique pourrait favoriser le retour des dépenses discrétionnaires\" comme les dépenses informatiques des entreprises, poursuit-il. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading \"L'actionCapgeminis'est retrouvée sous pression en 2025 (le titre perd 3,8% cette année, sous-performant nettement leCAC 40, NDLR)\", rappelle Citi. Ce, \"en raison du sentiment négatif qui règne envers le secteur (des services informatiques) et de la prudence croissante du marché à l'égard du groupe, dont le chiffre d'affaires provient en grande partie de marchés finaux plus difficiles\", ajoute la banque. \"Alors que le groupe sort d'une longue période de ralentissement de sa croissance, nous voyons les investisseurs reprendre confiance dans un retour durable à la croissance organique (en données comparables, NDLR) en 2026\", développe encore Citi. Au-delà de Citi, un intermédiaire financier juge que l'actionCapgeminipeut bénéficier de positionnement d'investisseurs sur une reprise de la tech européenne. \"Cela fait deux années que le secteur souffre et cela fait deux années que la valorisation est à la cave\", explique-t-il. PourCapgemini, \"une importante partie de l'activité est réalisée en Amérique du Nord qui est repartie au troisième trimestre. On peut avoir une embellie en 2026 et on a atteint un plancher en termes de croissance. Des brokers (des bureaux d'études, NDLR) en recherche d'idées pour 2026 peuvent vendre cette thèse\", développe l'intermédiaire financier. Capgemini avait livré une croissance nettement supérieure aux attentes au troisième trimestre. Le directeur général, Aiman Ezzat,avait toutefois expliquéque la société n'attendait pas au quatrième trimestre d'amélioration sensible de la croissance par rapport au troisième en raison d'un contexte global encore difficile. \"Nous avons gagné des parts de marché, nous avons fait face à certains de nos", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne des faits concrets positifs comme une croissance nettement supérieure aux attentes au troisième trimestre, un retour à la croissance organique et un léger relèvement de la croissance organique 2025. Cependant, il rapporte aussi des faits concrets négatifs tels que l'absence d'amélioration sensible de la croissance attendue au quatrième trimestre et des pressions agressives sur les prix. Ces éléments positifs et négatifs s'annulent.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Capgemini : (1) rebond de 27% en deux mois, (2) hausse de 4% le jour de publication, (3) Citi juge que 'la reprise progressive est en cours' et 'prend pied', (4) croissance 'nettement supérieure aux attentes au troisième trimestre', (5) retour de la croissance organique après sept trimestres de contractions, (6) léger relèvement de la croissance organique 2025, (7) gains de parts de marché. Ces éléments constituent des signaux positifs concrets justifiant une note positive."}, {"article_id": 22369, "company_id": 27, "entreprise": "EssilorLuxottica", "source": "www.abcbourse.com", "published_at": "2026-02-11", "genre": "article dédié", "titre": "EssilorLuxottica dévoile une marge opérationnelle 2025 en repli et une accélération d...", "texte": "(Agefi-Dow Jones)--Le fabricant de verres et de lunettes EssilorLuxottica a publié mercredi soir des résultats 2025 marqués par une pression sur ses marges et une accélération de sa croissance au quatrième trimestre. Le bénéfice net, part du groupe, d'EssilorLuxottica s'est établi à 2,315 milliards d'euros en 2025, en repli de 1,9% à taux de change courants. Le résultat opérationnel ajusté, qui exclut certains éléments exceptionnels, s'est élevé à 4,46 milliards d'euros, en progression de 1% à taux de change courants et en hausse de 6,8% à taux de change constants. \"La performance du groupe a été impactée par la combinaison des effets négatifs des droits de douane américains et des lunettes avec IA, de manière plus significative au second semestre qu'au premier, conduisant à une marge opérationnelle ajustée annuelle de 16%, soit 70 points de base en dessous de celle de 2024 à taux de change constants\", a commenté EssilorLuxottica dans un communiqué. + Accélération de la croissance au quatrième trimestre + Le chiffre d'affaires d'EssilorLuxottica a atteint 28,49 milliards d'euros en 2025, en hausse de 7,5% en données publiées et de 11,2% à taux de change constants. Au cours des trois mois à fin décembre, le groupe a réalisé des ventes de 7,6 milliards d'euros, en progression de 18,4% à taux de change constants, marquant une nette accélération par rapport au troisième trimestre où elles avaient augmenté de 11,7%. Une croissance de 10,7% à taux de change constants était attendue au quatrième trimestre, selon le consensus FactSet. \"Les lunettes avec IA se sont vendues à plus de 7 millions d'unités au cours de l'exercice, portées par une contribution de toutes les régions et marques\", a souligné EssilorLuxottica dans son communiqué. Le groupe a par ailleurs dégagé un cash-flow libre record, de 2,8 milliards d'euros sur l'exercice, soit 400 millions d'euros de plus qu'en 2024. Selon un consensus établi par Factset, les analystes anticipaient en moyenne un chiffre d'affaires de 28,05 milliards d'euros, un résultat opérationnel ajusté de 4,46 milliards d'euros et un bénéfice net de 2,39 milliards d'euros. + Nouvelles prévisions à long terme + EssilorLuxottica a dévoilé de nouvelles perspectives à long terme. \"Ancrées dans notre transformation medtech, ces nouvelles perspectives à long terme reflètent l'expansion de notre plateforme santé fondée sur l'IA. Elles traduisent une nouvelle étape dans notre trajectoire vers une position de leader mondial de la santé visuelle avancée et intégrée, avec l'ambition d'améliorer la performance humaine\", explique la société. Le groupe prévoit de réaliser, au cours des cinq prochaines années et à taux de change constants, une \"croissance soutenue de son chiffre d'affaires total et une croissance globalement alignée de son résultat opérationnel ajusté,\" précise-t-il. EssilorLuxottica proposera lors de la prochaine assemblée générale le versement d'un dividende de 4 euros par action, en légère hausse par rapport à l'anné", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Accélération de la croissance du chiffre d'affaires au quatrième trimestre, chiffre d'affaires annuel en hausse, cash-flow libre record et dividende en légère hausse, malgré un bénéfice net en léger repli et une pression sur les marges.", "note_haiku": 1, "justification_haiku": "L'article présente un mélange de résultats 2025 : des points positifs (accélération de croissance au Q4 à +18,4%, chiffre d'affaires en hausse de 11,2% à taux de change constants, cash-flow libre record de 2,8 Mds€, ventes de lunettes IA à 7M d'unités, dividende en hausse) et des points négatifs (bénéfice net en repli de 1,9%, marge opérationnelle en baisse de 70 pb). Ces signaux positifs et négatifs s'annulent exactement, sans dominante claire. Aucune variation de cours n'est mentionnée dans l'article. Les perspectives à long terme sont énoncées sans chiffres concrets permettant une évaluation positive ou négative définitive."}, {"article_id": 60964, "company_id": 12, "entreprise": "SCHNEIDER ELECTRIC", "source": "www.bfmtv.com", "published_at": "2026-09-09", "genre": "article dédié", "titre": "Fermeture d'une usine dans la Vienne, regroupement d'activités dans l'Eure... Le géant français Schneider Electric va réorganiser plusieurs de ses sites industriels en France", "texte": "La fermeture du site de Chasseneuil-du-Poitou, qui emploie 145 personnes dans la Vienne, est programmée en mars 2028 et se traduira par un plan de sauvegarde de l'emploi (PSE). Schneider Electric va réorganiser des sites industriels en France pour \"renforcer sa compétitivité\", prévoyant la fermeture d'une usine dans la Vienne et le regroupement d'autres dans l'Eure, où est prévu un investissement de 150 millions d'euros, selon la direction mercredi. Un comité social et économique (CSE) extraordinaire s'est tenu mercredi pour présenter ce plan aux représentants des salariés du géant français des équipements électriques . La fermeture du site de Chasseneuil-du-Poitou, qui emploie 145 personnes dans la Vienne, est programmée en mars 2028 et se traduira par un plan de sauvegarde de l'emploi (PSE). Il sera proposé aux personnes concernées d'intégrer d'autres sites du groupe partout en France, avec au minimum deux propositions de reclassement par salarié, au besoin avec requalification professionnelle, précise Schneider Electric. Le groupe va aussi accompagner les salariés seniors volontaires vers une \"transition adaptée\", ainsi que des projets professionnels hors du groupe pour ceux qui le souhaitent, a-t-il ajouté. \"Des marchés qui ont des tendances contradictoires\" En Normandie, Schneider Electric prévoit de rassembler en un seul site situé à Évreux les activités de production et de recherche et développement (R&D) des sites voisins de Beaumont-le-Roger, où travaillent 287 personnes, Le Vaudreuil (294 employés), et Pacy-sur-Eure (166 employés). Le groupe veut investir plus de 150 millions d'euros dans la préfecture de l'Eure pour y installer un bâtiment de 40.000 m2. L'objectif est de \"rassembler les expertises dans un même lieu pour obtenir une synergie afin d'améliorer la performance globale industrielle\", a déclaré Laurent Batal, directeur stratégie industrielle chargé du projet. Schneider Electric va également renforcer son site de Dijon, où travaillent 330 personnes. Il s'agit d'un \"projet industriel majeur\" pour l'entreprise, visant à \"asseoir de manière durable son empreinte sur le territoire\" et \"renforcer sa compétitivité industrielle\" en France, a ajouté Laurent Batal. Selon lui, le groupe \"fait face à des marchés qui ont des tendances contradictoires\". Ceux autour de l'électrification et de la numérisation, des centres de données et du nucléaire aux réseaux électriques, \"ont de bonnes tendances sur lesquelles on a besoin d'investir et de travailler sur nos capacités\". Les marchés plus matures (logement, résidentiel) ont \"des volumes stables et des perspectives relatives\" et \"sont soumis à une forte pression sur le prix\". Schneider Electric emploie 15.000 personnes en France, dont 6.400 travaillent dans des métiers autour du monde industriel, des usines et fonction support. Sujets liés : Industries", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article décrit un plan de réorganisation industrielle de Schneider Electric. Il mentionne la fermeture d'un site avec un plan de sauvegarde de l'emploi (PSE), ce qui est un fait concret négatif. Cependant, il fait également état d'un investissement de 150 millions d'euros dans d'autres sites et du renforcement d'un troisième, avec pour objectif de \"renforcer sa compétitivité\". Ces faits concrets positifs et négatifs s'équilibrent dans le cadre d'une stratégie globale.", "note_haiku": 0, "justification_haiku": "L'article contient plusieurs faits concrets négatifs spécifiques à Schneider Electric : fermeture d'une usine en Vienne (145 personnes) programmée en mars 2028 avec plan de sauvegarde de l'emploi (PSE), fermeture du site de Beaumont-le-Roger (287 personnes) et Le Vaudreuil (294 employés) avec regroupement à Évreux. Ces restructurations représentent des suppressions d'emplois et des perturbations opérationnelles majeures, constituant une mauvaise nouvelle pour l'entreprise malgré le contexte de réorganisation stratégique."}, {"article_id": 51266, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-07-19", "genre": "article dédié", "titre": "AIRBUS GROUP : Au salon aéronautique de Farnborough, Airbus prend un rendez-vous avec la Bourse à très grands enjeux", "texte": "Airbus group: Au salon aéronautique de Farnborough, Airbus prend un rendez-vous avec la Bourse à très grands enjeux dimanche 19 juillet 2026 à 07h00 (BFM Bourse) - Le salon aéronautique du Royaume-Uni, qui alterne une année sur deux avec celui du Bourget, se déroulera de lundi 20 à vendredi 24 juillet.Airbustiendra mardi un \"business update\" où il pourrait annoncer des objectifs de moyen terme pour sa division d'aéronautique civile. Le salon aéronautique de Farnborough n'a pas forcément le même prestige que celui du Bourget, avec lequel il alterne une année sur deux, ou même celui de Dubaï, qui aura lieu en novembre prochain. \"Farnborough a tendance à susciter moins d'intérêt chez les investisseurs (l'accès aux entreprises y est plus limité que lors du Salon aéronautique de Paris)\", résume d'ailleurs Royal Bank of Canada. Les opérateurs de marché auraient toutefois tort de sous-estimer cette édition 2026, qui se déroulera de lundi 20 à vendredi 24 juillet. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Certes, ces salons sont surtout l'occasion d'annoncer ou d'officialiser des commandes pour les groupes aéronautiques commeAirbuset Boeing, ce qui porte assez rarement leurs cours de Bourse. Selon Jefferies, 28% des commandes d'avions depuis 2010 ont été annoncées durant le salon de Farnborough, avec une moyenne par édition de 577 appareils. La banque table d'ailleurs sur des annonces pour cette édition 2026 représentant environ 500 avions. Mais dans la mesure où les carnets d'ordre d'Airbuset Boeing sont bien remplis, le marché se focalise davantage sur la bonne montée en cadence de leurs productions, synonyme de livraisons plus importantes et donc de rentrée de cash plus élevées, les avionneurs étant essentiellement payés quand ils livrent en bonne et due forme les appareils à leurs clients. Néanmoins, \"ce salon devrait être l'occasion de rencontrer divers fournisseurs afin de prendre le pouls du marché de l'aéronautique et de la défense\", explique Royal Bank of Canada. Par ailleurs, la défense devrait occuper une place importante durant cette édition, comme cela avait été le cas pour le Bourget l'an passé. Dans la mesureoù les groupes de défense vacillent actuellement en Bourse,les commentaires des différents dirigeants sur l'activité de leur société. \"Le sentiment sur le secteur de la défense reste baissier. Toutefois, lors du salon aéronautique, nous nous attendons à des commentaires positifs concernant les perspectives de commandes pour le deuxième trimestre 2026, et les fondamentaux à court terme restent favorables\", explique Royal Bank of Canada. Surtout, ce salon constituera un évènement clef pourAirbus, de l'avis de plusieurs analystes. Le groupe européen d'aéronautique et de défense tiendra mardi, en marge de Farnborough, un \"business update\", autrement dit un point sur son activité. L'an passé, lors du Salon du Bourget, l'ex-EADS avait fait de même.Airbusavait alors détaillé division ", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article mentionne que les carnets d'ordre d'Airbus sont bien remplis, que Bank of America a placé Airbus dans sa liste des meilleures idées d'investissement pour le troisième trimestre, et que les divisions \"défense et espace\" et \"Airbus Helicopters\" ont eu de \"solides performances l'an passé\".", "note_haiku": 1, "justification_haiku": "L'article mentionne Airbus de manière extensive mais se concentre sur des ANTICIPATIONS et des ATTENTES d'analystes concernant un futur 'business update' prévu mardi 21 juillet. Aucun fait concret positif ou négatif spécifique à Airbus n'est rapporté : pas de résultats annoncés, pas de contrat gagné, pas d'amende, pas de dégradation. Les analystes expriment des espoirs (Bank of America place Airbus dans ses meilleures idées, Barclays qualifie l'événement de 'catalyseur'), mais ce sont des opinions prospectives, non des faits concrets. L'article rapporte également des craintes (risque de déception si les objectifs sont trop bas), mais là aussi sans fait concret négatif avéré. En l'absence de tout fait concret positif OU négatif confirmé, le sentiment est NEUTRAL."}, {"article_id": 13589, "company_id": 19, "entreprise": "SANOFI", "source": "www.tradingsat.com", "published_at": "2025-12-24", "genre": "article dédié", "titre": "SANOFI : Acquisition à 2,2 milliards de dollars, lourd revers pour son traitement contre la sclérose en plaques… Sanofi connaît une veille de Noël très chargée", "texte": "Sanofi: Acquisition à 2,2 milliards de dollars, lourd revers pour son traitement contre la sclérose en plaques… Sanofi connaît une veille de Noël très chargée mercredi 24 décembre 2025 à 10h50 (BFM Bourse) - Le groupe pharmaceutique a annoncé ce mardi 24 décembre l'acquisition de cette société qui commercialise un vaccin contre l'hépatite B ainsi qu'un candidat vaccin contre le zona. Le groupe a également fait part d'une lettre de réponse complète, c'est-à-dire un refus, de l'autorité sanitaire américaine pour tolebrutinib dans le traitement d'une forme de sclérose en plaques. La veille de Noël, habituellement, les groupes duCAC 40n'ont guère d'annonces à partager aux marchés et la séance s'avère assez calme. C'était sans compter surSanofi, qui a livré deux communications très importantes ce mercredi 24 décembre. La société pharmaceutique a d'abord fait part d'une importante acquisition à savoir le rachat de Dynavax Technologies Corporation, pour un montant de 2,2 milliards de dollars (en valeur des fonds propres). Le prix par action s'établit à 15,5 dollars ce qui traduit une prime de 42% par rapport au cours de clôture de Dynavax de mardi (10,91 dollars). >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Cotée à Wall Street et fondée en 1996 en Californie, Dynavax commercialise un vaccin contre l'hépatite B, une maladie virale du foie qui peut entraîner une cirrhose et un cancer. La société développe par ailleurs un candidat-vaccin contre le zona, une maladie due à la réactivation du virus de la varicelle qui provoque une éruption cutanée douloureuse et prurigineuse. Dans certains, cas, le zona peut entraîner une douleur nerveuse à long terme, des infections oculaires graves qui peuvent endommager la vision et, rarement, une inflammation dangereuse du cerveau. Ce vaccin est actuellement en phase d'essai cliniques I/II (phases intermédiaires avant la phase III, qui elle précède la potentielle commercialisation). Sanofi estime qu'aux États-Unis, environ 100 millions d'adultes ne sont pas vaccinés contre l'hépatite B et le zona. Dynavax a généré l'an passé 268 millions de dollars de revenus en croissance de 26% sur un an. L'acquisition, dont la finalisation est prévue au premier trimestre 2026, doit permettre àSanofide se renforcer dans la vaccination pour adulte. Sur les neuf premiers mois de 2025, les vaccins ont représenté 5,9 milliards d'euros de revenus pour la société, soit environ 18% du total. \"Dynavax renforce la présence deSanofidans le domaine de la vaccination des adultes en apportant des vaccins différenciés qui complètent l'expertise deSanofi\", a déclaré Thomas Triomphe, vice-président exécutif vaccins deSanofi, cité dans un communiqué. \"Son vaccin commercialisé contre l'hépatite B pour adultes et son candidat vaccin contre le zona ajoutent de nouvelles options à notre portefeuille et soulignent notre engagement à fournir une protection vaccinale tout au long de la vie\", a-t-il ajout", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente à la fois une acquisition significative (2,2 milliards de dollars) et un revers majeur avec le refus de la FDA pour un candidat-médicament clé (tolebrutinib), ainsi que l'abandon d'un autre développement pour ce même médicament. Ces faits concrets positifs et négatifs se contrebalancent. L'analyste Jefferies, tout en notant un 'impact négatif sur le sentiment' dû au revers, maintient sa recommandation à l'achat en soulignant le potentiel d'un autre médicament (amlitelimab). Le cours de l'action n'a que très peu bougé (-0,2%), ce qui indique un sentiment globalement neutre face à ces annonces contradictoires.", "note_haiku": 0, "justification_haiku": "Deux faits concrets négatifs spécifiques à Sanofi : (1) Refus de la FDA pour tolebrutinib dans le traitement de la SEPSPnr, décrit comme 'un lourd revers' et 'un changement de cap significatif' ; (2) Abandon antérieur du développement de tolebrutinib pour la sclérose en plaques primaire-progressive suite à un essai clinique non concluant. L'acquisition de Dynavax (positive) ne compense pas ces deux mauvaises nouvelles majeures sur le pipeline R&D."}, {"article_id": 42406, "company_id": 34, "entreprise": "ENGIE", "source": "www.tradingsat.com", "published_at": "2026-06-02", "genre": "analyse technique", "titre": "ENGIE  : Avis positif sur critères graphiques", "texte": "ENGIE: Avis positif sur critères graphiques mardi 2 juin 2026 à 09h00 (BFM Bourse) - Sur la base d’une argumentation graphique, les analystes de BFM Bourse ont sélectionnéENGIEpour les investisseurs actifs. L'analyse graphique en données quotidiennes de l'actionENGIEpermet d'identifier une tendance haussière à moyen et long terme. A court terme l'action de l'énergéticien consolide au-dessus d'une zone graphique de support à proximité immédiate des 26 euros.Un franchissement des 28 euros (borne haute de range), sous réserve de progression franc des volumes le moment venu, viendrait étayer le scénario de poursuite haussière. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionENGIEà court terme. Les investisseurs actifs prendront position à l'achat sur le titreENGIEau cours de 26.670 € avec un objectif à 32.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 25.250 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Les analystes de BFM Bourse ont émis un avis haussier sur l'action ENGIE à court terme et recommandent une position à l'achat avec un objectif de cours à 32.000 €.", "note_haiku": 1, "justification_haiku": "L'article mentionne ENGIE et exprime un avis positif sur des critères graphiques (tendance haussière, support, objectif de cours). Cependant, il ne contient AUCUN fait concret spécifique à l'activité de ENGIE (pas de résultats, chiffre d'affaires, contrat, amende, etc.). Il s'agit uniquement d'une analyse technique et d'une recommandation d'investisseurs actifs basée sur des niveaux de prix. Pas de variation de cours mentionnée. Sentiment positif mais sans fondamental concret → NEUTRAL."}, {"article_id": 9059, "company_id": 28, "entreprise": "SAINT-GOBAIN", "source": "www.abcbourse.com", "published_at": "2025-12-01", "genre": "article dédié", "titre": "Saint-Gobain finalise les cessions de deux enseignes de distribution", "texte": "(AOF) - Saint-Gobain a finalisé le 3 novembre la cession de SFIC Belgique, distributeur de matériaux de construction spécialisé dans le plâtre, l'isolation et les plafonds sur le marché belge. Avec un chiffre d'affaires annuel d'environ 75 millions d'euros et des effectifs de 123 collaborateurs, SFIC Belgique opère un réseau de 10 agences qui couvre l'ensemble de la Belgique. Saint-Gobain a également finalisé le 1er décembre la cession de Tumelero, enseigne de distribution de matériaux de construction au Brésil, avec une forte présence dans le sud du pays. Tumelero exploite actuellement 16 magasins et 1 centre logistique dans l'Etat de Rio Grande do Sul, emploie environ 580 salariés pour un chiffre d'affaires annuel d'environ 40 millions d'euros. Ces opérations s'inscrivent dans la stratégie de poursuite du renforcement du profil de Saint-Gobain, en ligne avec les objectifs du plan \"Lead & Grow\". © 2025 Agence Option Finance (AOF) - Tous droits de reproduction réservés par AOF. AOF collecte ses données auprès des sources qu'elle considère les plus sûres. Toutefois, le lecteur reste seul responsable de leur interprétation et de l'utilisation des informations mises à sa disposition. Ainsi le lecteur devra tenir AOF et ses contributeurs indemnes de toute réclamation résultant de cette utilisation. Agence Option Finance (AOF) est une marque du groupe Option Finance Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Saint-Gobain a finalisé deux cessions d'actifs (SFIC Belgique et Tumelero) qui s'inscrivent dans sa stratégie de renforcement de son profil, en ligne avec les objectifs de son plan \"Lead & Grow\".", "note_haiku": 1, "justification_haiku": "L'article mentionne deux cessions finalisées par Saint-Gobain (SFIC Belgique et Tumelero), qui sont des faits concrets relatifs à l'activité de l'entreprise. Cependant, ces opérations sont présentées comme des éléments de stratégie de renforcement du profil sans indication explicite de leur impact positif ou négatif sur les résultats ou la performance. Les cessions sont neutres en termes de sentiment : ni bonne ni mauvaise nouvelle identifiable. Aucune variation de cours, aucune recommandation d'analyste, aucun résultat financier n'est fourni."}, {"article_id": 12083, "company_id": 24, "entreprise": "THALES", "source": "www.tradingsat.com", "published_at": "2025-12-16", "genre": "article dédié", "titre": "THALES : Les garanties proposées par Washington à Kiev remettent sous pression Thales, Rheinmetall et toute la défense européenne en Bourse", "texte": "Thales: Les garanties proposées par Washington à Kiev remettent sous pression Thales, Rheinmetall et toute la défense européenne en Bourse mardi 16 décembre 2025 à 10h31 (BFM Bourse) - Les titres du secteur reculent nettement ce mardi alors que Washington a proposé à Kiev des garanties semblables à celles de l'article 5 du traité de l'Otan, un mouvement censé faciliter un accord de paix en Ukraine. À l'image de l'année 2025, la géopolitique anime encore la séance boursière pour les valeurs européennes de défense, ce mardi 16 décembre. À Paris vers 10h40,Thalesaccuse un repli de 2,6%, la plus forte baisse duCAC 40, etDassault Aviationperd 1,65%. À Francfort, Rheinmetall, qui produit des blindés et des missiles, abandonne 4,6% tandis que Renk, spécialiste des engrenages pour les chars et les frégates marines, cède 3,6%, quand le groupe d'optronique militaire Hensoldt redonne 3,5%. À Londres, BAE Systems recule de 2,45% tandis que l'ex-Finmeccanica Leonardo chute de 4,6%. Le nouveau coup de pression sur le compartiment est à lieraux pourparlers pour parvenir à la fin du conflit en Ukraine. Dimanche et lundi, le président ukrainien, Volodymyr Zelensky, s'est entretenu à Berlin avec les représentants américains pour tenter de parvenir à un compromis acceptable. Selon l'Agence France Presse (AFP), les États-Unis ont proposé à Kiev des garanties \"très fortes\", semblables à celles de l'article 5 de l'Organisation du traité de l'Atlantique Nord (Otan). >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Des questions encore épineuses à trancher Cet article prévoit qu'une attaque armée contre un ou plusieurs membres de l'organisation \"survenant en Europe ou en Amérique du Nord sera considérée comme une attaque dirigée contre toutes les parties\". Autrement dit, une assistance militaire serait fournie à l'Ukraine en cas de nouvelles attaques. Pour autant, l'Ukraine ne rejoindrait pas l'Otan, conformément aux exigences de Moscou. Cette décision de la part des États-Unis doit permettre de favoriser un accord pour aboutir à un cessez-le-feu voire un accord de paix en Ukraine. Volodymyr Zelensky a évoqué lundi des \"progrès\" tandis que Donald Trump, le président américain, a estimé qu'un accord de paix était \"plus proche aujourd'hui\" que jamais auparavant. \"Cela risque d'exercer une pression sur les valeurs européennes du secteur de la défense, notamment Rheinmetall et Renk, même si nous pensons que le cessez-le-feu est déjà largement pris en compte dans les cours actuels\", a commenté Jefferies dans une note publiée en préouverture, ce mardi. Évidemment, au vu des nombreuses volte-face et rebondissements dans ce dossier, le chemin vers la paix en Ukraine reste long. La question des territoires ukrainiens potentiellement annexés par la Russie demeure un sujet épineux. Les activités liées aux munitions pénalisées? Toutefois, la possibilité d'une paix en Ukraine constituera l'un des grands sujets de 2026 pour le secte", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "Thales accuse un repli de 2,6%, la plus forte baisse du CAC 40, suite aux garanties proposées par Washington à Kiev, ce qui constitue un fait concret négatif.", "note_haiku": 0, "justification_haiku": "Fait concret négatif spécifique à THALES : l'article mentionne que Thales accuse un repli de 2,6% (la plus forte baisse du CAC 40) en raison de la pression exercée par les pourparlers de paix en Ukraine, qui menacent les activités de défense et de munitions. Le contexte géopolitique crée une pression baissière directe sur le titre."}, {"article_id": 16914, "company_id": 2, "entreprise": "AIRBUS", "source": "www.abcbourse.com", "published_at": "2026-01-13", "genre": "article dédié", "titre": "Boeing : Boeing repasse devant Airbus en 2025 pour la première fois depuis sept ans", "texte": "(ABC Bourse) - Après plusieurs années dans l’ombre, Boeing a pris sa revanche sur Airbus. En 2025, le constructeur américain a enregistré davantage de commandes que son rival européen, un retournement de situation inédit depuis 2018. Selon les chiffres publiés mardi par Boeing , le groupe américain a enregistré 1.175 commandes brutes en 2025, soit 1.173 nettes une fois les ajustements pris en compte. Airbus , de son côté, affiche 1.000 commandes brutes pour 889 nettes, communiquées lundi. Le constructeur européen conserve cependant une avance sur les livraisons avec 793 avions livrés contre 600 pour Boeing. Une année de reprise pour Boeing Après une période difficile marquée par des scandales de sécurité et une grève de plus de 50 jours en 2024, Boeing a signé son retour en force sur le marché. L’année a été rythmée par la remise en service progressive du 737 MAX, dont la production avait été limitée par la FAA à 38 unités par mois, avant d’obtenir l'autorisation de passer à 42 en octobre, avec l’ambition d'aller au-delà en 2026. Le groupe a pu aussi compter sur un regain de confiance à l’international. Parmi les faits marquants de l’année, on note la livraison de 65 appareils à des compagnies aériennes chinoises, un tournant symbolique depuis le retour en grâce des modèles MAX en Chine fin 2023, après leur interdiction suite à deux crashs survenus en 2018 et 2019. Un redressement salué en interne Ce retour sur le devant de la scène a été salué par les dirigeants de Boeing. \"Nos équipes ont effectué un travail fantastique tout au long de 2025 pour améliorer les livraisons, dans les temps, d'avions sûrs et de qualité\", a déclaré Stephanie Pope, présidente de la branche aviation commerciale (BCA), dans un communiqué. Avec un carnet de commandes qui atteint désormais 6.130 avions commerciaux, le géant américain retrouve un niveau qu’il n’avait plus atteint depuis 2018. Cette dynamique place Boeing en bonne position pour 2026, même si le constructeur reste encore derrière Airbus en matière de livraisons annuelles. © AbcBourse.com. Tous droits réservés Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "Airbus a enregistré moins de commandes nettes que Boeing en 2025 (fait négatif), mais a conservé une avance sur les livraisons (fait positif). Ces faits concrets s'annulent.", "note_haiku": 0, "justification_haiku": "L'article contient un fait concret négatif spécifique à Airbus : le constructeur européen a enregistré MOINS de commandes que Boeing en 2025 (1.000 brutes vs 1.173 pour Boeing), un retournement de situation inédit depuis 2018. Cela représente une mauvaise nouvelle pour Airbus qui perd sa domination historique sur les commandes. Bien qu'Airbus conserve une avance sur les livraisons, la perte de leadership sur les commandes est un signal négatif concret."}, {"article_id": 2853, "company_id": 21, "entreprise": "CAPGEMINI", "source": "www.tradingsat.com", "published_at": "2025-10-28", "genre": "article dédié", "titre": "CAPGEMINI : Pourquoi l'action Capgemini, qui a pris près de 8% à l'ouverture, a perdu une grande partie de ses gains ce mardi", "texte": "C
