dront position à l'achat sur le titreSOITECà un cours supérieur à 52.100 € avec un objectif à 79.990 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 45.990 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'équipe de BFM Bourse émet un avis haussier sur l'action SOITEC et recommande une prise de position à l'achat avec un objectif de cours à 79.990 €.", "note_haiku": 1, "justification_haiku": "L'article contient uniquement une analyse technique et graphique de SOITEC (rounding bottom, moyennes mobiles, volumes) ainsi qu'une recommandation d'achat basée sur des critères techniques. Aucun fait concret relatif à l'activité de SOITEC (résultats, chiffre d'affaires, contrat, etc.) n'est mentionné. La variation de cours n'est pas fournie. Il s'agit d'une analyse de marché sans information spécifique sur les fondamentaux ou l'activité de l'entreprise."}, {"article_id": 16900, "company_id": 18, "entreprise": "SAFRAN", "source": "www.abcbourse.com", "published_at": "2026-01-13", "genre": "article dédié", "titre": "Safran poursuit son plan de rachat d'actions de 5 milliards d'euros avec une nouvelle...", "texte": "(Agefi-Dow Jones)--Le motoriste et équipementier aéronautique Safran a annoncé mardi soir qu'il allait racheter jusqu'à 500 millions d'euros de ses propres actions à compter du 14 janvier et ce jusqu'au 14 avril au plus tard. Cette opération s'inscrit dans le cadre du plan de rachat d'actions pour annulation de 5 milliards d'euros que le groupe doit réaliser entre 2025 et 2028, a-t-il indiqué dans un communiqué. En 2025, ce plan a déjà été exécuté à hauteur de 1,4 milliard d'euros, a ajouté Safran. Agefi-Dow Jones The financial newswire Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Safran a annoncé un programme de rachat d'actions de 500 millions d'euros, s'inscrivant dans un plan plus large de 5 milliards d'euros, ce qui est un fait concret positif pour les actionnaires.", "note_haiku": 1, "justification_haiku": "L'article mentionne un programme de rachat d'actions de 500 millions d'euros annoncé par Safran. Bien qu'il s'agisse d'une action concrète de l'entreprise, un rachat d'actions n'est ni intrinsèquement positif ni négatif pour l'actionnaire : c'est une opération financière neutre qui ne révèle rien sur la performance opérationnelle, les résultats, ou la santé de l'activité de Safran. Aucun fait concret positif (hausse de résultats, contrat, relèvement d'objectif) ni négatif (baisse, amende, avertissement) n'est présent."}, {"article_id": 47652, "company_id": 18, "entreprise": "SAFRAN", "source": "www.easybourse.com", "published_at": "2026-06-30", "genre": "note d'analyste", "titre": "AlphaValue confirme son conseil sur Safran", "texte": "AlphaValue confirme son conseil sur Safran Publié le 30 Juin 2026 (Zonebourse.com) - L'analyste reste à \"alléger\" sur le titre, avec un objectif de cours inchangé à 364 EUR.Selon AlphaValue, la valeur d'actif net (NAV) est relevée à 308 EUR, contre 251 EUR précédemment, soit une hausse de 22,6%, grâce à l'extension du cadre de valorisation aux prévisions 2026-2029, à une analyse plus granulaire des activités et à un relèvement des multiples pour tenir compte du rerating du secteur. Le bureau d'études indique également que sa valorisation par DCF progresse à 308 EUR, contre 242 EUR auparavant, soit une hausse de 27,2%, sous l'effet de l'allongement de la période explicite de prévisions jusqu'en 2029 et d'un relèvement de l'hypothèse de croissance de long terme de l'EBITDA à 8%, contre 6,5% précédemment.Copyright (c) 2026 Zonebourse.com - All rights reserved.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'analyste relève la valeur d'actif net (NAV) de Safran de 22,6% et la valorisation par DCF de 27,2%, et relève l'hypothèse de croissance de long terme de l'EBITDA.", "note_haiku": 1, "justification_haiku": "L'article mentionne uniquement une confirmation de recommandation (alléger) sans changement, et des ajustements méthodologiques de valorisation (NAV et DCF). Aucun fait concret spécifique à l'activité de Safran (résultats, contrats, chiffre d'affaires, etc.) n'est rapporté. Les hausses de 22,6% et 27,2% concernent les modèles de valorisation de l'analyste, non des résultats ou performances réels de l'entreprise. Pas de variation de cours mentionnée. Sentiment neutre : simple mise à jour analytique sans nouvelle positive ou négative concrète."}, {"article_id": 4948, "company_id": 13, "entreprise": "SOITEC", "source": "www.abcbourse.com", "published_at": "2025-11-10", "genre": "franchissement de seuil", "titre": "Goldman Sachs passe sous les 5% des votes de Soitec", "texte": "(Zonebourse.com) - Goldman Sachs Group a déclaré à l'AMF avoir franchi en baisse, le 3 novembre, le seuil de 5% des droits de vote de Soitec et détenir, par l'intermédiaire de ses filiales, 6,39% du capital et 4,99% des droits de vote du fournisseur de matériaux semi-conducteurs. Ce franchissement de seuil résulte d'une cession d'actions Soitec hors marché et d'une diminution du nombre d'actions détenues par assimilation. À cette occasion, Goldman Sachs International a franchi en baisse le même seuil. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Goldman Sachs Group a franchi en baisse le seuil de 5% des droits de vote de Soitec suite à une cession d'actions.", "note_haiku": 1, "justification_haiku": "L'article mentionne un franchissement de seuil par Goldman Sachs (cession d'actions et diminution de participation), qui est une information factuelle sur SOITEC mais ne constitue ni une bonne ni une mauvaise nouvelle pour l'entreprise elle-même. Il s'agit d'un mouvement de portefeuille d'un investisseur, sans impact sur l'activité, les résultats ou la stratégie de SOITEC. Aucun fait concret positif ou négatif spécifique à SOITEC n'est identifiable."}, {"article_id": 2323, "company_id": 10, "entreprise": "NEXANS", "source": "www.abcbourse.com", "published_at": "2025-10-14", "genre": "article dédié", "titre": "Nexans rebondit au lendemain du changement de directeur général", "texte": "(AOF) - Nexans (+3,14%, à 118,30 euros) affiche une des plus fortes progressions du SBF 120 ce mardi au lendemain de sa forte chute (-9,26%). Hier, l'action du fabricant de câbles a dévissé suite à un changement de directeur général. Le conseil d'administration a surpris lundi en nommant Julien Hueber à ce poste. Il succède à Christopher Guérin qui est remplacé après sept ans dans cette fonction. Ces décisions sont à effet immédiat. Christopher Guérin sera à la disposition de Julien Hueber jusqu'au 31 octobre 2025. Julien Hueber était le directeur général exécutif de PWR Grid & Connect Europe au sein de Nexans, une activité pesant 2,6 milliards d'euros et comptant 23 sites industriels. La nomination d'un nouveau directeur général intervient après que Nexans a annoncé fin juillet le départ du directeur financier Jean-Christophe Juillard. Le groupe a lancé le processus de recherche d'un successeur pour ce poste. \" Nexans a confirmé hier soir lors d'une conférence téléphonique avec les investisseurs qu'aucun problème opérationnel, contractuel ou comportemental n'était à l'origine du changement de directeur général \", indique UBS qui reste à l'Achat avec un objectif de cours à 155 euros. Le broker précise que ce changement de DG ne ralentira pas les fusions-acquisitions du groupe qui vise à devenir un acteur exclusivement dédié à l'électrification. Et il y a même un sentiment d'urgence chez Nexans qui affiche une trésorerie nette positive après deux cessions cette année \". De son côté, Deutsche Bank souligne que \" l'ambiguïté entourant les raisons de ce changement de DG et le moment choisi pour l'annoncer a entraîné une vague de ventes des actions Nexans \". Restant à l'Achat avec un objectif de cours inchangé de 152 euros, la banque allemande explique que \" Nexans a également fait part de son ambition d'accélérer le rythme des fusions-acquisitions et de se concentrer sur l'amélioration des marges \". \" Le conseil d'administration souhaite créer une nouvelle dynamique afin d'optimiser davantage les performances tout en mettant en œuvre la feuille de route présentée lors du dernier Capital Market Day \", a précisé hier le fabricant de systèmes de câbles, suite à la nomination de Julien Hueber. Sa journée investisseurs s'était tenue en novembre 2024. Lors de cette journée, Nexans avait dévoilé ses objectifs pour 2028. La société vise une hausse de 350 millions d'euros de l'Ebitda ajusté entre 2024 et 2028. Le spécialiste du câble anticipe également une rentabilité des capitaux employés supérieure à 20% et des investissements d'environ 1,2 milliard d'euros entre 2025 et 2028. Nexans présentera le 23 octobre 2025 ses résultats du troisième trimestre. © 2025 Agence Option Finance (AOF) - Tous droits de reproduction réservés par AOF. AOF collecte ses données auprès des sources qu'elle considère les plus sûres. Toutefois, le lecteur reste seul responsable de leur interprétation et de l'utilisation des informations mises à sa disposition. Ainsi le lecteur devra", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "La société a confirmé l'absence de problèmes opérationnels derrière le changement de DG, a une trésorerie nette positive après des cessions, et a dévoilé des objectifs ambitieux pour 2028, incluant une hausse de l'Ebitda ajusté de 350M€ et une rentabilité des capitaux employés supérieure à 20%. Les analystes maintiennent leurs recommandations à l'achat.", "note_haiku": 1, "justification_haiku": "L'article mentionne un changement de directeur général chez Nexans, mais les analystes (UBS et Deutsche Bank) confirment explicitement qu'aucun problème opérationnel, contractuel ou comportemental n'est à l'origine de ce changement. Les deux brokers maintiennent leurs recommandations d'Achat et soulignent que le groupe poursuivra ses fusions-acquisitions et améliorations de marges. La hausse du cours (+3,14%) reflète une correction après la chute de la veille (-9,26%), mais aucun fait concret positif ou négatif spécifique à l'activité de Nexans n'est identifiable au-delà de cette volatilité de cours et du changement managérial rassurant."}, {"article_id": 8477, "company_id": 13, "entreprise": "SOITEC", "source": "www.abcbourse.com", "published_at": "2025-11-28", "genre": "franchissement de seuil", "titre": "Goldman Sachs International recule sous les 5% du capital de Soitec", "texte": "(Zonebourse.com) - La société Goldman Sachs International a déclaré à l'AMF avoir franchi individuellement en baisse, le 24 novembre 2025, le seuil de 5% du capital de la société Soitec et détenir individuellement, 4,98% du capital et 3,89% des droits de vote de cette société. Ce franchissement de seuil résulte d'une cession d'actions Soitec hors marché et d'une diminution du nombre d'actions Soitec détenues par assimilation. Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Goldman Sachs International a franchi en baisse le seuil de 5% du capital de Soitec suite à une cession d'actions, ce qui est un fait concret négatif concernant la participation d'un investisseur majeur.", "note_haiku": 1, "justification_haiku": "L'article mentionne un franchissement de seuil de participation par Goldman Sachs International (passage sous 5% du capital de Soitec). Il s'agit d'une information factuelle sur la structure actionnariale, mais sans impact concret sur l'activité, les résultats ou la stratégie de Soitec. Aucun fait positif ou négatif spécifique à l'entreprise n'est identifiable. C'est une simple déclaration réglementaire."}, {"article_id": 18738, "company_id": 12, "entreprise": "SCHNEIDER ELECTRIC", "source": "www.abcbourse.com", "published_at": "2026-01-23", "genre": "article dédié", "titre": "Schneider Electric : Une valorisation exigeante face à une dynamique t...", "texte": "Après plusieurs exercices marqués par une forte dynamique opérationnelle, Schneider Electric aborde la seconde moitié de la décennie avec des perspectives jugées solides par le marché. Le spécialiste des technologies de l’énergie et de l’automatisation bénéficie d’un positionnement central sur des thématiques structurelles comme l’électrification, l’efficacité énergétique et la digitalisation des infrastructures industrielles et tertiaires. La récente prise de contrôle intégrale de Schneider Electric India Private Limited illustre cette volonté de renforcer sa présence sur des marchés à fort potentiel. Le rachat des 35 % détenus par Temasek, pour un montant de 5,5 milliards d’euros, permet au groupe de simplifier sa gouvernance et de capter pleinement la croissance indienne, dans un contexte de forte demande en solutions énergétiques et industrielles. Les annonces réalisées à l’occasion de la journée investisseurs ont également soutenu le titre. Schneider Electric vise désormais une croissance organique annuelle moyenne du chiffre d’affaires comprise entre 7 % et 10 % sur la période 2025-2030, accompagnée d’une amélioration cumulée de la marge opérationnelle ajustée de 2,5 points entre 2026 et 2030. Le groupe table aussi sur une progression soutenue du bénéfice par action, portée par la montée en puissance des activités digitales et des revenus récurrents. La dynamique autour des data centers et des infrastructures critiques constitue un autre relais de croissance important. Ces activités représentent environ un quart du chiffre d’affaires attendu en 2025 et bénéficient de la hausse des besoins liés au cloud, au calcul haute performance et à l’intelligence artificielle. Le développement de nouvelles solutions de refroidissement liquide renforce encore ce positionnement technologique. Enfin, la stratégie financière reste active, avec un programme de rachat d’actions de 2,5 à 3,5 milliards d’euros et des cessions ciblées. À horizon 2030, Schneider Electric ambitionne que plus de 70 % de ses revenus proviennent d’offres digitales, tout en portant la part des logiciels et services à 25 %. Sur le plan technique la situation est moins reluisante avec une correction rampante depuis l'automne 2025. L'action recule progressivement et même si elle a trouvé un petit support technique à 220€, la tendance reste menaçante avec un potentiel de correction certain. Le groupe se paie sur des ratios de valorisation élevés et à ce stade les catalyseurs pour relancer une nouvelle phase haussière nous semblent délicats à trouver. Pour l'instant nous resterons hors du dossier que nous estimons très bien valorisé. Principaux défis du groupe : - maintenir un haut niveau d’exécution opérationnelle - gérer l’intégration des acquisitions - préserver les marges dans un environnement concurrentiel accru - accompagner la transformation du modèle vers davantage de revenus récurrents et digitaux. © www.abcbourse.com Vous voulez plus d'analyses et des signaux de trading quotidien", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article mentionne plusieurs faits concrets positifs pour Schneider Electric : l'acquisition de Schneider Electric India Private Limited pour 5,5 milliards d'euros, le relèvement des objectifs de croissance organique annuelle du chiffre d'affaires (7-10% pour 2025-2030) et d'amélioration de la marge opérationnelle (2,5 points), ainsi qu'un programme de rachat d'actions de 2,5 à 3,5 milliards d'euros. Bien qu'il y ait une recommandation négative de l'analyste en fin d'article, les faits concrets positifs concernant la stratégie et les objectifs de l'entreprise sont prépondérants.", "note_haiku": 1, "justification_haiku": "L'article contient de nombreux éléments positifs concrets sur SCHNEIDER ELECTRIC (acquisition de 5,5 Mds€ en Inde, nouveaux objectifs de croissance 7-10% 2025-2030, amélioration de marge de 2,5 pts, programme de rachat d'actions 2,5-3,5 Mds€, positionnement sur data centers et IA). Cependant, ces signaux positifs sont EXACTEMENT ANNULÉS par une critique technique explicite et un avertissement de valorisation : « la situation est moins reluisante », « correction rampante depuis l'automne 2025 », « tendance reste menaçante », « ratios de valorisation élevés », « catalyseurs pour relancer une nouvelle phase haussière nous semblent délicats à trouver », « nous resterons hors du dossier que nous estimons très bien valorisé ». Les signaux positifs (stratégie, acquisitions, objectifs) et négatifs (valorisation excessive, technique dégradée) s'annulent exactement, justifiant une note NEUTRAL."}, {"article_id": 27987, "company_id": 24, "entreprise": "THALES", "source": "www.tradingsat.com", "published_at": "2026-03-13", "genre": "article dédié", "titre": "THALES  : Fin d&#039;une longue consolidation en canal", "texte": "THALES: Fin d'une longue consolidation en canal vendredi 13 mars 2026 à 09900 (BFM Bourse) - Sur la base d’une argumentation graphique, les analystes de BFM Bourse ont sélectionnéTHALESpour les investisseurs actifs. Après une flambée des cours du 02 au 07 janvier, l'action du groupe d'aéronautique et de défense est dans de bonnes dispositions, après une longue consolidation en canal, pour reprendre de la hauteur. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionTHALESà court terme. Les investisseurs actifs prendront position à l'achat sur le titreTHALESau cours de 255.900 € avec un objectif à 299.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 239.000 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Les analystes de BFM Bourse ont sélectionné THALES et émettent un avis haussier avec un objectif de cours à 299.000 €.", "note_haiku": 1, "justification_haiku": "L'article mentionne THALES et adopte un ton positif ('avis haussier', 'bonnes dispositions'), mais ne contient aucun fait concret spécifique à l'activité de l'entreprise (pas de résultats, contrat, chiffre d'affaires, amende, etc.). Il s'agit uniquement d'une analyse graphique et technique du cours de l'action, sans information fondamentale sur THALES."}, {"article_id": 61094, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.abcbourse.com", "published_at": "2026-09-10", "genre": "article dédié", "titre": "TotalEnergies va rembourser 1,5 milliard d’euros d’obligations subordonnées en octobre 2026", "texte": "Actualité publiée le 10/09/26 17:45 TotalEnergies va rembourser 1,5 milliard d’euros d’obligations subordonnées en octobre 2026 (ABC Bourse) - TotalEnergies SE (ISIN: FR0000120271) a annoncé son intention de rembourser par anticipation la totalité de ses « Euro 1,500,000,000 Undated Non-Call 10 Year Deeply Subordinated Fixed Rate Resettable Notes » émises le 6 octobre 2016, pour un montant en principal de 1,5 milliard d’euros. Le groupe, coté à Paris, Londres et New York sous le symbole TTE, exercera cette option de remboursement conformément à la « Condition 6.2 (Optional Redemption) » des termes et conditions des obligations, avec une opération décrite comme « irrévocable » et un remboursement prévu le 6 octobre 2026. Un remboursement intégral du principal et des intérêts courus TotalEnergies précise qu’il « elects to redeem all of the Notes outstanding » à la date de remboursement, pour un montant agrégé en principal de 1,5 milliard d’euros. Les obligations remboursées seront annulées « forthwith » à cette date. Le prix de remboursement correspond au principal, avec prise en compte des intérêts courus et d’éventuels arriérés. Selon le communiqué, « The redemption price of the Redeemed Notes is equal to their principal amount, which is issued in denominations of €100,000, together with any accrued interest and Arrears of Interest (including any Additional Interest Amounts thereon), if any, on the Redeemed Notes, from 6 October 2025 to, but excluding, the Redemption Date ». Le « Redemption Price » est indiqué à « €103,369 per €100,000 denomination ». ISIN, codes d’identification et mentions sur l’exactitude Les numéros ISIN et Common Code figurent dans l’avis « solely for the convenience of the registered owners of the Notes ». TotalEnergies ajoute qu’aucune garantie n’est donnée sur leur exactitude, précisant : « No representation is made as to the correctness or accuracy of the ISIN or Common Code numbers either as printed on the Notes or as contained herein ». Le groupe souligne enfin que « Any redemption of the Notes shall not be affected by any defect in or omission of such identification numbers ». © AbcBourse.com. Tous droits réservés Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "TotalEnergies annonce le remboursement anticipé de 1,5 milliard d'euros d'obligations subordonnées, ce qui est un signe de bonne gestion financière et de solidité.", "note_haiku": 1, "justification_haiku": "L'article mentionne TotalEnergies et décrit une opération financière concrète (remboursement anticipé de 1,5 milliard d'euros d'obligations subordonnées en octobre 2026). Cependant, cette opération est neutre du point de vue de l'analyse fondamentale : il s'agit d'une gestion de dette ordinaire, sans impact positif ou négatif spécifique sur la performance ou la situation de l'entreprise. Aucun fait concret positif (hausse de résultat, contrat gagné, relèvement d'objectif) ni négatif (baisse, amende, procès, avertissement) n'est identifiable. C'est une information factuelle administrative sans signal de sentiment."}, {"article_id": 36330, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-04-29", "genre": "article dédié", "titre": "AIRBUS GROUP : Un premier trimestre &quot;pas beau à voir&quot; et pourtant le titre monte… Pourquoi Airbus grimpe en Bourse alors que ses résultats ont manqué les attentes", "texte": "Airbus group: Un premier trimestre \"pas beau à voir\" et pourtant le titre monte… Pourquoi Airbus grimpe en Bourse alors que ses résultats ont manqué les attentes mercredi 29 avril 2026 à 11h54 (BFM Bourse) - Le groupe d'aéronautique et de défense a publié un résultat opérationnel ajusté et un décaissement de trésorerie en dessous des attentes sur les trois premiers mois de 2026. Mais la société a confirmé ses objectifs annuels et sa direction a donné des éléments rassurants sur sa production et ses livraisons. Non, des résultats inférieurs aux attentes ne sont pas systématiquement sanctionnés en Bourse.Airbusle démontre, ce mercredi 29 avril. Le groupe d'aéronautique et de défense s'adjuge 1,6% en fin de matinée, signant la deuxième plus forte hausse duCAC 40(derrièreSTMicroelectronics,+3,6%) alors que ses comptes du premier trimestre ont manqué le coche. Sur les trois premiers mois de 2026,Airbusa dégagé des revenus de 12,7 milliards d'euros en baisse de 7%. Le résultat opérationnel ajusté s'est inscrit à 300 millions d'euros, soit 52% de moins que sur la même période de 2025, et nettement moins que les 348 millions d'euros attendus par les analystes, selon un consensus mis en ligne par la société. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Ces résultats ont notamment été pénalisés par des livraisons d'avions en net repli, le groupe ayant expédié 114 appareils contre 136 unités sur les trois premiers mois de 2025. En conséquence, le résultat opérationnel ajusté de la division d'aéronautique civil de la société a déçu, avec 81 millions d'euros générés contre 158 millions d'euros attendus. A contrario, les activités de défense et spatiales ont affiché un résultat opérationnel ajusté de 130 millions d'euros, nettement au-dessus du consensus (111 millions d'euros). Airbus a par ailleurs accusé un décaissement de trésorerie plus fort que redouté par les bureaux d'études. La société a brûlé pour 2,5 milliards d'euros de cash, avant financement des clients, quand les analystes tablaient sur un flux de trésorerie négatif de 1,73 milliard d'euros. In fine, \"le premier trimestre n’est certes pas beau à voir\", convient Oddo BHF. Mais cette publication \"reflète surtout une saisonnalité exacerbée et des éléments exceptionnels\", ajoute le courtier. La direction du groupe a donné sur ce point des éléments d'explications cruciaux lors de la conférence téléphonique avec les analystes, organisée mardi soir. Le groupe a certes brûlé plus de cash qu'attendu. Mais ce décaissement de trésorerie s'explique par une \"désynchronisation\" entre la production et les livraisons. Ce décalage a conduit la société a accumulé beaucoup plus de stocks ce qui a gonflé le besoin en fonds de roulement et pesé sur la trésorerie, a indiqué le directeur financier, Thomas Toepfert. L'inadéquation entre la production et les livraisons a pour source deux éléments exceptionnels. Premièrement,Airbusa pâti de difficultés d'approvisionn", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Malgré des résultats du T1 inférieurs aux attentes (revenus -7%, résultat opérationnel -52%, livraisons en repli, décaissement de trésorerie plus fort), Airbus a confirmé ses objectifs annuels pour 2026. Les activités de défense et spatiales ont dépassé le consensus. La direction a rassuré sur la reprise des livraisons à la Chine et la montée en cadence de la production. Royal Bank of Canada a maintenu sa recommandation à \"surperformance\".", "note_haiku": 1, "justification_haiku": "L'article contient des faits concrets mitigés sur Airbus : résultats T1 2026 décevants (revenus en baisse de 7%, résultat opérationnel ajusté de 300M€ vs 348M€ attendus, décaissement de trésorerie de 2,5Md€ vs 1,73Md€ attendu), livraisons en repli (114 appareils vs 136 en 2025). Cependant, ces mauvaises nouvelles sont entièrement compensées par des éléments positifs concrets : confirmation des objectifs annuels 2026 (870 appareils, 7,5Md€ de résultat opérationnel ajusté, 4,5Md€ de flux de trésorerie), explications rassurantes de la direction sur les causes exceptionnelles et temporaires (problèmes administratifs chinois résolus, désynchronisation production-livraisons), et plusieurs analystes maintenant ou confirmant des recommandations positives (RBC en 'surperformance'). Les signaux positifs et négatifs s'annulent exactement, justifiant une note NEUTRAL."}, {"article_id": 17053, "company_id": 1, "entreprise": "AIR LIQUIDE", "source": "www.abcbourse.com", "published_at": "2026-01-13", "genre": "résultats d'entreprise", "titre": "Air Liquide : Résilience opérationnelle, mais vigilance sur la tendanc...", "texte": "Valeur défensive par excellence du CAC 40, Air Liquide continue d’évoluer dans un environnement contrasté, mêlant visibilité de long terme et pressions conjoncturelles à court terme. Le spécialiste des gaz industriels, médicaux et technologiques s’appuie sur un modèle éprouvé, fondé sur des contrats de long terme et une forte récurrence des revenus, qui lui permet d’absorber les cycles économiques avec une relative résilience. Sur le plan opérationnel, le groupe confirme sa capacité à améliorer progressivement sa rentabilité. Pour le second semestre 2025, les anticipations font état d’une croissance organique modérée des ventes, de l’ordre de 1,2 % sur un an, mais surtout d’une nette amélioration de la marge d’EBIT, attendue autour de 180 points de base. Air Liquide réaffirme par ailleurs son objectif de progression cumulée de 460 points de base de marge opérationnelle sur la période 2022-2026, traduisant la discipline du groupe en matière de coûts et de sélectivité des investissements. La dynamique sectorielle reste toutefois hétérogène. Si les activités Santé et Industriel marchand affichent encore des croissances solides, la Grande Industrie et l’Électronique ont montré des signes de ralentissement récent. À cela s’ajoute un effet de change défavorable, estimé à environ -3,5 % sur le chiffre d’affaires annuel 2025, qui pèse mécaniquement sur la croissance publiée. Sur le front stratégique, l’acquisition de DIG Airgas en Corée du Sud marque une étape importante. Cette opération renforce significativement la présence du groupe dans un marché des gaz industriels appelé à doubler d’ici 2035, porté par les semi-conducteurs, la transition énergétique et la biopharmacie. Relutive sur le résultat net à horizon d’un an, elle devrait contribuer plus tôt que prévu à la performance globale du groupe. Tendance baissière encore présente Du côté de l'analyse technique, on reste dans un mouvement baissier, à l'intérieur d'un large canal de tendance négatif (en rouge sur le graphique ci-dessus). On a néanmoins un support intéressant à exploiter autour de 153 euros, première zone d'achat pour se replacer sur ce titre phare de la cote parisienne. Principaux défis : maintien de la croissance dans un environnement industriel plus incertain, maîtrise de l’impact des devises, exécution réussie des acquisitions en Asie, et poursuite de l’amélioration des marges dans un contexte de pression sur certains segments. © www.abcbourse.com Vous voulez plus d'analyses et des signaux de trading quotidiens ? Dynamisez votre portefeuille avec ABC Bourse Premium ! Vous avez aimé cet article ? Partagez-le avec vos amis en cliquant sur les boutons ci-dessous : Les informations et analyses diffusées par ABC Bourse ne constituent qu'une aide à la décision pour les investisseurs. La responsabilité d'ABC Bourse ne peut être retenue directement ou indirectement suite à l'utilisation des informations et analyses par les lecteurs. Il est recommandé à toute personne non avertie de consulte", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article contient plusieurs faits concrets positifs pour Air Liquide : une nette amélioration de la marge d'EBIT est attendue pour le second semestre 2025 (environ 180 points de base), le groupe réaffirme son objectif de progression cumulée de 460 points de base de marge opérationnelle sur 2022-2026, et l'acquisition de DIG Airgas en Corée du Sud est jugée relutive sur le résultat net et devrait contribuer plus tôt que prévu. Bien qu'un effet de change défavorable soit mentionné, les éléments positifs concrets prédominent.", "note_haiku": 1, "justification_haiku": "L'article contient des informations mixtes sur Air Liquide : des faits positifs concrets (amélioration de marge d'EBIT attendue à 180 pb au S2 2025, réaffirmation de l'objectif de 460 pb cumulés 2022-2026, acquisition stratégique de DIG Airgas en Corée du Sud relutive à horizon 1 an) et des faits négatifs concrets (ralentissement en Grande Industrie et Électronique, effet de change défavorable de -3,5% sur le CA 2025). Ces signaux positifs et négatifs s'annulent mutuellement, justifiant une notation NEUTRAL. Aucune variation de cours n'est fournie dans l'article."}, {"article_id": 4611, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.tradingsat.com", "published_at": "2025-11-09", "genre": "article dédié", "titre": "TOTALENERGIES : Après une année 2025 à oublier, Totalenergies peut-il prendre sa revanche en Bourse?", "texte": "Totalenergies: Après une année 2025 à oublier, Totalenergies peut-il prendre sa revanche en Bourse? dimanche 9 novembre 2025 à 07h00 (BFM Bourse) - La major pétrolière française sous-performe largement leCAC 40et ses rivaux cette année, pénalisée par la baisse des cours du pétrole mais aussi par sa décision de réduire le rythme des rachats d'actions.Totalenergiesa-t-il toutefois les atouts pour renverser la vapeur dans les prochains mois? Sauf improbable surprise de dernière minute, le millésime 2025 deTotalenergiesen Bourse ne restera pas dans les annales. Depuis le début de l'année, la major pétrolière et gazière évolue à très grande peine dans le vert (+0,39%), à la traîne duCAC 40(+7,72%) mais aussi et surtout de ses rivaux cotés à Londres British Petroleum (+16,72%) et Royal Dutch Shell (+15,1%). Totalenergies a certes pâti de la chute des cours du pétrole, avec unBrenten repli de 15,1% sur l'ensemble de 2025, lui-même plombé par l'incertitude économique ainsi que par les hausses de production de la part de plusieurs pays membres de l'Opep+ (l'Organisation des pays exportateurs de pétrole et leurs alliés). Mais d'autres facteurs ont également joué. Lors de plusieurs publications,Totalenergiesa vu sa dette nette grimper,la société ne parvenant pas - avec la baisse des cours du brut - à générer suffisamment de trésorerie pour financer de façon organique (c'est-à-dire sans s'endetter) ses investissements, son dividende et ses rachats d'actions. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading En conséquence, les investisseurs ont commencé à redouter que la société taille dans son retour à l'actionnaire (les dividendes et les rachats d'actions) pour préserver son bilan et son ratio d'endettement. Le \"gearing\" (la dette nette rapportée à l'ensemble du passif de l'entreprise) avait ainsi atteint 17,9% à fin juin contre 14,3% un an plus tôt. Rappelons que le retour à l'actionnaire demeure un critère d'attractivité important pour les groupes pétroliers auprès du marché. Pour donner un exemple, l'américain Exxonmobil compte acquérir pour 20 milliards de dollars de ses propres titres cette année. Totalenergiesa fini par remettre à plat sa politique de retour à l'actionnaire en septembre dernier.Alors que le groupe rachetait depuis plusieurs années pour 2 milliards de dollars de ses propres titres par trimestre, le groupe a pas ait concret sur l'activité. Les analystes restent globalement constructifs (RBC en surperformance, UBS à l'achat, Barclays positif, HSBC neutre) sans changement de recommandation annoncé. Aucun fait concret positif ou négatif nouveau spécifique à TotalEnergies n'est identifiable dans cet article d'analyse prospective."}, {"article_id": 2825, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.tradingsat.com", "published_at": "2025-10-30", "genre": "article dédié", "titre": "TOTALENERGIES : Coup d'envoi le 8 décembre à la cotation des actions Totalenergies à New York", "texte": "Totalenergies: Coup d'envoi le 8 décembre à la cotation des actions Totalenergies à New York jeudi 30 octobre 2025 à 17h19 (BFM Bourse) - Patrick Pouyanné, le PDG du groupe, a indiqué que la cotation des actions ordinairesTotalenergiesà la Bourse de New York démarrerait le 8 décembre prochain. La cotation à New York deTotalenergiesen actions ordinaires débutera le 8 décembre prochain, ce qui permettra aux titres du géant français d'être échangés à Paris et sur la place financière américaine, a annoncé son PDG Patrick Pouyanné. \"Nous sommes heureux d'annoncer qu'aujourd'hui, nous avons ordonné à [la banque] JPMorgan de lancer le processus de résiliation du programme ADR afin que les actions ordinaires commencent à être négociées à la Bourse de New York le 8 décembre\", a-t-il déclaré. Cette opération technique va permettre la transformation des titres deTotalenergiesactuellement cotés à la Bourse américaine sous la forme d'ADR en actions ordinaires qui pourront s'échanger sur Euronext à Paris et sur le New York Stock Exchange. \"Il s'agit bien sûr d'une étape importante pour l'entreprise qui permettra à une seule catégorie d'actionsTotalEnergiesde se négocier avec des horaires étendus\" de l'ouverture de la Bourse de Paris jusqu'à la fermeture de celle de New York, a-t-il ajouté. \"Nous espérons que cette cotation des actions ordinaires sera un catalyseur pour l'action en 2026 sur const COLONNES = ["article_id", "company_id", "entreprise", "source", "published_at", "genre", "titre", "texte", "note_humaine", "commentaire", "note_gemini", "justification_gemini", "note_haiku", "justification_haiku"];
const CLE_STOCKAGE = "annotation_desaccords_v1";
const NOMS_NOTE = {0: "Négatif", 1: "Neutre", 2: "Positif"};

let position = 0;
let reponses = DONNEES.map(() => ({note: "", commentaire: ""}));
let stockageDispo = true;

/* ---------- Persistance ---------- */
function charger() {
  try {
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if (brut) {
      const sauve = JSON.parse(brut);
      if (Array.isArray(sauve) && sauve.length === DONNEES.length) reponses = sauve;
    }
  } catch (e) {
    stockageDispo = false;
    alerter("Ce navigateur ne conserve pas les annotations entre deux ouvertures. Exportez le CSV avant de fermer l'onglet.");
  }
}
function sauver() {
  if (!stockageDispo) return;
  try { localStorage.setItem(CLE_STOCKAGE, JSON.stringify(reponses)); }
  catch (e) {
    stockageDispo = false;
    alerter("Sauvegarde automatique interrompue. Exportez le CSV pour ne rien perdre.");
  }
}
function alerter(message) {
  const el = document.getElementById("alerte");
  el.textContent = message;
  el.hidden = false;
}

/* ---------- Rendu ---------- */
function ecart(cas) {
  return Math.abs(Number(cas.note_gemini) - Number(cas.note_haiku));
}

function construireIndex() {
  const index = document.getElementById("index");
  index.textContent = "";
  DONNEES.forEach((cas, i) => {
    const b = document.createElement("button");
    b.className = "pastille";
    b.dataset.ecart = ecart(cas);
    b.title = `${i + 1}. ${cas.entreprise}`;
    b.setAttribute("aria-label", `Cas ${i + 1}, ${cas.entreprise}`);
    b.addEventListener("click", () => { position = i; afficher(); });
    index.appendChild(b);
  });
}

function majIndex() {
  const pastilles = document.getElementById("index").children;
  for (let i = 0; i < pastilles.length; i++) {
    const note = reponses[i].note;
    if (note === "") pastilles[i].removeAttribute("data-note");
    else pastilles[i].dataset.note = note;
    pastilles[i].setAttribute("aria-current", i === position ? "true" : "false");
  }
}

function afficher() {
  const cas = DONNEES[position];
  const rep = reponses[position];

  document.getElementById("compteur").innerHTML =
    `Cas ${position + 1} <em>sur ${DONNEES.length}</em>`;
  const faits = reponses.filter(r => r.note !== "").length;
  document.getElementById("avancement").innerHTML =
    `<em>${faits} annotés, ${DONNEES.length - faits} restants</em>`;

  const meta = document.getElementById("meta");
  meta.textContent = "";
  const ajout = (texte, classe) => {
    const s = document.createElement("span");
    s.textContent = texte;
    if (classe) s.className = classe;
    meta.appendChild(s);
  };
  ajout(cas.entreprise, "entreprise");
  ajout(cas.source);
  ajout(cas.published_at);
  ajout(cas.genre, "genre");
  if (ecart(cas) === 2) ajout("Les deux modèles s'opposent franchement", "drapeau");

  document.getElementById("titre").textContent = cas.titre;
  document.getElementById("texte").textContent = cas.texte;
  document.getElementById("tronque").hidden = (cas.texte || "").length < 2990;

  document.getElementById("commentaire").value = rep.commentaire || "";

  document.querySelectorAll(".choix-bouton").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.valeur === rep.note && rep.note !== ""));
  });

  // Les notes des modèles restent cachées tant qu'on n'a pas tranché :
  // les lire d'abord fausserait l'annotation.
  const dejaRepondu = rep.note !== "";
  document.getElementById("verdicts").hidden = !dejaRepondu;
  document.getElementById("btn-reveler").hidden = dejaRepondu;
  if (dejaRepondu) remplirVerdicts(cas);

  majIndex();
  window.scrollTo({top: 0});
}

function remplirVerdicts(cas) {
  const g = document.getElementById("note-gemini");
  g.textContent = NOMS_NOTE[cas.note_gemini];
  g.dataset.note = cas.note_gemini;
  document.getElementById("justif-gemini").textContent = cas.justification_gemini || "—";

  const h = document.getElementById("note-haiku");
  h.textContent = NOMS_NOTE[cas.note_haiku];
  h.dataset.note = cas.note_haiku;
  document.getElementById("justif-haiku").textContent = cas.justification_haiku || "—";
}

/* ---------- Actions ---------- */
function repondre(valeur) {
  reponses[position].note = valeur;
  reponses[position].commentaire = document.getElementById("commentaire").value;
  sauver();

  // Marquer le choix tout de suite : sans ça, le bouton ne s'allume qu'au
  // rendu suivant, soit après la demi-seconde de lecture des verdicts.
  document.querySelectorAll(".choix-bouton").forEach(b => {
    b.setAttribute("aria-pressed", String(b.dataset.valeur === valeur && valeur !== ""));
  });

  if (valeur !== "") {
    const cas = DONNEES[position];
    remplirVerdicts(cas);
    document.getElementById("verdicts").hidden = false;
    document.getElementById("btn-reveler").hidden = true;
    majIndex();
    const faits = reponses.filter(r => r.note !== "").length;
    document.getElementById("avancement").innerHTML =
      `<em>${faits} annotés, ${DONNEES.length - faits} restants</em>`;
    setTimeout(() => deplacer(1), 550);
  } else {
    deplacer(1);
  }
}

function deplacer(pas) {
  const cible = position + pas;
  if (cible < 0 || cible >= DONNEES.length) return;
  memoriserCommentaire();
  position = cible;
  afficher();
}

function memoriserCommentaire() {
  reponses[position].commentaire = document.getElementById("commentaire").value;
  sauver();
}

function prochainVide() {
  memoriserCommentaire();
  const depart = position;
  for (let i = 1; i <= DONNEES.length; i++) {
    const j = (depart + i) % DONNEES.length;
    if (reponses[j].note === "") { position = j; afficher(); return; }
  }
  alerter("Tous les cas sont annotés. Pensez à exporter le CSV.");
}

/* ---------- Export ---------- */
function champCsv(valeur) {
  const t = (valeur === null || valeur === undefined) ? "" : String(valeur);
  return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

function exporter() {
  memoriserCommentaire();
  const lignes = [COLONNES.join(";")];
  DONNEES.forEach((cas, i) => {
    const ligne = {...cas, note_humaine: reponses[i].note, commentaire: reponses[i].commentaire};
    lignes.push(COLONNES.map(c => champCsv(ligne[c])).join(";"));
  });
  // BOM UTF-8 : sans lui, Excel affiche les accents de travers.
  const blob = new Blob(["\ufeff" + lignes.join("\r\n")], {type: "text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "annotation_desaccords_annote.csv";
  a.click();
  URL.revokeObjectURL(url);
}

/* ---------- Câblage ---------- */
document.querySelectorAll(".choix-bouton").forEach(b => {
  b.addEventListener("click", () => repondre(b.dataset.valeur));
});
document.getElementById("btn-prec").addEventListener("click", () => deplacer(-1));
document.getElementById("btn-suiv").addEventListener("click", () => deplacer(1));
document.getElementById("btn-suivant-vide").addEventListener("click", prochainVide);
document.getElementById("btn-export").addEventListener("click", exporter);
document.getElementById("commentaire").addEventListener("change", memoriserCommentaire);
document.getElementById("btn-reveler").addEventListener("click", () => {
  remplirVerdicts(DONNEES[position]);
  document.getElementById("verdicts").hidden = false;
  document.getElementById("btn-reveler").hidden = true;
});

document.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT" || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "0") { e.preventDefault(); repondre("0"); }
  else if (e.key === "1") { e.preventDefault(); repondre("1"); }
  else if (e.key === "2") { e.preventDefault(); repondre("2"); }
  else if (e.key.toLowerCase() === "v") { e.preventDefault(); repondre(""); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); deplacer(-1); }
  else if (e.key === "ArrowRight") { e.preventDefault(); deplacer(1); }
  else if (e.key.toLowerCase() === "c") { e.preventDefault(); document.getElementById("commentaire").focus(); }
});

window.addEventListener("beforeunload", e => {
  const faits = reponses.filter(r => r.note !== "").length;
  if (faits > 0) { e.preventDefault(); e.returnValue = ""; }
});

charger();
construireIndex();
afficher();
</script>
</body>
