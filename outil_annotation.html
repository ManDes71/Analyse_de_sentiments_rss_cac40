par mois d'ici à la fin de l'année 2027 qui serait ensuite stabilisée à un rythme de 75 \"par la suite\". \"Une nouvelle année apporte son lot de perturbations liées aux moteurs, mais celle-ci se distingue particulièrement car elle soulève des questions quant à l'équilibre des incitations entre les équipementiers de moteurs et de cellules (la structure principale de l'avion, NDLR)\", pointe Bank of America dans une récente note. \"L'incapacité de Pratt à s'engager sur le nombre de moteurs commandés parAirbuslimite la production à court terme, renforçant ainsi un problème majeur qui persiste depuis quatre ans, à savoir qu'Airbuscontinue de supporter l'essentiel des risque", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente des faits concrets négatifs concernant Airbus (perspectives 2026 décevantes pour les livraisons, le résultat opérationnel et la génération de cash, retards répétés sur les objectifs de production) et des faits concrets positifs (recommandation d'analyste relevée à l'achat par Citi, objectif de cours rehaussé, carnet de commandes important, amélioration attendue des divisions défense/hélicoptères, impact positif du dollar). Ces signaux opposés s'annulent.", "note_haiku": 2, "justification_haiku": "Citi a relevé son conseil à l'achat sur Airbus (passage de neutre à achat) et a rehaussé son objectif de cours de 208€ à 217€, représentant un potentiel de plus de 22%. Ces sont des faits concrets positifs spécifiques à Airbus. L'article cite également plusieurs éléments favorables : carnet de commandes solide (9.000 avions), amélioration attendue des divisions défense et hélicoptères, soutien du dollar, et impact positif du conflit moyen-oriental sur les prix du pétrole (incitant à acheter des avions plus efficaces). Malgré les problèmes de cadence de production mentionnés, la recommandation d'analyste améliorée constitue un fait concret positif majeur."}, {"article_id": 57090, "company_id": 7, "entreprise": "CARREFOUR", "source": "www.tradingsat.com", "published_at": "2026-08-25", "genre": "article dédié", "titre": "CARREFOUR  : Reprise haussière à suivre", "texte": "CARREFOUR: Reprise haussière à suivre mardi 25 août 2026 à 09h00 (BFM Bourse) -Cet article, en accès libre, est produit par l'équipe de recherche en analyse et stratégie boursière de BFM Bourse. Pour ne manquer aucune opportunité, consultez l'intégralité des analyses et découvrez nos portefeuilles en accédant ànotre espace Privilèges.RBC a récemment confirmé son opinion « Surperformer » sur Carrefour et son objectif de 22 €, anticipant une amélioration de la rentabilité au second semestre. Le groupe devrait profiter de ses investissements en France, de meilleures tendances de consommation et d’une reprise progressive de son activité en Argentine. Techniquement, le titre évolue au sein d’un range depuis plusieurs semaines et pourrait désormais repartir en direction de sa borne haute. Cette phase de consolidation intervenant après une tendance haussière bien établie, elle s’apparente à une figure de continuation. Les probabilités restent donc favorables à une sortie par le haut et à une reprise de la dynamique haussière. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l’actionCARREFOURà court terme. Les investisseurs actifs prendront position à l’achat sur le titreCARREFOURau cours de 16.000 € avec un objectif à 18.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 14.990 €.", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne que RBC a confirmé sa recommandation et anticipe une amélioration de la rentabilité, mais il n'y a pas de fait concret (hausse de résultat, contrat gagné, relèvement d'objectif par l'entreprise, ou amélioration de la note d'analyste) pour justifier une note positive.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à CARREFOUR : (1) RBC confirme son opinion 'Surperformer' sur Carrefour avec objectif de 22€, (2) anticipation d'une amélioration de la rentabilité au second semestre, (3) bénéfices attendus des investissements en France, (4) amélioration des tendances de consommation, (5) reprise progressive de l'activité en Argentine. L'avis global de l'analyste est explicitement 'haussier' sur l'action CARREFOUR à court terme. Ces éléments constituent des signaux positifs concrets et spécifiques."}, {"article_id": 59149, "company_id": 2, "entreprise": "AIRBUS", "source": "www.bfmtv.com", "published_at": "2026-08-12", "genre": "article dédié", "titre": "Il veut concurrencer Airbus et Boeing: le C919 du constructeur chinois Comac a réalisé son tout premier vol international vers la Mongolie (mais ses avions ne sont autorisés ni en Europe ni aux États-Unis)", "texte": "L'avionneur chinois Comac a franchi une nouvelle étape avec le tout premier vol international de son moyen-courrier C919, reliant Pékin à Oulan-Bator, en Mongolie. Conçu pour concurrencer l'Airbus A320 et le Boeing 737, l'appareil doit encore obtenir les certifications européenne et américaine pour s'imposer sur le marché mondial. Un avion C919 construit en Chine a réalisé mercredi entre Pékin et la Mongolie son premier vol international, une avancée dans les efforts chinois pour rivaliser un jour avec les géants Boeing et Airbus sur le marché aéronautique mondial. Cet avion à fuselage étroit qui peut transporter 158 à 192 passagers selon son constructeur est présenté comme un concurrent potentiel de l'Airbus A320 ou du Boeing 737. Mais il n'a pas encore reçu l'approbation des autorités de régulation américaines ou européennes . Un moteur signé Safran Un C919 opéré par la compagnie nationale Air China s'est envolé de Pékin mercredi à 15h17 locales. Le vol CA723 s'est posé à Oulan-Bator à 16h58, indiquent des données de trafic aérien. Hu Yuan, un passager âgé de 40 ans, a exprimé au moment de l'enregistrement son \"sentiment de fierté\" à voyager sur une ligne internationale à bord d'un avion chinois. \"J'espère que nos avions nationaux continueront à s'améliorer en termes de confort et d'expérience globale, et surpasseront Boeing et Airbus\", a-t-il déclaré. La nouvelle ligne reliera les deux capitales à raison d'un aller-retour par jour, selon l'agence officielle chinoise Xinhua. Le C919 est construit en Chine à partir de composants de différents pays, dont les États-Unis et la France. Ses moteurs sont des Leap, l'un des modèles à succès de Safran et sa coentreprise fondée avec l'Américain GE . L'aéronef a réalisé sont premier vol commercial en mai 2023, entre Shanghai et Pékin. Il est depuis utilisé de manière régulière sur plusieurs lignes en Chine et à Hong Kong. Comac sur les plates-bandes d'Airbus et Boeing Le constructeur du C919, l'entreprise d'État Comac, a déjà pris pied à l'étranger, en Asie, avec ses C909, des appareils plus petits d'une capacité de 78 à 97 passagers opérés par les compagnies TransNusa en Indonésie ou Air Cambodia au Cambodge. Mais avec le C919, Comac espère concurrencer l'Airbus A320 , l'avion le plus vendu au monde, et le 737 MAX de Boeing, avionneur dans la tourmente après plusieurs accidents, dont le dernier est survenu la semaine dernière en Inde . Avec la forte demande des compagnies aériennes pour les moyen-courriers, le C919 pourrait même profiter d'un souffle favorable, estimait en juin 2025 Florian Aknin, qui couvre notamment le secteur aéronautique au sein du cabinet Roland Berger. \"Boeing et Airbus ont des difficultés pour augmenter les cadences de production au niveau espéré\", expliquait-il. Dans ces conditions, \"avoir un troisième acteur apporte une vraie solution à des compagnies aériennes qui ont des besoins assez urgents\". Faible cadence de production Toutefois, si le C919 effectue des vols commerciaux en", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'article mentionne qu'Airbus rencontre des difficultés pour augmenter ses cadences de production au niveau espéré, ce qui est un fait concret négatif.", "note_haiku": 1, "justification_haiku": "L'article mentionne AIRBUS à plusieurs reprises, mais uniquement dans un contexte de comparaison avec le C919 de Comac. Aucun fait concret spécifique à AIRBUS n'est rapporté : pas de résultats, pas de contrat, pas de variation de cours, pas de note d'analyste, pas d'amende ou de procès. Les mentions d'AIRBUS sont factuelles mais génériques (l'A320 est l'avion le plus vendu, AIRBUS produit 45 A320 par mois). Il n'y a ni bonne ni mauvaise nouvelle spécifique à AIRBUS."}, {"article_id": 19586, "company_id": 5, "entreprise": "BNP PARIBAS ACT.A", "source": "www.tradingsat.com", "published_at": "2026-01-27", "genre": "article dédié", "titre": "BNP PARIBAS ACT.A  : Un &quot;trend&quot; bien établi", "texte": "BNP PARIBAS ACT.A: Un \"trend\" bien établi mardi 27 janvier 2026 à 09h00 (BFM Bourse) - Sur la base d’une argumentation graphique, les analystes de BFM Bourse ont sélectionnéBNP PARIBAS ACT.Apour les investisseurs actifs. L'analyse graphique en données quotidiennes de l'actionBNP PARIBAS ACT.Apermet d'identifier une tendance haussière à court terme depuis la formation d'un gap d'éjection le 20 novembre. Parmi les facteurs graphiques dominants, nous avons relevé la présence d'un gap haussier plus commun, mais très significatif sur les cours de l'actionBNP PARIBAS ACT.A. (09 janvier), gap suivi d'une extension haussière immédiate. Sur le plan des indicateurs de tendance, la moyenne mobile à 20 jours (en bleu foncé) fait office de support pour les cours. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionBNP PARIBAS ACT.Aà court terme. Les investisseurs actifs prendront position à l'achat sur le titreBNP PARIBAS ACT.Aau cours de 89,17 € avec un objectif à 109.950 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 82.490 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Les analystes de BFM Bourse ont un avis haussier sur l'action BNP PARIBAS ACT.A à court terme et recommandent l'achat du titre.", "note_haiku": 1, "justification_haiku": "L'article contient uniquement une analyse graphique et technique de BNP PARIBAS ACT.A sans aucun fait concret relatif à l'activité de l'entreprise (résultats, chiffre d'affaires, contrat, amende, etc.). Aucune variation de cours n'est mentionnée. L'avis 'haussier' repose exclusivement sur des éléments techniques (gaps, moyennes mobiles, tendances graphiques) et ne constitue pas un fait concret positif au sens des critères définis. Il s'agit d'une analyse de marché sans information spécifique à l'activité de l'entreprise."}, {"article_id": 27802, "company_id": 13, "entreprise": "SOITEC", "source": "www.tradingsat.com", "published_at": "2026-03-12", "genre": "article dédié", "titre": "SOITEC : Déclenchée par des posts sur les réseaux sociaux, la fièvre boursière (près de +30% en deux séances) autour de Soitec se justifie-t-elle vraiment?", "texte": "Soitec: Déclenchée par des posts sur les réseaux sociaux, la fièvre boursière (près de +30% en deux séances) autour de Soitec se justifie-t-elle vraiment? jeudi 12 mars 2026 à 15345 (BFM Bourse) - L'action du spécialiste des matériaux pour l'industrie des semi-conducteurs connaît une envolée en Bourse depuis maintenant plusieurs jours à la suite d'un post sur X d'un compte vantant les perspectives du groupe pour une technologie développée par Nvidia. Le bond a de quoi laisser songeur.Soitecest en train de signer un beaurallyeen l'espace de quelques heures. Le spécialiste isérois des matériaux pour semi-conducteurs a gagné 16,1% mercredi et reprend encore 10,7% ce jeudi vers 15h50. L'action s'adjuge ainsi plus de 28,5% en deux séances. Aucune publication de résultats ou annonce spécifique n'a déclenché cette fièvre. Contactée par BFM Bourse, la société a rappelé qu'elle ne communiquait pas les évolutions de son cours de Bourse. Citi attribue l'envolée du coursà un post sur X (ex-Twitter)publié par un compte suivi par 103.700 abonnés sous le pseudo de \"Serenity\" (@aleabitoreddit).Selon Bloomberg cité par Zonebourse, ce compte avait eu le nez creux en développant une thèse d'achat sur le fabricant britannique de nano-ordinateurs à bas prix Raspberry Pi juste avant que l'action s'enflamme. L'internaute expliquait alorsque les agents d'IA pourraient porter la demande pour les produits de la société britannique.L'action Raspberry Pi avait ensuite pris 46% en quelques séances. Cette fois Serenity explique avoir pris une position \"de taille\" surSoitecen raison de son exposition au CPO (\"cop-packaged optic\"), une technologie utilisée par Nvidia pour ses réseaux de processeurs graphiques (GPU). Le groupe est même en situation \"de monopole\" sur ses produits liés à cette technologie, selon l'internaute. Le compte estime que la conférence technologique de Nvidia, organisée la semaine prochaine du 16 au 19 mars prochain, constituera ainsi un catalyseur pour l'action. Serenity affirme se positionner sur le titre à un niveau de valorisation actuellement déprimé pour jouer le \"potentiel\" sur les CPO qui se concrétisera, d'après lui, d'ici à la mi-2027. L'internaute juge, in fine, que le cours deSoitecpeut être multiplié par trois. \"Je prévois de conserver mes positions (surSoitec, NDLR) au cours des deux prochaines années, car je pense que ce titre sera le principal bénéficiaire de la prochaine vague architecturale menée par Nvidia\", conclut ce compte. Analyste chez Kepler Cheveux, Sébastien Sztabowicz se montre prudent. \"Ce compte X a eu de bonnes intuitions par le passé mais il n'a pas vraiment apporté d'analyses nouvelles sur l'action\", considère-t-il. \"En réalité, il est très difficile de comprendre pourquoi l'action (Soitec, NDLR) a tant monté. Des résultats d'entreprise de semiconducteurs ou de la tech, comme GlobalWafers et Oracle, ont rassuré, mais il n’y a pas d’implications directes surSoitec\", ajoute-t-il. Un autre analyste, lui, considère au contraire", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article mentionne des faits concrets positifs récents (activité supérieure aux attentes sur le dernier trimestre publié et prévisions rassurantes) et des faits concrets négatifs actuels (faiblesse du marché des smartphones, stagnation du secteur automobile, coûts de sous-utilisation affectant les marges). Le rallye boursier actuel n'est pas déclenché par de nouvelles annonces spécifiques de l'entreprise, mais par des posts sur les réseaux sociaux, et les analystes expriment de la prudence face à l'optimisme excessif.", "note_haiku": 2, "justification_haiku": "L'article mentionne une hausse spectaculaire du cours de SOITEC (+28,5% en deux séances), mais explicitement « aucune publication de résultats ou annonce spécifique n'a déclenché cette fièvre ». La hausse est attribuée à des posts sur les réseaux sociaux sans fondement concret. Les analystes (Citi, Kepler Cheveux) expriment de la prudence et jugent l'optimisme potentiellement excessif. Bien que l'article reconnaisse que SOITEC est « leader incontesté » en silicium photonique (fait positif), il n'y a aucun fait concret nouveau spécifique à SOITEC (pas de contrat signé, pas de résultats annoncés, pas de relèvement d'objectif). Les signaux positifs (potentiel technologique) et négatifs (euphorie jugée exagérée, défis persistants) s'annulent. Sentiment neutre : simple constatation de mouvements de marché spéculatifs sans fondement factuel nouveau."}, {"article_id": 14099, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.tradingsat.com", "published_at": "2025-12-27", "genre": "article dédié", "titre": "SCHNEIDER ELECTRIC : BNP Paribas, Airbus, Totalenergies, LVMH Moet Vuitton, Ryanair… Voici les actions favorites d'Oddo BHF pour 2026", "texte": "Schneider electric: BNP Paribas, Airbus, Totalenergies, LVMH, Ryanair… Voici les actions favorites d'Oddo BHF pour 2026 samedi 27 décembre 2025 à 07h00 (BFM Bourse) - Tablant sur une nouvelle hausse des marchés européens pour l'an prochain, le courtier a sélectionné une trentaine de valeurs susceptibles de se distinguer. Parmi ces titres figurentAxa,Capgeminiou encoreEngie. Les actions européennes s'apprêtent à achever un millésime faste. Nombre de places du Vieux continent (Madrid avec 48%, Milan avec 30,5%, Francfort avec 23,3%) vont, sauf improbable retournement de situation, largement battre le S&P 500 (+17,5%)*, l'indice phare de Wall Street, cette année. Cela ne sera toutefois pas le cas duCAC 40qui prend pour l'heure 9,8% sur l'ensemble de 2025, à la traîne des grands indices mondiaux. Le baromètre phare de la place de Paris a évidemment été plombé par le retour du risque politique en France à compter de la fin de l'été. Pour l'an prochain, Oddo BHF pense que les marchés européens en ont encore sous le pied. Les stratégistes du bureau d'études privilégient, certes, les États-Unis, car ils attendent une croissance des bénéfices par action plus forte sur le S&P 500 que sur le Stoxx Europe 600, le grand indice paneuropéen (+14% contre +8% en 2026). >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Mais ils considèrent que l'indice européen grimpera de 6% d'ici fin 2026 (pour atteindre 626 points) voire 10% en cas de paix en Ukraine. Quelles actions faut-il privilégier, dans ce contexte ? Oddo BHF a établi sa liste \"European Large Caps 2026\", regroupant une trentaine de grandes capitalisations européennes qu'elle favorise pour l'année à venir. Dans cette sélection figure par exemple le transporteur aérien Ryanair, le courtier jugeant que l'environnement de marché lui sera favorable. Ou encore ASML, groupe néerlandais qui possède 80% de parts de marché dans la lithographie, une technologie clef dans le processus de fabrication des semi-conducteurs. La liste complète figure à la fin de cet article. Nous nous sommes concentrés sur les valeurs françaises qui constituent déjà un contingent de 12 valeurs. Comme Deutsche Bank,récemment passée à l'achat sur le titre, Oddo retient le groupe hôtelierAccordans sa sélection. Le courtier estime que la société tirera partie de son exposition à des zones dynamiques du marché, à savoir le Moyen-Orient (7% des revenus) et l'Asie Sud-Pacifique (20%). En outre,Accordevrait céder les 30% qu'il détient encore dans Essendi, son ex-filiale d'immobilier d'hôtellerie, ce qui parachèvera sa transformation vers un modèle \"asset -light\", c'est-à-dire sans détenir les murs de ses hôtels. Oddo BHF pense que le groupe dégagera entre 800 et 900 millions d'euros de cette cession, dont le produit sera redistribué à 75% aux actionnaires sous forme de rachats d'actions. PourAirbus, la thèse du courtier est simple. Le principal enjeu pour l'avionneur reste d'assurer au mieux la m", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "Oddo BHF a sélectionné Totalenergies comme une de ses actions favorites pour 2026 (fait concret positif), mais la société a également diminué ses rachats d'actions en septembre (fait concret négatif). Ces faits opposés s'annulent.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à TotalEnergies : (1) Oddo BHF anticipe une inversion de la dynamique en 2026 avec un endettement sous contrôle et un apaisement du risque politique en France ; (2) le groupe offre la meilleure croissance de production de 4% par an d'ici 2030 grâce au GNL et aux renouvelables ; (3) sa stratégie de transition est qualifiée de 'la plus avancée et la plus ambitieuse' avec un objectif de doublement de la production d'électricité d'ici 2030 à 100-120 TWh ; (4) TotalEnergies figure dans la sélection 'European Large Caps 2026' d'Oddo BHF, ce qui constitue une recommandation favorable. Ces éléments constituent des faits concrets positifs justifiant une note positive."}, {"article_id": 20449, "company_id": 19, "entreprise": "SANOFI", "source": "www.abcbourse.com", "published_at": "2026-01-30", "genre": "article dédié", "titre": "Sanofi : Un horizon stratégique encore fragile mais un support techniq...", "texte": "Sanofi a présenté des résultats 2025 et des perspectives 2026 jugés robustes, sans pour autant parvenir à dissiper les interrogations de long terme des investisseurs. En Bourse, le titre évolue dans une tendance hésitante, reflet d’un paradoxe persistant : une dynamique financière solide à court terme, mais une visibilité stratégique plus fragile au-delà de la fin de la décennie, en particulier en raison de la future perte de brevet de Dupixent. En 2025, le laboratoire français a affiché une croissance soutenue de son activité. Le chiffre d’affaires annuel s’est établi à 43,63 milliards d’euros, en hausse de 9,9% à taux de change constants, dépassant légèrement les attentes du marché. Le bénéfice net des activités a atteint 9,56 milliards d’euros, en progression de plus de 12% à taux de change constants, tandis que le bénéfice net par action des activités s’est élevé à 7,83 euros, en hausse de 15%, confirmant une exécution opérationnelle maîtrisée. Cette performance repose largement sur Dupixent, dont les ventes ont bondi de 25,2% en 2025 pour atteindre 15,71 milliards d’euros, soit plus d’un tiers du chiffre d’affaires du groupe. Le médicament demeure le principal moteur de croissance et devrait continuer à soutenir les résultats dans les prochaines années. Pour 2026, Sanofi anticipe ainsi une croissance des ventes comprise entre 7% et 9%, ainsi qu’une progression du bénéfice par action légèrement supérieure à celle du chiffre d’affaires. Toutefois, cette dépendance accrue alimente les inquiétudes sur l’après-2031, date d’entrée de Dupixent dans le domaine public. Sanofi reconnaît ne pas être en mesure de compenser totalement cette perte, malgré un effort renforcé en recherche et développement et une stratégie active de croissance externe. En parallèle, le groupe met l’accent sur la rentabilité et le retour à l’actionnaire, avec un dividende relevé à 4,12 euros et un nouveau programme de rachat d’actions d’un milliard d’euros. L'aspect technique du dossier est très intéressant puisque le titre, après une longue séquence baissière, est en train de revenir sur le support majeur des 76,5 euros. L'annonce des résultats n'a pas permis pour l'instant d'inverser la vapeur mais le test de ce niveau technique crucial est attendu avec impatience. L'action Sanofi l'a déjà testé à 3 reprises et c'est la 4éme attaque de ce seuil sur lequel le titre a toujours rebondi. Compte tenu des annonces financières récentes nous estimons qu'il y a un coup à jouer sur ce niveau qui offre une porte d'entrée à un prix décoté par rapport au secteur d'activité. Évidemment si le scénario baissier prenait le dessus avec un enfoncement du support sous les 76€ la théorie de la reprise serait battue en brèche. Principaux défis de Sanofi : réduire la dépendance au Dupixent avant l’expiration du brevet restaurer la crédibilité et la profondeur du pipeline de R&D réussir l’intégration des acquisitions récentes maintenir une croissance rentable tout en renforçant la génération de tr", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente des résultats 2025 et des perspectives 2026 robustes (chiffre d'affaires, bénéfice net, BPA en hausse, dividende relevé, rachat d'actions), mais souligne également des interrogations de long terme et la reconnaissance par Sanofi de son incapacité à compenser totalement la future perte de brevet de Dupixent, créant un équilibre entre faits positifs et négatifs concrets.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Sanofi : chiffre d'affaires 2025 de 43,63 milliards d'euros en hausse de 9,9% (dépassant les attentes), bénéfice net en progression de plus de 12%, bénéfice par action en hausse de 15%, ventes de Dupixent en hausse de 25,2% atteignant 15,71 milliards d'euros, perspectives 2026 de croissance 7-9%, dividende relevé à 4,12 euros, et nouveau programme de rachat d'actions d'1 milliard d'euros. Ces éléments constituent une exécution opérationnelle solide et des résultats jugés robustes. Les inquiétudes sur l'après-2031 ne contredisent pas ces faits concrets positifs immédiats."}, {"article_id": 4101, "company_id": 5, "entreprise": "BNP PARIBAS ACT.A", "source": "www.abcbourse.com", "published_at": "2025-11-06", "genre": "article dédié", "titre": "Bnp Paribas : Résultats solides mais prudence des investisseurs face aux défis", "texte": "BNP Paribas a publié des résultats jugés « solides » pour le troisième trimestre 2025, bien qu’en léger retrait par rapport aux attentes du marché. Sur la période de juillet à septembre, le produit net bancaire a progressé de 5,3 % à 12,57 milliards d’euros, contre 12,8 milliards espérés par le consensus. Le résultat brut d’exploitation s’élève à 4,96 milliards d’euros, en hausse de 4,9 %, tandis que le résultat net part du groupe atteint 3,04 milliards d’euros, en progression de 6,1 % sur un an, mais inférieur aux anticipations (3,09 milliards). Les performances contrastées d’un pôle à l’autre expliquent en partie la prudence des investisseurs. La banque de financement et d’investissement enregistre une croissance de 4,5 % de ses revenus, portée par les activités actions, mais les revenus de marchés demeurent en retrait face aux grands acteurs américains. La banque commerciale profite quant à elle d’un environnement de taux toujours favorable, tandis que la hausse du coût du risque à 905 millions d’euros (+24 %) et les charges d’intégration d’AXA IM (690 millions d’euros) ont pesé sur les marges. Sur les neuf premiers mois, le bénéfice net atteint 9,25 milliards d’euros, laissant au groupe une marge de manœuvre confortable pour atteindre son objectif annuel de 12,2 milliards d’euros. Malgré un contexte réglementaire exigeant et un litige juridique persistant aux États-Unis, BNP Paribas conserve une assise financière robuste et une stratégie claire de diversification vers la gestion d’actifs. D'un point de vue de l'analyse technique la situation s'est fortement dégradée comme on peut le voir sur le graphique ci-dessus. D'une part le titre a nettement décroché à la baisse depuis quelques semaines et il a enfoncé un premier support intermédiaire situé autour de 66,6 euros. Les volumes ont été touffus et le RSI se retrouve désormais en zone de survente. Pour autant il reste de la marge à la baisse puisque nous n'avons aucun support significatif à portée de main et il n'en faudrait pas beaucoup pour revisiter les 61€ si le marché se mettait à consolider. Le timing est mauvais pour rentrer à l'achat. Principaux défis : maîtriser le coût du risque, concrétiser les synergies issues d’AXA IM, et restaurer la confiance des investisseurs après une réaction boursière prudente. © www.abcbourse.com Vous voulez plus d'analyses et des signaux de trading quotidiens ? Dynamisez votre portefeuille avec ABC Bourse Premium ! Vous avez aimé cet article ? Partagez-le avec vos amis en cliquant sur les boutons ci-dessous : Les informations et analyses diffusées par ABC Bourse ne constituent qu'une aide à la décision pour les investisseurs. La responsabilité d'ABC Bourse ne peut être retenue directement ou indirectement suite à l'utilisation des informations et analyses par les lecteurs. Il est recommandé à toute personne non avertie de consulter un conseiller professionnel avant tout investissement. Ces informations indicatives ne constituent en aucune manière une incit", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article présente un mélange de faits concrets positifs (progression du produit net bancaire, du résultat brut d'exploitation et du résultat net part du groupe, assise financière robuste) et de faits concrets négatifs (résultats en léger retrait par rapport aux attentes, revenus de marchés en retrait, hausse du coût du risque, charges d'intégration, litige juridique persistant). Ces éléments contradictoires s'annulent, résultant en un sentiment neutre.", "note_haiku": 0, "justification_haiku": "L'article contient plusieurs faits concrets négatifs spécifiques à BNP Paribas : (1) le produit net bancaire de 12,57 milliards est en retrait par rapport aux attentes du marché (12,8 milliards), (2) le résultat net de 3,04 milliards est inférieur aux anticipations (3,09 milliards), (3) une hausse significative du coût du risque à 905 millions (+24%), (4) des charges d'intégration d'AXA IM de 690 millions pesant sur les marges, (5) un litige juridique persistant aux États-Unis, (6) une dégradation technique marquée avec le titre ayant « nettement décroché à la baisse » et enfoncé des supports. Ces éléments constituent des mauvaises nouvelles concrètes justifiant une note négative."}, {"article_id": 10882, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2025-12-10", "genre": "article dédié", "titre": "FIGEAC AERO : Conforté par la montée en cadence de ses gros clients comme Airbus et Boeing, Figeac Aero reste confiant pour son exercice 2025-2026", "texte": "Figeac aero: Conforté par la montée en cadence de ses gros clients comme Airbus et Boeing, Figeac Aero reste confiant pour son exercice 2025-2026 mercredi 10 décembre 2025 à 10h48 (BFM Bourse) - L'équipementier aéronautique du Lot a dévoilé une amélioration de sa performance opérationnelle , en ligne avec les attentes. Figeac Aero confirme ses objectifs sur le front opérationnel ainsi que sur sa trajectoire de désendettement pour son exercice clos fin mars 2026. Spécialisé dans la production de pièces de structure en alliages légers et en métaux durs, de pièces de moteurs, de trains d'atterrissage et de sous-ensembles, l'activité de Figeac Aero est intimement liée aux cadences de production des grands donneurs d'ordres de l'aéronautique tels qu'Airbusou Boeing. Et pour l'équipementier du Lot, la tendance actuelle lui est bien favorable et notamment dans l'aéronautique civile. Les grands donneurs d'ordres de l'aéronautique, forts de carnets de commandes bien remplis avec la croissance du trafic aérien, cherchent désormais à accélérer progressivement les cadences de production qui devraient atteindre des records dans les prochaines années. L'équipementier aéronautique continue donc de profiter de l'amélioration du climat des affaires dans l'industrie aéronautique, ce qui lui a permis d'afficher un chiffre d'affaires en hausse de 7,7% (+9,6% à périmètre et taux de change constants) à 215,3 millions d'euros au titre de son premier semestre 2024-2025 clos fin septembre. Figeac explique que son activité globale a été tirée par ses activités Aérostructures et Aéromoteur, avec une croissance de la quasi-totalité des programmesAirbuset du moteur LEAP qui bénéficie du redressement des volumes du 1B équipant les 737 de Boeing, et par les activités Défense et Énergie. A fin septembre 2025, l'excédent brut d'exploitation (Ebitda) courant s'est apprécié de 18,6% à 30,6 millions d'euros contre 25,8 millions d'euros un an auparavant. Cet indicateur ressort cependant légèrement en deçà des 32 millions d'euros estimés par TP ICAP Midcap qui note que la baisse du dollar (par rapport à l'euro, NDLR) et la perte de la filiale mexicaine auront chacune pesé à hauteur de 1 million d'euros sur ce solde. \"L’évolution de l’Ebitda courant sur le premier semestre – une période généralement bien moins contributrice - s’inscrit également en ligne avec les objectifs annuels du groupe en la matière\", fait valoir Figeac Aéro. Le taux de marge d'Ebitda courant ressort à 14,2% du chiffre d'affaires contre 12,9% l'an passé. Un peu plus bas dans les comptes, le groupe a creusé sa perte nette sur un an, passant de 4,4 millions d'euros à fin septembre 2024 à 17,4 millions d'euros à fin septembre 2025. Les comptes du groupe ont été pénalisés par des charges uniquement comptables (non-cash) d’un montant de 10,1 millions d'euros. Elles sont liées à l'augmentation de la composante actions des obligations remboursables en numéraires et en actions nouvelles (\"Ornane\") pour 7,4 millions d'eur", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article mentionne la montée en cadence des programmes Airbus, la croissance de la quasi-totalité de ses programmes, la reprise des activités de Spirit par Airbus et la décision de réinternalisation du mât des A320, tous des faits concrets positifs pour l'entreprise.", "note_haiku": 1, "justification_haiku": "L'article mentionne Airbus à plusieurs reprises, mais uniquement dans le contexte de Figeac Aero (fournisseur/équipementier). Les références à Airbus concernent : (1) la montée en cadence de production chez Airbus (bonne nouvelle pour Figeac, pas pour Airbus directement), (2) la croissance des programmes Airbus bénéficiant à Figeac, (3) la réinternalisation du mât des A320 par Airbus (opportunité pour Figeac). Aucun fait concret spécifique à Airbus lui-même n'est mentionné : pas de résultats Airbus, pas de contrat gagné par Airbus, pas de chiffre d'affaires Airbus, pas de note d'analyste sur Airbus. Les informations sont factuelles mais concernent l'impact sur Figeac, pas Airbus directement. La variation de cours mentionnée (-7,2%) concerne Figeac Aero, pas Airbus."}, {"article_id": 20870, "company_id": 13, "entreprise": "SOITEC", "source": "www.abcbourse.com", "published_at": "2026-02-03", "genre": "article dédié", "titre": "Soitec redresse ses ventes en fin d'année mais ses revenus restent en net repli sur u...", "texte": "(Agefi-Dow Jones)--Le fabricant de plaques de silicium sur isolant Soitec a annoncé une croissance organique séquentielle de ses revenus trimestriels meilleure qu'attendu. Pour la période d'octobre à fin décembre, qui correspond au troisième trimestre de son exercice décalé, le chiffre d'affaires s'est contracté de 29% sur un an, à 160 millions d'euros en données publiées. Il a cependant enregistré une croissance organique de 18% au troisième trimestre par rapport au trimestre précédent alors que la firme iséroise visait une croissance organique séquentielle de 5% à 9% (\"mid-to-high single-digit). Les analystes anticipaient en moyenne un chiffre d'affaires de 160,8 millions d'euros, selon le consensus Factset. Le repli du chiffre d'affaires du groupe sur un an s'explique par les difficultés de sa principale division, les communications mobiles, dont les ventes ont reculé de 42% à 90 millions d'euros. Il a également souffert du repli des revenus de la division automobile de 37% à 16 millions d'euros. S'agissant de ses perspectives, le chiffre d'affaires du quatrième trimestre de l'exercice 2026 est attendu en progression d'environ 20% à périmètre et taux de change constants par rapport au troisième trimestre de l'exercice 2026. \"L'environnement de marché devrait rester globalement stable, avec la poursuite de la correction des stocks clients\", a commenté Soitec. La société a précisé que l'activité \"communications mobiles devrait s'améliorer séquentiellement, tandis que la performance annuelle restera affectée par les ajustements de stocks\". \"Notre trajectoire est claire: nous travaillons à la génération d'un free cash flow positif pour l'exercice 2025-2026. Par la suite, la progression de l'ajustement des stocks clients devrait permettre au chiffre d'affaires de Soitec de se stabiliser et la génération de trésorerie de s'améliorer. Dans le même temps, nous restons engagés dans une gestion rigoureuse des coûts et de la trésorerie, tout en poursuivant des investissements ciblés dans notre feuille de route technologique afin de soutenir les opportunités de croissance future sur des marchés de plus en plus diversifiés, \" a déclaré Pierre Barnabé, directeur général de Soitec. Début janvier, le groupe a annoncé la nomination de Laurent Rémont au poste de directeur général, en remplacement Pierre Barnabé, dont le départ le 31 mars 2026 avait été dévoilé en octobre. L'année 2025 a été très difficile pour Soitec qui a dû lancer plusieurs avertissements sur résultats et a vu sa capitalisation fondre de 73%. Agefi-Dow Jones The financial newswire Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "Le chiffre d'affaires de Soitec s'est contracté de 29% sur un an, avec des baisses significatives dans ses divisions clés (-42% mobile, -37% automobile). L'année 2025 a été très difficile, marquée par plusieurs avertissements sur résultats et une chute de 73% de sa capitalisation boursière. Malgré une croissance organique séquentielle meilleure qu'attendu et des perspectives positives pour le prochain trimestre, les faits négatifs concrets et récents sont prédominants.", "note_haiku": 1, "justification_haiku": "L'article contient des faits concrets mixtes sur SOITEC : croissance organique séquentielle de 18% (meilleure qu'attendu, positif) mais contrastée par une baisse annuelle de 29% du chiffre d'affaires, des reculs importants dans les divisions mobiles (-42%) et automobile (-37%), et un contexte difficile en 2025 avec avertissements sur résultats et perte de capitalisation de 73%. Les signaux positifs (croissance trimestrielle, perspectives de progression Q4) et négatifs (baisse annuelle, divisions en difficulté, avertissements passés) s'annulent exactement, justifiant une notation NEUTRAL."}, {"article_id": 59156, "company_id": 2, "entreprise": "AIRBUS", "source": "www.bfmtv.com", "published_at": "2026-08-04", "genre": "article dédié", "titre": "Des compagnies comme British Airways et Emirates dépensent sans compter pour maintenir et moderniser leurs Airbus A380, car les livraisons des nouveaux modèles tardent trop", "texte": "Le géant britannique British Airways va moderniser ses 12 superjumbos avec une approche premium. Emirates de son côté investit des milliards de dollars pour transformer sa vaste flotte d'A380. Il est très gourmand en kérosène, il coûte cher à maintenir, il est difficile à remplir, il n'est plus fabriqué par Airbus depuis 2021, pourtant le mythique A380 poursuit sa carrière chez de grandes compagnies et bénéficie même de milliards de dollars d'investissements pour le moderniser. Pour les opérateurs qui en possèdent, c'est aujourd'hui une des meilleures options pour compenser les retards importants de livraison des gros porteurs actuels comme l'A350-900 d'Airbus ou encore le Boeing 777X, un appareil présenté en 2013, qui devait être mis en service en 2020 mais qui ne sera pas exploité avant l'année prochaine. British Airways a ainsi annoncé un vaste programme de modernisation (retrofit dans le jargon) des 12 appareils qu'il possède pour ses liaisons longs courriers. L'objectif est une montée en gamme de la cabine avec une nouvelle suite de Première au \"luxe moderne britannique\" et l’installation des Club Suites (classe affaires) sur le pont supérieur, soit moins de sièges au total (421 au lieu de 469) mais des sièges vendus plus chers. Les appareils seront en outre équipés de la connectivité Wi-Fi haut débit Starlink. Ce programme sera réalisé entre cette année et 2028. Mais c'est du côté d'Emirates que le programme de transformation est le plus impressionnant, d'abord parce que la compagnie du Golfe est celle qui possède le plus d'A380 dans sa flotte avec 116 appareils dont une centaine en service actif, et parce que tout est réalisé en interne. Emirates veut les faire voler jusqu'en 2040 Les gros porteurs sont au coeur de la stratégie de la compagnie de par sa clientèle, son positionnement et les liaisons d'interconnexion qu'elle propose depuis le méga hub de Dubaï . L'A380 remplit donc parfaitement son rôle et les appareils de la flotte bénéficient de \"plusieurs milliards de dollars\" d'investissements avec notamment le déploiement de la Classe Économie Premium afin de proposer trois classes différentes en cabine: 76 sièges en Classe Affaires, 56 sièges en Classe Économie Premium et 437 sièges en Classe Économique. \"Chez Emirates, notre programme de modernisation reflète notre volonté constante d’offrir à nos clients une expérience toujours plus haut de gamme à travers l’ensemble de notre réseau. Nos équipes d’ingénierie travaillent en continu, aux côtés de nos partenaires et fournisseurs, afin d’intégrer avec précision les meilleurs standards de confort et de design à chaque appareil concerné par ce programme ambitieux\", explique Tim Clark, président d'Emirates. Avec ce programme, Emirates compte faire voler ses A380 jusqu'en 2040, le temps notamment de recevoir ses nouveaux gros porteurs. Il faut aussi rappeler que l'A380 ne sera bientôt plus compatible avec les objectifs de verdissement des opérateurs et d'économies en carburant. L'appétit des", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'article mentionne des retards importants de livraison pour les gros porteurs actuels d'Airbus, comme l'A350-900, ce qui est un fait concret négatif pour l'entreprise.", "note_haiku": 1, "justification_haiku": "L'article mentionne Airbus à plusieurs reprises mais uniquement dans un contexte factuel neutre : citation de l'A380 (production arrêtée en 2021, information historique), mention de l'A350-900 comme exemple de gros porteur avec retards de livraison (situation générale du secteur, non spécifique à Airbus), et référence générale aux demandes des compagnies pour des modèles plus grands. Aucun fait concret positif ou négatif spécifique à Airbus n'est identifié : pas de résultats, pas de contrat annoncé, pas d'amende, pas de note d'analyste, pas de variation de cours. Les mentions d'Airbus sont contextuelles et ne constituent pas une information d'activité ou de performance de l'entreprise."}, {"article_id": 2846, "company_id": 18, "entreprise": "SAFRAN", "source": "www.tradingsat.com", "published_at": "2025-10-29", "genre": "analyse technique", "titre": "SAFRAN  : Inertie haussière", "texte": "SAFRAN: Inertie haussière mercredi 29 octobre 2025 à 09h00 (BFM Bourse) -Cet article, en accès libre, est produit par l'équipe de recherche en analyse et stratégie boursière de BFM Bourse. Pour ne manquer aucune opportunité, consultez l'intégralité des analyses et découvrez nos portefeuilles en accédant ànotre espace Privilèges. Une dynamique haussière clairement affirmée sur l'actionSAFRANinvitera les investisseurs actifs à se positionner à l'achat, dans le cadre d'une opération de swing trading. NB:les investisseurs qui auront suivi notre recommandation sur ce même dossier en date du 23/09 pourront conserver cette position, en prenant soin d'ajuster le stop et protection et l'objectif de cours. L'analyse graphique en données quotidiennes de l'actionSAFRANpermet d'identifier une tendance haussière à court terme comme à moyen terme. Sur le plan des indicateurs de tendance, la moyenne mobile à 50 jours (en orange) fait office de support pour les cours, matérialisant la puissance de la tendance primaire. Le volume d'échange est en hausse, une donnée technique favorable à notre anticipation. Enfin, la dynamique des bandes de Bollinger à ce stade laisse augurer une libération d'énergie, tout comme la prise d'appui de la moyenne mobile à 20 jours sur la courbe de tendance de fond précédemment évoquée. Au regard des facteurs graphiques clés que nous avons mentionnés, notre avis est haussier sur l'actionSAFRANà court terme. Les investisseurs actifs prendront position à l'achat sur le titreSAFRANau cours de 303.900 € avec un objectif à 375.000 € en ligne de mire. Ils protégeront leur capital en plaçant un stop à 284.500 €.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "L'article, produit par BFM Bourse, améliore sa recommandation sur SAFRAN, passant d'un conseil implicite de \"conserver\" (pour les investisseurs ayant suivi la recommandation précédente) à un conseil explicite d'\"achat\" pour les investisseurs actifs, ce qui constitue une note d'analyste améliorée.", "note_haiku": 1, "justification_haiku": "L'article contient un ton globalement positif et haussier sur SAFRAN (recommandation d'achat, dynamique haussière affirmée), mais AUCUN fait concret spécifique à l'activité de l'entreprise (pas de résultats, contrat, chiffre d'affaires, amende, procès, ou note d'analyste améliorée). Il s'agit uniquement d'une analyse technique graphique et de recommandations de trading basées sur des indicateurs techniques, sans information factuelle sur SAFRAN elle-même. Aucune variation de cours n'est mentionnée dans l'article."}, {"article_id": 30681, "company_id": 2, "entreprise": "AIRBUS", "source": "www.tradingsat.com", "published_at": "2026-03-28", "genre": "article dédié", "titre": "AIRBUS GROUP : Quels risques pose le conflit en Iran sur les groupes aéronautiques en Bourse, comme Airbus et Safran, et faut-il revenir sur ces titres après leurs récentes chutes?", "texte": "Airbus group: Quels risques pose le conflit en Iran sur les groupes aéronautiques en Bourse, comme Airbus et Safran, et faut-il revenir sur ces titres après leurs récentes chutes? samedi 28 mars 2026 à 07h00 (BFM Bourse) - Les perturbations du trafic aérien liées au conflit font craindre un risque par ricochet sur les revenus d'après-vente et de maintenance. Mais la hausse des cours du baril peut paradoxalement renforcer l'attrait des avionneurs. L'aéronautique n'a pas été épargné par l'éclatement du conflit au Moyen-Orient. Depuis le début de l'offensive franco-israélienne contre l'Iran, l'indice paneuropéen Stoxx Europe Total Market Aerospace & Defense a chuté de 12,7%. L'aéronautique demeure un secteur industriel considéré comme cyclique. Le compartiment a ainsi pu pâtir de la baisse généralisée d'appétit pour le risque des investisseurs. Au-delà de ce phénomène de marché, des risques propres au secteur viennent s'ajouter. \"En règle générale, le rapport entre les groupes aéronautiques civils et les cours du pétrole est le suivant : les spécialistes de l''aftermarket' souffrent de la hausse des cours du pétrole, tandis que les avionneurs en bénéficient - à condition que le trafic aérien ne soit pas trop affecté par cette hausse\", explique Jefferies. >>Accédez à nos analyses graphiques exclusives, et entrez dans la confidence du Portefeuille Trading Les spécialistes de \"l'aftermarket\" sont tout simplement les motoristes-équipementiers, à savoirSafran, le britannique Rolls Royce ou encore l'allemand MTU Aero. Ces sociétés dégagent le gros de leur rentabilité non pas sur leurs produits vendus lors de la mise en service d'un avion (\"la première monte\") mais sur la maintenance, la révision, la réparation ou encore la vente de pièces détachées. Ces activités sont très bien margées, mêmes si les entreprises ne communiquent pas leurs niveaux de rentabilité sur ces métiers. Ces services dépendent des visites dans les ateliers des appareils des compagnies aériennes (ou des loueurs), ce qui est étroitement corrélé au trafic aérien. Pour ces raisons, une société commeSafranavait davantage souffert en Bourse de la pandémie (et donc de l'effondrement du trafic) qu'Airbus. Rebelote avec le conflit en Iran. L'actionSafranchute de 18,7% sur un mois, contre une baisse de 13% pour celle de l'avionneur. La guerre au Moyen-Orient perturbe directement le trafic aérien même si l'impact direct peut s'avérer relativement mesuré. Selon Jefferies qui s'appuie sur des données de l'Association internationale des transporteurs aériens (IATA), le Moyen-Orient représente environ 10% du trafic aérien. La banque a estimé, dans une récente note, que si le conflit venait à s'allonger pendant plusieurs mois, l'impact se chiffrerait autour de 3 points de pourcentage pour le trafic aérien mondial sur 2026, car les compagnies aériennes rerouteront certains vols pour éviter la zone. Jefferies retient ainsi une croissance de 2% du trafic aérien pour 2026, contre 5% pour l'IATA. Toutefo", "note_humaine": "", "commentaire": "", "note_gemini": 0, "justification_gemini": "L'action Airbus a chuté de 13% sur un mois. La direction a indiqué ne pas percevoir d'impact lié au Moyen-Orient et n'a pas constaté de demande d'annulation de commandes ou de report de livraisons. Jefferies a maintenu sa recommandation à \"conserver\".", "note_haiku": 1, "justification_haiku": "L'article mentionne Airbus à plusieurs reprises mais uniquement dans un contexte d'analyse de risques et d'opportunités liés au conflit en Iran. Les faits concrets relevés sont : (1) Citi rapporte qu'Airbus n'a pas perçu d'impact du Moyen-Orient à ce stade, que la région représente 8% du carnet de commandes, et qu'aucune annulation ou report n'a été constaté - ces éléments sont neutres/rassurants mais pas des bonnes nouvelles concrètes (pas de contrat gagné, pas de hausse de résultats). (2) Jefferies considère la réaction négative du cours 'légèrement excessive' mais maintient son opinion à 'conserver' - pas de changement de recommandation. (3) Aucune variation de cours spécifique à Airbus n'est donnée dans l'article. L'absence de mauvaise nouvelle concrète et l'absence de bonne nouvelle concrète justifient une notation NEUTRAL."}, {"article_id": 58241, "company_id": 1, "entreprise": "AIR LIQUIDE", "source": "www.tradingsat.com", "published_at": "2026-09-01", "genre": "article dédié", "titre": "AIR LIQUIDE : Une «cible de choix sur Euronext»... Des informations sur une irruption du fonds activiste Elliott à son capital font grimper Air Liquide, la valeur préférée des boursicoteurs parisiens", "texte": "Air liquide: Une «cible de choix sur Euronext»... Des informations sur une irruption du fonds activiste Elliott à son capital font grimper Air Liquide, la valeur préférée des boursicoteurs parisiens mardi 1 septembre 2026 à 09h50 (BFM Bourse) - Selon le Financial Times, le fonds activiste aurait pris une participation dans la valeur reine des investisseurs parisiens sans pour autant préciser ses intentions concernant le spécialiste des gaz industriels. Valeur de fond de portefeuille par excellence,Air Liquideaurait un nouvel actionnaire à son tour de table. L'identité du potentiel néo-actionnaire du spécialiste des gaz industriels n'est tout autre qu'Elliott Investment Management, un fonds activiste connu pour demander des changements stratégiques au sein des groupes dans lesquels il investit. Les investisseurs ne manquent pas de réagir à cetteinformation publiée lundi 31 août par le Financial Times,puisque l'actionAir Liquideprogresse de 3,4%, vers 09h50, ce mardi 1er septembre. Le fonds activiste aurait constitué une participation dansAir Liquideet entamé des discussions avec la société ces dernières semaines, selon le quotidien des affaires citant deux sources proches du dossier. Le Financial Times précise que ni la taille exacte de cette participation et ni les \"recommandations\" d’Elliott n'ont été déterminées à ce jour. L’initiative d'Elliott Investment Management ouvre ainsi la voie à la dernière campagne de ce fonds spéculatif activiste visant un géant européen, ajoute le Financial Times. Air Liquide, dont la capitalisation boursière s'élève à 108 milliards d'euros,ce qui en fait la huitième capitalisation de la Bourse de Paris,serait la cible la plus en vue d'Elliott sur Euronext, remarque le Financial Times. En 2018, le fonds activiste avait fait pressionpour obtenir des changements au sein du groupePernod Ricard, après avoir acquis une participation de 2,5 %. Fondé en 1977,Elliott Management est l'un des plus vieux \"fonds d'investissement alternatif\" au monde. Le fonds activiste s'invite au capital de sociétés affaiblies ou montrant des failles dans leur organisation pour engager ensuite un bas de fer avec leur direction afin d'obtenir gain de cause. C'est sa marque de fabrique. Il faut dire qu'avant de semer la terreur sur les places financières, Paul Singer, diplôme de Harvard en poche, a exercé ses talents comme avocat d'affaires à Wall Street. Le but est toujours le même: mettre la pression sur la direction des sociétés ciblées tant que les résultats ne sont pas à la hauteur des attentes d'Elliott Management. Si nécessaire,le fonds d'investissement ne s’embarrasse à faire preuve de douceur avec son interlocuteur. NiAir Liquide, ni Elliott n'ont répondu aux sollicitations du Financial Times. Le Financial Times remarque aussi qu'Air Liquideaffiche des marges \"à la traîne\" par rapport à celles de son concurrent Linde, coté aux États-Unis dont la capitalisation boursière s'élève à 226 milliards de dollars. \"Les performances d'Air Liquid", "note_humaine": "", "commentaire": "", "note_gemini": 1, "justification_gemini": "L'article contient des faits concrets positifs (solide performance au premier semestre, objectifs annuels confirmés, prévisions de croissance de marge et de résultat net) et des faits concrets négatifs (marges à la traîne par rapport à un concurrent, rendement actionnarial inférieur). Ces signaux contradictoires s'annulent, résultant en un sentiment neutre.", "note_haiku": 2, "justification_haiku": "L'article contient plusieurs faits concrets positifs spécifiques à Air Liquide : (1) l'irruption du fonds activiste Elliott à son capital, ce qui fait progresser l'action de 3,4% ; (2) la confirmation des objectifs annuels après une solide performance au premier semestre ; (3) l'objectif d'augmentation de la marge opérationnelle de 100 points de base hors variation des prix de l'énergie ; (4) la confiance du groupe dans sa capacité à améliorer sa marge de 100 points de base pour 2027. Ces éléments constituent des nouvelles concrètes et positives pour l'entreprise, justifiant une note POSITIVE."}, {"article_id": 26645, "company_id": 15, "entreprise": "TOTALENERGIES", "source": "www.abcbourse.com", "published_at": "2026-03-06", "genre": "article dédié", "titre": "Projet Tilenga  : TotalEnergies publie l'évaluation indépendante du programme d'acquisitions ...", "texte": "(Zonebourse.com) - TotalEnergies , opérateur du projet Tilenga en Ouganda via sa filiale TotalEnergies EP Uganda (TEPU), rend public le rapport d'évaluation indépendant réalisé par le cabinet canadien Land & People Planning Ltd sur le programme d'acquisitions foncières, de relocalisation et de restauration des moyens de subsistance mis en oeuvre dans le cadre du projet Tilenga, ainsi que le plan d'actions adopté par TEPU sur la base des recommandations du rapport. Cette revue fait suite à l'engagement pris par TotalEnergies en 2024. La mission d'évaluation avait initialement été confiée à Lionel Zinsou, qui a informé la compagnie qu'il ne serait pas en mesure de la finaliser en raison de circonstances personnelles liées à sa santé. L'évaluation menée dans les districts de Buliisa, Hoima et Kikuube, a porté sur l'ensemble des composantes du programme d'acquisitions foncières. Le rapport conclut que le programme a été mis en oeuvre dans le respect des engagements du projet en matière d'acquisitions foncières et de relocalisation, en conformité avec la norme de performance 5 de l'IFC, sans déficience systémique majeure identifiée. Il indique en outre que \"les compensations, la remise des logements de remplacement, ainsi que la majorité des mesures de restauration des moyens de subsistance ont été achevées et que le projet est désormais en bonne voie pour engager la phase de clôture du plan d'action de relocalisation\". Entre 2022 et fin 2024, le projet Tilenga a acquis environ 853 hectares de terres, impactant 4 954 foyers et communautés propriétaires ou utilisateurs de parcelles (PAP) et impliquant la relocalisation de 205 résidences principales. A ce jour, plus de 99% des accords de compensation ont été signés et payés, et 100% des logements de relocalisation ont été construits et remis. Sur la base des recommandations du rapport, TEPU mettra en oeuvre un plan d'actions couvrant les axes suivants : - restauration des moyens de subsistance : poursuite du suivi en 2026 afin de garantir l'achèvement et l'appropriation des formations et mesures d'accompagnement (pratiques agronomiques, équipements post-récolte, kits de démarrage d'activités). - soutien aux foyers vulnérables : accompagnement adapté des foyers potentiellement vulnérables, en coordination avec les services des autorités locales. - gestion des griefs : renforcement des outils de suivi et de communication, incluant des FAQ et des messages clés, afin d'assurer cohérence et transparence.- information et concertation : élaboration d'un plan d'engagement dédié à la clôture des plans d'action de relocalisation et des programmes de restauration des moyens de subsistance. - prise en compte du genre : intégration de données par genre dans les bases de données et le reporting de clôture. - clôture : lancement du processus formel de clôture, suivi d'un audit indépendant réalisé par un tiers. Copyright © 2026 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Le rapport d'évaluation indépendant sur le projet Tilenga conclut que le programme d'acquisitions foncières et de relocalisation a été mis en oeuvre en conformité avec les engagements et la norme IFC, sans déficience systémique majeure. Il indique que les compensations et la remise des logements sont achevées, et que le projet est en bonne voie pour la clôture du plan d'action, avec plus de 99% des accords de compensation signés et payés, et 100% des logements construits et remis.", "note_haiku": 1, "justification_haiku": "L'article mentionne TotalEnergies et son projet Tilenga en Ouganda, avec des informations factuelles sur un rapport d'évaluation indépendant concernant les acquisitions foncières et la relocalisation. Le rapport conclut que le programme a été mis en œuvre en conformité avec les engagements et les normes de l'IFC, sans déficience systémique majeure. Cependant, il s'agit d'une communication de conformité et de gestion de projet, sans fait concret positif ou négatif spécifique à l'activité financière ou opérationnelle de TotalEnergies (pas de résultats, contrat gagné, amende, procès, ou dégradation). C'est une simple divulgation d'information sur la mise en œuvre d'un programme de responsabilité sociale."}, {"article_id": 9060, "company_id": 28, "entreprise": "SAINT-GOBAIN", "source": "www.abcbourse.com", "published_at": "2025-12-01", "genre": "article dédié", "titre": "Saint-Gobain accélère son recentrage avec des cessions, en Europe et au Brésil", "texte": "(Zonebourse.com) - Saint-Gobain annonce avoir finalisé la cession de SFIC Belgique le 3 novembre, un distributeur spécialisé dans le plâtre, l'isolation et les plafonds. L'enseigne réalisait un chiffre d'affaires annuel d'environ 75 MEUR, comptait 123 collaborateurs et opérait 10 agences couvrant l'ensemble du territoire belge. Le Groupe annonce également la finalisation, le 1er décembre, de la vente de Tumelero au Brésil, active dans la distribution de matériaux de construction et fortement implantée dans le sud du pays. Tumelero exploite 16 magasins et 1 centre logistique dans l'État de Rio Grande do Sul, employait près de 580 salariés et générait environ 40 MEUR de revenus annuels. Ces deux opérations s'inscrivent dans la stratégie de renforcement du profil du Groupe, en cohérence avec les objectifs du plan \"Lead & Grow\". Copyright © 2025 Zonebourse.com - All rights reserved. Vous avez aimé cet article ? Partagez-le avec vos amis avec les boutons ci-dessous.", "note_humaine": "", "commentaire": "", "note_gemini": 2, "justification_gemini": "Saint-Gobain a finalisé la cession de deux entités (SFIC Belgique et Tumelero) qui s'inscrit dans sa stratégie de renforcement du profil du Groupe, ce qui est présenté comme un fait concret positif pour l'entreprise.", "note_haiku": 1, "justifi
